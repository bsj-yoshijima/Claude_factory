# ローカル開発用の Postgres。本番は Cloud SQL / Supabase を想定しているが、
# スキーマと SQL は同じものが動く（Postgres 16）。
#   起動: docker compose up -d
#   停止: docker compose down          （データは残る）
#   破棄: docker compose down -v       （データも消す）
services:
  db:
    image: postgres:16-alpine
    container_name: claude-factory-db
    environment:
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: factory
      POSTGRES_DB: factory
      # 日次バケットは JST で切るので、DB のタイムゾーンも合わせておく
      TZ: Asia/Tokyo
    ports:
      - "55432:5432"          # ローカルの 5432 とぶつからないようにずらす
    volumes:
      - factory-pgdata:/var/lib/postgresql/data
      # 初回起動時にだけ自動で流れる。以降は server 側の migrate が面倒を見る
      - ./db/schema.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory -d factory"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  factory-pgdata:
