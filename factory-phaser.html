/* ===== 🧑‍🏭 エージェント一覧（スキン変更つき）=====
   常時表示はやめ、左下の稼働/休憩HUD か ☰メニューから開く。開いている間は1秒ごとに更新。 */
let _agentSel=null;                     // スキン選択を開いているプロジェクト(null=閉じている)
function agentRows(){                   // プロジェクト単位に集約(同名エージェントは稼働数をまとめる)
  const list=(window.__factory&&window.__factory.getAgents())||[];
  const by={};
  for(const a of list){ const p=by[a.proj]||(by[a.proj]={proj:a.proj,color:a.color,skinId:'none',n:0,busy:0});
    p.n++; if(a.working)p.busy++; if(a.skinId&&a.skinId!=='none')p.skinId=a.skinId; }
  return Object.values(by);
}
const skinName=(id)=>{ const s=((window.__factory&&window.__factory.skinList)||[]).find(x=>x.id===id); return s?s.n:'デフォルト'; };
/* 被り物の画像(assets/hat-*.png)は未生成のものが多い。
   onerror で DOM を差し替える手は、差分適用のたびに元の <img> へ戻されて
   読み直し→また差し替え…とちらつくので使わない。
   「その画像があるか」を一度だけ判定してキャッシュし、描画は常に決定的にする。 */
const _hatOk=new Map();                     // id -> true(あり) / false(なし・未判定)
function hatReady(id){
  if(!id||id==='none') return false;
  if(_hatOk.has(id)) return _hatOk.get(id);
  _hatOk.set(id,false);                     // 判定がつくまでは「なし」＝絵文字で描く
  const im=new Image();
  im.onload =()=>{ _hatOk.set(id,true); if(_dlg) _dlg.refresh(); };   // 届いたら次の描画から画像に変わる
  im.onerror=()=>{ _hatOk.set(id,false); };
  im.src='assets/hat-'+id+'.png';
  return false;
}
// スキンの見本。画像が無いスキンは絵文字の仮アイコンで出す
function skinThumb(id,px){ const e=(id==='none')?'🧑‍🏭':((BG_META[id]&&BG_META[id].e)||'🎨');
  return hatReady(id)
    ? `<img src="assets/hat-${id}.png" alt="" style="width:${px+16}px;height:${px+16}px;object-fit:contain">`
    : `<span style="font-size:${px}px">${e}</span>`;
}
function openAgents(){
  const esc=(s)=>String(s||'').replace(/[<>&]/g,'');
  return openDialog({ title:'🧑‍🏭 エージェント',
    subtitle:()=>{ const r=agentRows(), n=r.reduce((s,p)=>s+p.n,0), b=r.reduce((s,p)=>s+p.busy,0);
      return `稼働 ${b} / 休憩 ${n-b}`; },
    live:1000,                          // 開いている間は最新の稼働状況に追従
    body:()=>{
      const rows=agentRows(); if(!rows.length) return '<div class="cost" style="padding:12px">稼働中のエージェントがいません。</div>';
      const skins=(window.__factory&&window.__factory.skinList)||[];
      return rows.map(p=>{
        const key=encodeURIComponent(p.proj), nm=esc(p.proj)||'(無名)', open=_agentSel===p.proj;
        const hat=hatReady(p.skinId)?`<img src="assets/hat-${p.skinId}.png" alt="">`:'';
        // 1プロジェクト = 1ノード。data-key で、稼働状況の変化で並びが動いてもノードを持ち回す
        // （＝ 開いているスキン一覧のスクロール位置が live更新で戻らない）
        let h=`<div data-key="ag:${key}"><div class="rc">
          <div class="ic"><span class="lgAv" style="background:${p.color||'#4f7fc4'}"><span class="eye l"></span><span class="eye r"></span>${hat}</span></div>
          <div class="mid"><div class="nm">${nm}${p.n>1?` <span style="color:#9fb0c0;font-size:10px">×${p.n}</span>`:''}</div>
            <div class="cost"><span class="agSt ${p.busy?'on':''}">${p.busy?`🟢 稼働 ${p.busy}/${p.n}`:'💤 休憩'}</span>スキン: ${skinName(p.skinId)}</div></div>
          <button data-agsel="${key}">${open?'閉じる':'🎨 スキン'}</button></div>`;
        // スキンの一覧は長いので行の直下で折りたたみ表示（他の行が押し出されないよう高さを制限）
        if(open) h+=`<div class="grid" style="margin:0 0 12px 8px;max-height:196px;overflow-y:auto">${skins.map(s=>{ const on=p.skinId===s.id;
            return `<div class="cell own" data-key="sk:${s.id}" data-skin="${s.id}" data-proj="${key}" title="${s.n}"
              style="${on?'border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset':''}">${skinThumb(s.id,26)}<small style="color:#cfeee0">${s.n}</small>${on?'<span class="qty">✓</span>':''}</div>`;
          }).join('')}</div>`;
        return h+'</div>';
      }).join('')
      +'<div class="rowline" style="font-size:11px;color:#9fb0c0">「🎨 スキン」から被り物を変更できます。画像が未生成のスキンは仮アイコン表示で、アセット到着までは見た目がデフォルトのままです。</div>';
    },
    onRender:(p,d)=>{
      p.querySelectorAll('[data-agsel]').forEach(el=>el.onclick=()=>{
        const pj=decodeURIComponent(el.dataset.agsel); _agentSel=(_agentSel===pj)?null:pj; d.refresh(); });
      p.querySelectorAll('[data-skin]').forEach(el=>el.onclick=()=>{
        const pj=decodeURIComponent(el.dataset.proj);
        if(!window.__factory) return;
        window.__factory.applySkin(pj, el.dataset.skin);   // scene側で this.skins更新＋window.__skinChangedで永続化
        toast(`${pj||'(無名)'} → ${skinName(el.dataset.skin)}`); d.refresh(); });
    } });
}
document.getElementById('agentsBtn').addEventListener('click',()=>{ if(!window.__factory){ toast('準備中…'); return; } openAgents(); });
document.getElementById('hud').addEventListener('click',()=>{ if(!window.__factory){ toast('準備中…'); return; } openAgents(); });
document.getElementById('hud').title='クリックでエージェント一覧';

/* ===== ショップ（景品の売却＋購入/強化） ===== */
/* マルチユーザー版では 💰 の増減は必ずサーバが決める（クライアントの申告を信じない） */
async function apiBuy(kind,id,okMsg){
  const r=await NET.call('POST','/api/shop/buy',{kind,id});
  if(!r) return false; applyFactory(r.factory); updateBadge(); if(okMsg) toast(okMsg); return true;
}
function sellPrize(id,qty){ const p=PRIZES.find(x=>x.id===id); const have=G.inv[id]||0; qty=Math.min(qty,have); if(qty<=0)return;
  if(NET.multi){ NET.call('POST','/api/shop/sell',{itemId:id,qty}).then(r=>{ if(!r)return;
    applyFactory(r.factory); G.inv[id]=Math.max(0,have-qty); updateBadge();
    toast(`${p.e} ${p.n}×${qty} を売却 (+💰${r.gain})`); }); return; }
  G.inv[id]=have-qty; const gain=SELL[p.r]*qty; G.money+=gain; saveGame(); updateBadge(); toast(`${p.e} ${p.n}×${qty} を売却 (+💰${gain})`); }
// 購入=在庫(owned)に追加。設置は編集パレットから床クリックで行う
function buyMachine(type){ if(!MACH[type])return; const pr=MACH[type].price; if(G.money<pr)return;
  if(NET.multi) return void apiBuy('machine',type,`${MACH[type].e} ${MACH[type].n} を購入（🔧編集で設置）`);
  G.money-=pr; addStock('machine',type); saveGame(); updateBadge(); toast(`${MACH[type].e} ${MACH[type].n} を購入（🔧編集で設置）`); }
function levelUp(id){ const e=(G.layout||[]).find(x=>x.id===id&&x.kind==='machine'); if(!e)return; const c=lvCost(e.lvl); if(G.money<c)return;
  if(NET.multi){ NET.call('POST','/api/machine/level',{id}).then(r=>{ if(!r)return;
    applyFactory(r.factory);
    const lv=(r.factory.machines.find(x=>x.id===id)||{}).lvl;
    if(window.__scene&&lv)window.__scene.setMachineLevel(id,lv);
    updateBadge(); toast(`Lv${lv} に強化！`); }); return; }
  G.money-=c; e.lvl++;
  const M=MACH[machVariant(e.variant)];
  if(window.__scene)window.__scene.setMachineLevel(id,e.lvl); snapLayout(); saveGame(); updateBadge(); toast(`${M.e} ${M.n} を Lv${e.lvl} に強化！`); }
// 素材スロットの要約（ショップ一覧用）。何が作れるかは伏せ、素材と稼働状態だけ出す
function slotSummary(e){ const mats=[...new Set((e.slots||[]).filter(Boolean))].sort();
  if(!mats.length) return '素材未設定';
  const icons=mats.map(m=>(MAT[m]||{}).e||'?').join('');
  return `${icons}${machState(e.id).running?' ・ ⚙️製造中':''}`; }
function buyDeco(t){ const pr=DECO[t].price; if(G.money<pr)return;
  if(NET.multi) return void apiBuy('deco',t,`${DECO[t].e} ${DECO[t].n} を購入（🔧編集で設置）`);
  G.money-=pr; addStock('deco',t); saveGame(); updateBadge(); toast(`${DECO[t].e} ${DECO[t].n} を購入（🔧編集で設置）`); }
function buyProp(t){ const pr=PROP[t].price; if(G.money<pr)return;
  if(NET.multi) return void apiBuy('prop',t,`${PROP[t].n} を購入（🔧編集で設置）`);
  G.money-=pr; addStock('prop',t); saveGame(); updateBadge(); toast(`${PROP[t].n} を購入（🔧編集で設置）`); }
function selectBg(k){
  if(NET.multi){ apiBuy('bg',k).then(okk=>{ if(okk&&window.__scene&&window.__scene.setSkyTheme) window.__scene.setSkyTheme(k); }); return; }
  if(!G.bgOwned.includes(k)){ const pr=BG[k].price; if(G.money<pr)return; G.money-=pr; G.bgOwned.push(k); toast(`背景「${BG[k].n}」を購入！`); } G.bg=k; if(window.__scene&&window.__scene.setSkyTheme)window.__scene.setSkyTheme(k); saveGame(); updateBadge(); }
function selectFloor(k){
  if(NET.multi){ apiBuy('floor',k).then(okk=>{ if(okk&&window.__scene&&window.__scene.setFloor) window.__scene.setFloor(k); }); return; }
  if(!G.floorOwned.includes(k)){ const pr=FLOOR[k].price; if(G.money<pr)return; G.money-=pr; G.floorOwned.push(k); toast(`床材「${FLOOR[k].n}」を購入！`); } G.floor=k; if(window.__scene&&window.__scene.setFloor)window.__scene.setFloor(k); saveGame(); updateBadge(); }
function buySeries(k){ const S=SERIES[k];
  if(NET.multi){ apiBuy('series',k,`${S.n} シリーズを適用`).then(okk=>{ if(okk&&window.__scene){
    window.__scene.setSkyTheme(S.sky); window.__scene.setFloor(S.floor); } }); return; }
  if(!G.seriesOwned.includes(k)){ if(G.money<S.price)return; G.money-=S.price; G.seriesOwned.push(k);
    if(window.__scene) for(const e of S.decos) window.__scene.placeEmojiDeco(e); snapLayout(); toast(`${S.n} シリーズを購入！内装と装飾を反映`); }
  G.bg=S.sky; G.floor=S.floor; if(window.__scene){ window.__scene.setSkyTheme(S.sky); window.__scene.setFloor(S.floor); } saveGame(); updateBadge(); }

let _shopTab='sell';
const SHOP_TABS=[['sell','💵 売却'],['mach','🏭 製造機'],['equip','🧰 設備'],['decor','🎨 内装'],['series','🌏 シリーズ']];
function shopBody(){
    let body='';
    if(_shopTab==='sell'){
      const owned=PRIZES.filter(p=>G.inv[p.id]>0);
      body = owned.length ? owned.map(p=>{ const have=G.inv[p.id],col=RAR[p.r].c;
        return `<div class="rc"><div class="ic">${p.e}</div><div class="mid"><div class="nm">${p.n} <span style="color:${col};font-size:10px">${RAR[p.r].n}</span> ×${have}</div>
          <div class="cost">売却額 💰${SELL[p.r]} /個</div></div>
          <button data-sell="${p.id}" data-q="1">1個</button><button data-sell="${p.id}" data-q="all" style="margin-left:5px">全部</button></div>`;
      }).join('') : '<div class="cost" style="padding:12px">売れる景品がありません。🎁ガチャで景品を集めよう。</div>';
    } else if(_shopTab==='mach'){
      body = '<div class="cost" style="margin:2px 0 6px">設置済みの製造機（Lv↑で生産量が増える。素材は🏭製造タブでセット）</div>';
      const machs=(G.layout||[]).filter(e=>e.kind==='machine');
      body += (machs.length?machs:[]).map(e=>{ const c=lvCost(e.lvl), M=MACH[machVariant(e.variant)];
        return `<div class="rc"><div class="ic">${M.e}</div>
        <div class="mid"><div class="nm">${M.n} <span style="color:#7fe6ff;font-size:11px">Lv${e.lvl}</span></div>

        <button data-lv="${e.id}" ${G.money>=c?'':'disabled'}>強化</button></div>`; }).join('') || '<div class="cost" style="padding:6px 2px">未設置。🔧編集で在庫から設置</div>';
      body += '<div class="cost" style="margin:12px 0 6px">製造機を購入（マス数が多いほど素材を多く入れられる＝作れる物が増える）</div>';
      body += Object.keys(MACH).map(t=>`<div class="rc"><div class="ic">${MACH[t].e}</div>
        <div class="mid"><div class="nm">${MACH[t].n} <span style="color:#9fb0c0;font-size:10px">在庫 ${availN('machine',t)}</span></div><div class="cost">💰${MACH[t].price.toLocaleString()}</div></div>
        <button data-buymach="${t}" ${G.money>=MACH[t].price?'':'disabled'}>購入</button></div>`).join('');
    } else if(_shopTab==='equip'){
      body = '<div class="cost" style="margin:2px 0 8px">購入すると在庫に入ります。設置は 🔧編集 のパレットから床をクリック。</div>';
      body += '<div class="cost" style="margin:12px 0 6px">装飾プロップ（Stitch製）</div>';
      for(const [th,label] of PROP_GROUPS){
        const all=Object.keys(PROP).filter(t=>(PROP[t].th||'')===th);
        if(!all.length) continue;
        body += `<div class="cost" style="margin:10px 0 4px;color:#7fe6ff">${label}</div>`;
        // 基本家具(全テーマ共通スロット)と名物(そのテーマだけの一点物)を分けて並べる
        const ks=[...all.filter(t=>PROP[t].fu), ...all.filter(t=>!PROP[t].fu)];
        body += ks.map(t=>{ const sp=(window.PROP_SPAN||{})[t]||1;   // 占有コマ数(見た目の大きさ)
          return `<div class="rc"><div class="ic">${PROP[t].e}</div>
          <div class="mid"><div class="nm">${PROP[t].n} <span style="color:#9fb0c0;font-size:10px">在庫 ${ownedN('prop',t)}</span></div>
          <div class="cost">💰${PROP[t].price}${sp>1?` ・ ${sp}コマ`:''}</div></div>
          <button data-prop="${t}" ${G.money>=PROP[t].price?'':'disabled'}>購入</button></div>`; }).join('');
      }

      +'<br>設置済みはドラッグで移動 / 🗑ゴミ箱へドラッグで撤去 ・ クリックで設定パネル（↻回転・✥移動／素材は🏭製造タブ）';

  const view=`${editCat}/${propFilter}/${selMode?1:0}`;

/* ===== 編集モードの寄せ =====
   パレットを盤面に重ねると工場が隠れるので、編集中は工場を右へスッと寄せ、空いた左にパレットを出す。
   寄せ方は CSS(#wrap.editing #game の width と margin-left)に任せ、盤面は残り幅いっぱいまで広げる。
   Phaser(Scale.FIT) は親要素の大きさを 500ms ごとのポーリングでしか見に行かないので、
   アニメ中だけ毎フレーム scale.refresh() を叩いて、描画も当たり判定もぬるっと追従させる。 */

  requestAnimationFrame(tick);
}

     裏に回っている間は pollWp 側で止まる。 */
  setInterval(pollWp, NET.multi?5000:3000);
  if(NET.multi) document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') pollWp(); });
  const q=new URLSearchParams(location.search);
  if(q.get('unlockall') && NET.multi){ toast('マルチユーザー版では ?unlockall は使えません（💰はサーバが管理）'); }
  else if(q.get('unlockall')){   // 全背景・全アイテムを所持(テスト用)。何度開いても増殖しないよう max で設定
    G.bgOwned=Array.from(new Set([...G.bgOwned,'auto',...SKY_THEMES]));
    G.seriesOwned=Array.from(new Set([...G.seriesOwned,...ROOM_THEMES]));
    G.floorOwned=Array.from(new Set([...G.floorOwned,...Object.keys(FLOOR)]));
    G.money=Math.max(G.money,999999);
    for(const t of Object.keys(MACH)) G.stock.machine[t]=Math.max(3,G.stock.machine[t]||0);
    for(const t of Object.keys(PROP)) G.stock.prop[t]=Math.max(3,G.stock.prop[t]||0);
    for(const t of Object.keys(DECO)) G.stock.deco[t]=Math.max(3,G.stock.deco[t]||0);
    saveGame(); updateBadge(); toast('✅ 全背景・全アイテムを解放しました（在庫）');
  }
  if(q.get('edit')){ paletteEl.classList.add('show'); document.getElementById('editFab').classList.add('on');
    wrapEl.classList.add('editing'); slideGame(); renderPalette(); }
  if(q.get('shop'))openShop(q.get('shop')==='1'?undefined:q.get('shop'));
});
</script>
</body>
