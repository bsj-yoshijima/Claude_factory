<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🏭 Claude Factory (Phaser)</title>
<style>
  :root{ --ink:#e6fff4; --gold:#ffd27a; --mint:#9fdcc6; --panel:rgba(16,24,26,.82); --edge:#2c4740; }
  html,body{height:100%;margin:0;background:radial-gradient(120% 120% at 50% 30%,#1b232b 0%,#0c1014 70%);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--ink);overflow:hidden}
  #wrap{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
  #game{width:min(1300px,96vw);aspect-ratio:1024/572}
  #game canvas{image-rendering:pixelated;border-radius:8px;box-shadow:0 24px 80px rgba(0,0,0,.6)}
  .tab{background:var(--panel);color:var(--mint);border:1px solid var(--edge);border-radius:8px;padding:5px 12px;cursor:pointer;backdrop-filter:blur(3px)}
  .tab:hover{border-color:var(--mint)}
  /* ===== ハンバーガーメニュー（主要機能以外はここに畳む） ===== */
  #menuBtn{position:absolute;top:10px;right:12px;z-index:11;cursor:pointer;font-size:16px;line-height:1;
           background:var(--panel);border:1px solid var(--edge);border-radius:8px;padding:7px 11px;color:var(--mint);backdrop-filter:blur(3px)}
  #menuBtn:hover{border-color:var(--mint)}
  #menu{position:absolute;top:46px;right:12px;z-index:11;display:none;flex-direction:column;gap:2px;min-width:172px;
        background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:6px;backdrop-filter:blur(5px)}
  #menu.show{display:flex}
  #menu .mi{padding:8px 11px;border-radius:7px;cursor:pointer;font-size:12px;color:var(--ink);text-decoration:none;display:block}
  #menu .mi:hover{background:#1d262c;color:var(--gold)}
  /* 役割ごとの小見出しと区切り（工場 / 仲間 / 記録） */
  #menu .mh{font-size:9px;letter-spacing:.14em;color:#7f9a92;text-transform:uppercase;padding:5px 11px 3px}
  #menu .msep{height:1px;background:var(--edge);margin:5px 6px}
  /* ===== 今日の労働量（このゲームの主役の数字。製造設定とは分ける） ===== */
  /* 実績ボードと製造設定は横並び。幅が足りなければ上下に折り返す */
  /* 左の #note と右の☰に被らないよう、左右の余白を非対称に確保して
     その内側で中央寄せする。vw から一律に引くと狭い画面で必要以上に縮む。 */
  #topwrap{position:absolute;top:10px;left:160px;right:70px;margin:0 auto;z-index:7;display:flex;gap:10px;
           flex-wrap:wrap;justify-content:center;align-items:stretch;
           width:fit-content;max-width:min(1040px,100%)}
  #board{display:flex;gap:0;flex:none;align-items:center;
         background:var(--panel);border:1px solid var(--edge);border-radius:12px;overflow:hidden;backdrop-filter:blur(4px)}
  #board .m{padding:8px 22px;text-align:center;min-width:126px}
  #board .m+.m{border-left:1px solid var(--edge)}
  #board .v{font-size:27px;line-height:1.1;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
  #board .v small{font-size:12px;color:#9fdcc6;font-weight:400;margin-left:2px}
  #board .l{font-size:9.5px;color:#9fb0c0;letter-spacing:.06em;margin-top:1px}
  #board .m.prod .v{color:#7fe6ff}
  /* 工場レイアウト編集は常時アクセスできるよう右下に固定 */
  #editFab{position:absolute;right:12px;bottom:12px;z-index:9;cursor:pointer;font-size:12px;
           background:var(--panel);border:1px solid var(--edge);border-radius:9px;padding:8px 13px;color:var(--mint);backdrop-filter:blur(3px)}
  #editFab:hover{border-color:var(--mint)}
  #editFab.on{background:#78d0a6;border-color:#78d0a6;color:#17251f;font-weight:700}
  /* 稼働/休憩は Claude君の絵で示す（稼働=作業ポーズ+火花 / 休憩=座り+☕）。
     常時見えるのはこのコンパクト表示だけ。クリックでエージェント一覧ダイアログを開く。 */
  #hud{position:absolute;left:12px;bottom:12px;z-index:6;display:flex;gap:8px;background:var(--panel);
       border:1px solid var(--edge);border-radius:10px;padding:5px 9px;backdrop-filter:blur(3px);cursor:pointer}
  #hud:hover{border-color:var(--mint)}
  #hud::after{content:'👥▸';align-self:center;font-size:10px;color:#9fdcc6;margin-left:1px}
  #hud .st{position:relative;display:flex;align-items:flex-end;gap:2px}
  #hud .st img{width:30px;height:32px;image-rendering:pixelated;display:block}
  #hud .st .fx{position:absolute;top:-2px;right:12px;font-size:12px;font-style:normal;line-height:1}
  #hud b{font-size:15px;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1.6}
  #hud b.idle{color:#9fdcc6}
  #note{position:absolute;top:10px;left:12px;font-size:10px;color:#9fdcc6;background:var(--panel);padding:4px 9px;border-radius:6px;z-index:6}
  /* エージェントの顔アイコン(体色＋被り物)。エージェント一覧ダイアログで使う */
  .lgH{font-size:9px;letter-spacing:.14em;color:#9fdcc6;text-transform:uppercase;margin-bottom:1px}
  .lgAv{position:relative;width:22px;height:22px;border-radius:6px;flex:none;border:1px solid #0006;overflow:hidden;display:inline-block}
  .lgAv .eye{position:absolute;top:8px;width:3px;height:3px;background:#241713;border-radius:1px}
  .lgAv .eye.l{left:5px} .lgAv .eye.r{right:5px}
  .lgAv img{position:absolute;left:50%;top:-3px;transform:translateX(-50%);width:24px;height:auto;image-rendering:pixelated}
  /* 稼働/休憩バッジ */
  .agSt{display:inline-block;font-size:10px;padding:1px 7px;border-radius:99px;border:1px solid var(--edge);color:#9fdcc6;margin-right:5px}
  .agSt.on{color:#7fe6ff;border-color:#2f5c6b}
  /* overlay */
  #overlay{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(6,10,12,.72);backdrop-filter:blur(4px)}
  #overlay.show{display:flex}
  /* 固定サイズ: 中身が変わっても外枠がガタつかない。内部(.pbody)だけスクロール。
     共通ダイアログは 見出し(.dlgHead) / 本文(.pbody) / 操作(.dlgFoot) の縦3段。 */
  #panel{position:relative;background:#12181c;border:1px solid var(--edge);border-radius:12px;padding:16px 20px;width:min(680px,92vw);height:min(72vh,560px);overflow:hidden;
         display:flex;flex-direction:column}
  .pbody{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-right:6px}
  #panel h2{margin:0 0 8px;font-size:16px;color:var(--gold);padding-right:22px}
  #panel .close{position:absolute;top:8px;right:14px;font-size:20px;color:#9fb0c0;cursor:pointer;z-index:2}
  #panel .close:hover{color:var(--gold)}
  .dlgHead{flex:none}
  .dlgHead .sttabs{margin:6px 0 2px}
  .dlgSub{font-size:12px;color:#9fb0c0;font-weight:400;margin-left:8px}
  .dlgFoot{flex:none;display:flex;gap:8px;align-items:center;justify-content:flex-end;
           border-top:1px solid var(--edge);margin-top:10px;padding-top:10px}
  .dbtn{background:var(--gold);color:#243b34;font-weight:700;border:none;border-radius:8px;padding:9px 16px;cursor:pointer;font-family:inherit;font-size:12px}
  .dbtn.ghost{background:#3a4a45;color:#cfeee0}
  .dbtn:disabled{background:#33403c;color:#7f8f89;cursor:not-allowed}
  .rowline{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0;font-size:12px}
  .btn{background:var(--gold);color:#243b34;font-weight:700;border:none;border-radius:8px;padding:9px 16px;cursor:pointer;font-family:inherit;font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,66px);gap:8px;margin-top:6px}
  .cell{width:66px;height:80px;border-radius:8px;border:2px solid #333;background:#0e1417;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:28px;position:relative;cursor:pointer}
  .cell small{font-size:8px;margin-top:1px} .cell .cnt{position:absolute;bottom:2px;right:5px;font-size:9px;color:#fff}
  .cell.own:hover{box-shadow:0 0 0 2px var(--gold) inset}
  .cardwrap{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:100px;align-items:center;margin:6px 0}
  .card{width:72px;height:94px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:32px;border:2px solid #fff;animation:pop .45s ease both}
  .card small{font-size:9px;font-weight:700;margin-top:2px}
  @keyframes pop{0%{transform:scale(.2) rotate(-8deg);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1)}}
  /* トーストは盤面の上に一瞬出るだけ。ドラッグ中に出てもポインタを奪わない */
  #toast{position:absolute;bottom:70px;left:50%;transform:translateX(-50%);background:var(--panel);color:var(--ink);padding:8px 16px;border-radius:8px;z-index:7;display:none;font-size:12px;pointer-events:none}
  /* craft */
  .invbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;background:#0e1417;border:1px solid var(--edge);border-radius:8px;padding:7px 9px;margin:6px 0;font-size:12px}
  .chip{display:inline-flex;align-items:center;gap:3px;background:#1a2228;border-radius:6px;padding:2px 7px}
  .chip b{color:#eafff4}
  .sttabs{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0 4px}
  .sttab{background:#141b20;border:1px solid var(--edge);border-radius:8px 8px 0 0;padding:5px 11px;cursor:pointer;font-size:12px;color:#9fdcc6}
  .sttab.on{background:#1d262c;border-color:var(--gold);color:var(--gold)}
  .rc{display:flex;align-items:center;gap:10px;background:#10171b;border:1px solid #243036;border-radius:9px;padding:8px 11px;margin:6px 0}
  .rc .ic{font-size:26px;width:34px;text-align:center}
  .rc .mid{flex:1;min-width:0}
  .rc .nm{font-size:13px;color:#eafff4;font-weight:700}
  .rc .cost{font-size:11px;color:#9fb0c0;margin-top:2px}
  .rc .cost .lack{color:#e0674e}
  .rc button{background:var(--gold);color:#243b34;font-weight:700;border:none;border-radius:7px;padding:8px 13px;cursor:pointer;font-family:inherit;font-size:12px}
  .rc button:disabled{background:#33403c;color:#7f8f89;cursor:not-allowed}
  .locked{opacity:.5}
  /* tech map */
  .map{display:flex;flex-direction:column;gap:2px}
  .tier{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:7px 0}
  .tlab{font-size:10px;color:#9fb0c0;width:74px;flex:none}
  .node{display:inline-flex;flex-direction:column;align-items:center;background:#131b20;border:1px solid var(--edge);border-radius:8px;padding:6px 9px;min-width:60px}
  .node.mach{border-color:#c98b52} .node.mat{border-color:#4a6b7a} .node .e{font-size:22px} .node small{font-size:9px;color:#cfeee0;margin-top:1px}
  .arrow{color:#5f7a72;font-size:16px}
  /* 編集パレット
     盤面の下1/4に重なるので、枠や余白でキャンバスのドラッグを塞がないよう
     コンテナは pointer-events:none。実際に押せる要素(カテゴリ・アイテム)だけ auto に戻す。 */
  #palette{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);z-index:8;display:none;flex-direction:column;gap:7px;background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:9px 11px;backdrop-filter:blur(4px);pointer-events:none}
  #palette.show{display:flex}
  .pcat{display:flex;gap:5px;flex-wrap:wrap;pointer-events:none}
  .pcat .c{background:#141b20;border:1px solid var(--edge);border-radius:7px;padding:4px 11px;cursor:pointer;font-size:12px;color:#9fdcc6;pointer-events:auto}
  .pcat .c.on{border-color:var(--gold);color:var(--gold);background:#1d262c}
  /* 装飾のテーマ絞り込み行。数が多いので少し小さめ＋横スクロールで1〜2段に収める */
  .pfil{max-width:min(860px,90vw);max-height:56px;overflow-y:auto;pointer-events:none}
  .pfil .c{font-size:11px;padding:3px 8px;pointer-events:auto}
  .pitems{display:flex;gap:6px;flex-wrap:wrap;width:min(860px,90vw);max-height:132px;overflow-y:auto;pointer-events:none}
  .pitem{width:62px;height:64px;border:2px solid #2c3a38;border-radius:8px;background:#0e1417;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;cursor:pointer;position:relative;pointer-events:auto}
  .pitem:hover{border-color:#5f8a80}
  .pitem.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
  .pitem.cur{border-color:#7fe6ff}
  .pitem small{font-size:8px;color:#cfeee0;margin-top:1px;max-width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pitem .qn{position:absolute;top:1px;right:4px;font-size:9px;color:#7fe6ff;font-weight:700}
  .pitem.dim{opacity:.4;cursor:default}
  .phint{font-size:10px;color:#9fb0c0}
  /* ===== 製造のコンパクト表示（いま作っている物とWPだけ）。クリックで🏭製造ダイアログ ===== */
  #craft{background:var(--panel);border:1px solid var(--edge);border-radius:11px;padding:7px 12px;font-size:11px;
         backdrop-filter:blur(4px);display:flex;align-items:center;gap:9px;cursor:pointer;
         width:fit-content;max-width:min(340px,100%)}
  #craft:hover{border-color:var(--mint)}
  #craft .pe{font-size:25px;line-height:1;flex:none}
  #craft .mid{min-width:132px}
  #craft .nm{font-size:11px;color:#eafff4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
  #craft .kv{display:flex;justify-content:space-between;gap:9px;color:#9fb0c0;font-size:10px;margin-top:2px}
  #craft .kv b{color:#eafff4;font-variant-numeric:tabular-nums}
  #craft .kv .run{color:#7fe6ff}
  #craft .bar{height:7px;background:#0d1315;border:1px solid var(--edge);border-radius:4px;overflow:hidden;margin-top:3px}
  #craft .bar>i{display:block;height:100%;background:linear-gradient(90deg,#78d0a6,var(--gold));width:0}
  #craft .go{font-size:10px;color:#9fdcc6;flex:none}
  /* ===== 🏭製造ダイアログ: 原材料のマスとWPの進捗 ===== */
  .mslots{display:flex;gap:7px;flex-wrap:wrap}
  .mslot{position:relative;width:76px;height:66px;border:2px dashed #33443f;border-radius:9px;background:#0e1417;
         display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
  .mslot:hover{border-color:#5f8a80}
  .mslot.set{border-style:solid;border-color:var(--mint)}
  .mslot.pick{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
  .mslot .e{font-size:24px;line-height:1}
  .mslot small{font-size:9px;color:#cfeee0;margin-top:2px}
  .mslot .x{position:absolute;top:0;right:5px;font-size:11px;color:#9fb0c0}
  .mslot .x:hover{color:#ff9f7a}
  .wpline{margin-top:14px;border-top:1px solid var(--edge);padding-top:9px}
  /* 製造ダイアログ: 1台=1行の縦一覧（タブで切り替えず一覧性を優先） */
  .mrow{background:#10171b;border:1px solid #243036;border-radius:11px;padding:10px 12px;margin:0 0 10px}
  .mrow.run{border-color:#3f6b58;background:#111d1a}
  .mrowH{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:9px}
  .mrowH b{font-size:13px;color:#eafff4}
  .mrowH .grow{flex:1}
  .mtag{font-size:10px;color:#9fb0c0;background:#0e1417;border:1px solid var(--edge);border-radius:99px;padding:1px 8px}
  .mst{font-size:10px;color:#9fb0c0}
  .mst.on{color:#8ff0bd}
  .mrow .wpline{margin-top:10px;padding-top:8px}
  .mrow .dbtn{padding:7px 13px;font-size:12px}
  .wpline .kv{display:flex;justify-content:space-between;color:#9fb0c0;font-size:11px}
  .wpline .kv b{color:#eafff4;font-variant-numeric:tabular-nums}
  .wpline .bar{height:9px;background:#0d1315;border:1px solid var(--edge);border-radius:5px;overflow:hidden;margin-top:5px}
  .wpline .bar>i{display:block;height:100%;background:linear-gradient(90deg,#78d0a6,var(--gold));width:0}
  /* メニューのドロップダウンと重ならないよう右の中央に置く */
  #doneBtn{position:absolute;top:50%;right:12px;transform:translateY(-50%);z-index:8;display:none;cursor:pointer;
           font-size:12px;background:var(--gold);color:#243b34;font-weight:700;padding:9px 14px;border-radius:9px;
           box-shadow:0 6px 20px rgba(0,0,0,.45)}
  #doneBtn.show{display:block}
  #doneN{background:#243b34;color:var(--gold);border-radius:99px;padding:0 6px;margin-left:3px;font-size:10px}
  /* 完成品 / 製品図鑑 のグリッド */
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:7px}
  .pcard{position:relative;background:#10171b;border:1px solid #243036;border-radius:9px;padding:8px 4px;text-align:center}
  .pcard .e{font-size:28px;line-height:1.1}
  .pcard .nm{font-size:10px;color:#eafff4;margin-top:2px}
  .pcard .rr{font-size:9px;margin-top:1px}
  .pcard .qn{font-size:9px;color:#7fe6ff}
  .pcard.miss{opacity:.28}
  .pcard .new{position:absolute;top:-5px;left:-4px;background:#ff5d6c;color:#fff;font-size:8px;
              font-weight:700;padding:1px 5px;border-radius:99px;transform:rotate(-8deg)}
</style>
</head>
<body>
<div id="wrap">
  <div id="game"></div>
  <div id="note">🏭 Claude Factory</div>
  <div id="menuBtn" title="メニュー">☰</div>
  <div id="menu">
    <div class="mh">工場</div>
    <div class="mi" id="craftBtn">🏭 製造（原材料セット）</div>
    <div class="mi" id="shopBtn">🏪 ショップ</div>
    <div class="mi" id="editMenuBtn">🔧 レイアウト編集</div>
    <div class="msep"></div>
    <div class="mh">仲間</div>
    <div class="mi" id="agentsBtn">🧑‍🏭 エージェント（スキン変更）</div>
    <div class="msep"></div>
    <div class="mh">記録</div>
    <div class="mi" id="dexBtn">📖 図鑑</div>
    <div class="mi" id="lbBtn">🏆 リーダーボード</div>
    <a class="mi" href="/metrics">📊 メトリクス</a>
  </div>
  <div id="topwrap">
    <div id="board"></div>
    <div id="craft"></div>
  </div>
  <div id="doneBtn">🎁 完成品 <span id="doneN"></span></div>
  <div id="editFab">🔧 レイアウト編集</div>
  <div id="hud"></div>
  <div id="palette"></div>
  <div id="toast"></div>
  <div id="overlay"><div id="panel"></div></div>
</div>
<script src="vendor/phaser.min.js"></script>
<script src="game/main.js"></script>
<script>
'use strict';
/* ===== ガチャ / コレクション(現行版と共通ロジック・実トークン連動) ===== */
const RAR={1:{n:'N',c:'#9fb0c0',w:58},2:{n:'R',c:'#5fa8e0',w:27},3:{n:'SR',c:'#b57be0',w:11},4:{n:'SSR',c:'#f6c04a',w:3.2},5:{n:'UR',c:'#ff5d6c',w:0.8}};
const PRIZES=[
  {id:'p_bolt',e:'🔩',n:'謎のボルト',r:1},{id:'p_clip',e:'📎',n:'クリップ',r:1},{id:'p_cone',e:'🚧',n:'コーン',r:1},{id:'p_seed',e:'🌱',n:'観葉の芽',r:1},
  {id:'p_guitar',e:'🎸',n:'ギター',r:2},{id:'p_lamp',e:'💡',n:'ランプ',r:2},{id:'p_bronze',e:'🥉',n:'銅トロフィー',r:2},
  {id:'p_robot',e:'🤖',n:'ロボ人形',r:3},{id:'p_arcade',e:'🕹️',n:'アーケード',r:3},{id:'p_gold',e:'🥇',n:'金メダル',r:3},
  {id:'p_crystal',e:'💎',n:'クリスタル',r:4},{id:'p_rocket',e:'🚀',n:'ロケット',r:4},
  {id:'p_crown',e:'👑',n:'王冠',r:5},{id:'p_dragon',e:'🐉',n:'ドラゴン像',r:5},
];

      +(acts.length?`<div class="dlgFoot">${acts.map((a,i)=>
          `<button class="dbtn ${a.kind==='ghost'?'ghost':''}" data-dlgact="${i}"${a.disabled?' disabled':''}>${a.label}</button>`).join('')}</div>`:'');

  if(o.live) _dlgTimer=setInterval(()=>{ if(overlay.classList.contains('show')) refresh(); else closeOverlay(); }, o.live);
  return dlg;
}

   製造プロトタイプ — 抽出機に原材料をセット → 実WPを溜めて製品化
   WP は /api/otel（OTel実測）の累計を参照する。セッション開始時点の累計を
   startWp として記録し、差分を「現セッションWP」として扱う。
   ========================================================================= */
// 1製品あたりの必要WP = マス数 × WP_PER_SLOT。今後変わる可能性があるのでここ1箇所で調整する
const WP_PER_SLOT = 50;
const needWp = (m)=> Math.max(1, (m && m.size) || 1) * WP_PER_SLOT;
// 製品の売価（レア度別）。完成品一覧を開いたタイミングで 💰 に加算される
const PROD_PRICE = {1:60, 2:200, 3:700, 4:2600, 5:9000};
// 原材料をセットできるマス数 = 製造機のマス数(2〜5)。台ごとに1レシピ。

const MAT = Object.fromEntries(MATS.map(m=>[m.id,m]));

// 製品（r は RAR と共通のレア度 1..5 / m は相性のある原材料）
// m は未定義の組み合わせから製品を選ぶときのスコアに使う。これが無いと

  {id:'course',  e:'🏆',n:'伝説のフルコース',r:5,m:['meat','cheese','tomato','butter','rice','veg']},
  // レシピに無い組み合わせのときだけ出る。組み合わせを探す動機になる「ハズレ枠」
  {id:'blob',    e:'🪨',n:'謎のカタマリ',   r:1,m:[]},

const BLOB='blob';
const PROD = Object.fromEntries(PRODS.map(p=>[p.id,p]));

// 組み合わせ（重複を除いた原材料のソート済みキー）→ 出うる製品5種
const RECIPES = {
  'egg,milk,sugar'      : ['pudding','icecream','parfait','crepe','honeytoast'],
  'butter,egg,flour'    : ['cookie','cake','donut','croissant','deco'],
  'egg,flour,milk'      : ['pancake','crepe','bread','cake','cupcake'],
  'flour,milk'          : ['bread','pancake','croissant','crepe','cupcake'],
  'egg,milk'            : ['pudding','omelet','icecream','pancake','parfait'],
  'meat,noodle'         : ['cupnoodle','ramen','pasta','curry','soup'],
  'meat,rice'           : ['curry','onigiri','bento','sushi','soup'],
  'cheese,flour,tomato' : ['pizza','gratin','pasta','sandwich','burger'],
  'meat,veg'            : ['salad','burger','taco','soup','bento'],
  'butter,choco,flour'  : ['cookie','donut','cupcake','cake','deco'],
  'choco,milk'          : ['icecream','pudding','crepe','parfait','cupcake'],
  'cheese,meat,veg'     : ['burger','taco','sandwich','gratin','pizza'],
  'rice,veg'            : ['onigiri','salad','bento','soup','sushi'],
  'egg,flour'           : ['bread','pancake','cookie','omelet','croissant'],
  'noodle,veg'          : ['cupnoodle','ramen','pasta','salad','soup'],
  'butter,veg'          : ['fries','salad','soup','gratin','omelet'],
  'cheese,meat,tomato'  : ['course','burger','pizza','pasta','gratin'],
};

// 未定義の組み合わせは、組み合わせ文字列から「決定的に」5種を選ぶ。
// Math.random にすると開き直すたび候補が変わってしまうため、必ずハッシュ由来にする。
// レシピに定義された組み合わせだけが製品になる。
// それ以外は「🪨 謎のカタマリ」。組み合わせを当てにいく動機がこれで生まれる。
function poolFor(key){
  const r=RECIPES[key];
  return (r && r.length) ? r.filter(id=>PROD[id]) : [BLOB];
}
// 5種の中からレア度で重み付けして1つ引く（同じ組み合わせでも出るものが変わる）
function rollProduct(key){
  const pool=poolFor(key).map(id=>PROD[id]).filter(Boolean); if(!pool.length) return null;
  const ws=pool.reduce((s,p)=>s+RAR[p.r].w,0); let x=Math.random()*ws;
  for(const p of pool){ x-=RAR[p.r].w; if(x<=0) return p; }
  return pool[pool.length-1];
}

// 旧セーブ移行: 原材料は「機械ID→素材1つ」だった。いまは機械のマスに入るので1マス目へ移す。
let _matsMigrated=false;
function migrateCraftMats(){
  if(_matsMigrated) return; const F=window.__factory; if(!F) return; _matsMigrated=true;
  const c=craftState(); const keys=Object.keys(c.mats||{}); if(!keys.length) return;
  let moved=0;
  for(const id of keys){ if(F.setSlot(id, 0, c.mats[id])) moved++; }
  c.mats={}; if(moved){ snapLayout(); saveGame(); toast(`原材料 ${moved} 件を製造機のマスへ移しました`); }
}
function craftState(){
  if(!G.craft||typeof G.craft!=='object') G.craft={};
  const c=G.craft;
  if(!c.mats||typeof c.mats!=='object') c.mats={};
  if(c.activeId===undefined) c.activeId=null;
  if(!Array.isArray(c.made)) c.made=[];
  if(!c.dex||typeof c.dex!=='object') c.dex={};
  // 製造は機械ごとに独立。mach[id] = {running, wp}
  if(!c.mach||typeof c.mach!=='object') c.mach={};
  // 旧セーブ移行: 単一セッション → いま選んでいた機械を稼働中にする
  if(c.session&&typeof c.session==='object'){
    const id=c.activeId; if(id){ if(!c.mach[id]) c.mach[id]={running:true,wp:0}; else c.mach[id].running=true; }
    c.session=null;
  } else if(c.session) c.session=null;
  return c;
}
/* 機械1台ぶんの製造状態。WPは「稼働中に稼いだ分の累積」。
   稼いだWPは台数で按分せず、稼働中の全機械に同額を加算する。 */
function machState(id){
  const c=craftState();
  if(!c.mach[id]||typeof c.mach[id]!=='object') c.mach[id]={running:false, wp:0};
  const st=c.mach[id];
  if(typeof st.wp!=='number'||!isFinite(st.wp)||st.wp<0) st.wp=0;
  st.running=!!st.running;
  return st;
}
const keyOfSlots = (slots)=>{ const set=[...new Set((slots||[]).filter(Boolean))].sort();
  return set.length?set.join(','):null; };
// 一覧はマス数の昇順。番号は設置順で固定しておく（並べ替えても号機名が変わらないように）
function machinesSorted(){
  const ms=machines(), no={}; ms.forEach((m,i)=>no[m.id]=i+1);
  return ms.slice().sort((a,b)=>(a.size-b.size)||(no[a.id]-no[b.id])).map(m=>({...m, no:no[m.id]}));
}
function runningCount(){ return machines().filter(m=>machState(m.id).running).length; }
/* 製造は「1台の製造機」単位。その機械の各マス(2〜5)が原材料スロット。
   activeId = いま製造に使っている機械。未指定なら最初の1台。 */
function machines(){ const s=window.__scene; return (s&&s.machineList)?s.machineList():[]; }
function activeMachine(){ const c=craftState(), ms=machines(); if(!ms.length) return null;
  return ms.find(m=>m.id===c.activeId) || ms[0]; }
function comboMats(){ const m=activeMachine(); return m ? m.slots.filter(Boolean) : []; }
function comboKey(){ return keyOfSlots(comboMats()); }
/* main.js が「この機械で何が作れるか」を描くために引く。レシピの正はこちら側。 */
window.__craft = {
  mat:(id)=>MAT[id]||null,
  // 何が作れるかは伏せる（探す楽しみを残す）。代わりに稼働状態と進捗だけ返す。
  preview:(slots, id)=>{
    const set=(slots||[]).filter(Boolean);
    if(!set.length) return null;                       // 素材未設定 → main.js 側が「素材未設定」を出す
    const ms=machines(), m=id?ms.find(x=>x.id===id):null;
    if(!m) return {e:'📦', n:'素材セット済み', unknown:false};
    const st=machState(m.id), need=needWp(m);
    return st.running
      ? {e:'⚙️', n:`製造中 ${Math.floor(st.wp)}/${need}WP`, unknown:false}
      : {e:'📦', n:'待機中', unknown:true};
  },
};

/* --- WP の取得（OTel実測） --- */
let WPST={ total:0, today:0, ok:false, sc:[] };
async function pollWp(){
  try{
    const r=await fetch('/api/otel',{cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status);
    const d=await r.json();
    WPST={ total:d.wpTotal||0, today:d.wpToday||0, ok:true, sc:d.scorecard||[] };
  }catch(_){ WPST.ok=false; }
  tickCraft(); renderCraft();
}
/* --- 製造判定 ---
   ・稼いだWPは按分せず、稼働中の全機械にそれぞれ同額を加算する
   ・必要WPに達した「その時点」のマスの組み合わせで作られる製品が決まる
   ・原材料を変えてもWPはリセットしない（溜まった分はそのまま次に使う） */
function tickCraft(){
  const c=craftState(); if(!WPST.ok) return;
  // 初回は基準だけ取る（起動前に稼いだWPを遡って入れない）
  if(typeof c.wpMark!=='number'){ c.wpMark=WPST.total; saveGame(); return; }
  const delta=Math.max(0, WPST.total - c.wpMark);
  c.wpMark=WPST.total;
  if(delta<=0) return;
  let last=null, total=0;
  for(const m of machines()){
    const st=machState(m.id); if(!st.running) continue;
    st.wp += delta;
    const need=needWp(m); let n=0;
    while(st.wp>=need && n<20){
      st.wp-=need;                                  // 超過分は次の製品に繰り越す
      const key=keyOfSlots(m.slots);                // ここで初めて組み合わせを見る
      const p=key ? rollProduct(key) : PROD[BLOB];  // 空なら「レシピに無い」扱い
      if(!p) break;
      c.made.push({ pid:p.id, at:Date.now(), key:key||'', mid:m.id, viewed:false });
      last=p; total++; n++;
    }
  }
  saveGame();
  if(total){
    updateDoneBtn();
    if(window.__scene&&window.__scene.celebrate) window.__scene.celebrate(last.e);
    toast(`${last.e} ${last.n} が完成！(💰${(PROD_PRICE[last.r]||0).toLocaleString()})${total>1?` ×${total}個`:''} 🎁完成品で確認`);
    if(window.__scene&&window.__scene.refreshMachines) window.__scene.refreshMachines();
  }
}

/* --- 今日の労働量ボード（画面上中央・このゲームの主役の数字） ---
   「今日どれだけ働いたか」を示す数字なので、製造の設定とは切り離して大きく出す。 */
const jstDayOf = t => new Date(t + 9*3600*1000).toISOString().slice(0,10);
function madeToday(){ const d=jstDayOf(Date.now()); return craftState().made.filter(m=>jstDayOf(m.at)===d).length; }
function renderBoard(){
  const el=document.getElementById('board'); if(!el) return;
  el.innerHTML=`
    <div class="m"><div class="v">${WPST.ok?Math.floor(WPST.today).toLocaleString():'—'}<small>WP</small></div>
      <div class="l">今日の労働量</div></div>
    <div class="m prod"><div class="v">${madeToday()}<small>個</small></div>
      <div class="l">今日の製造</div></div>`;
}

/* --- 製造のコンパクト表示（画面上中央）。詳しい操作は🏭製造ダイアログに寄せ、
       ここは「いま何を作っているか + WP」だけを出す導線にする --- */
function renderCraft(){
  const el=document.getElementById('craft'); if(!el) return;
  const ms=machines(), run=ms.filter(m=>machState(m.id).running);
  // 何が作れるかは出さない。進捗は「一番先に完成する機械」を代表として見せる
  let lead=null, leadPct=-1;
  for(const m of run){ const st=machState(m.id), pct=st.wp/needWp(m); if(pct>leadPct){ leadPct=pct; lead=m; } }
  const face = !ms.length ? {e:'🏭', n:'製造機なし'}
             : run.length ? {e:'⚙️', n:`製造中 ${run.length}/${ms.length}台`}
             : {e:'📦', n:`待機中 ${ms.length}台`};
  const need=lead?needWp(lead):0, wp=lead?Math.floor(machState(lead.id).wp):0;
  el.innerHTML = `<span class="pe">${face.e}</span>
    <div class="mid"><div class="nm">${face.n}</div>
      <div class="kv"><span class="${run.length?'run':''}"${WPST.ok?'':' style="color:#ff9f7a"'}>${
        !WPST.ok?'WP未取得':(lead?`${lead.no||''}号機がもうすぐ`:'▶製造開始でカウント')}</span>
        <b>${lead?`${wp} / ${need} WP`:'—'}</b></div>
      <div class="bar"><i style="width:${lead?Math.min(100,leadPct*100).toFixed(1):0}%"></i></div></div>
    <span class="go">🏭▸</span>`;
  el.title='クリックで🏭製造（原材料のセット・製造開始）';
  renderBoard();
}
/* 機械1台の製造開始/停止。WPはリセットしない（停止中は増えないだけ） */
function toggleMachine(id){
  const st=machState(id), ms=machines(), m=ms.find(x=>x.id===id);
  st.running=!st.running;
  craftState().activeId=id;
  saveGame(); renderCraft();
  if(window.__scene&&window.__scene.refreshMachines) window.__scene.refreshMachines();
  toast(st.running ? `${m?(m.no||''):''}号機の製造を開始（${m?needWp(m):0}WPで1個）` : '製造を停止（溜めたWPは保持）');
}

/* =========================================================================
   🏭 製造ダイアログ — 全機械を縦に並べた一覧
     ・タブで切り替えない（一覧性を優先）。並びはマス数の昇順
     ・各行でマスのセット / 進捗 / 製造開始・停止が完結する
     ・作れる物は出さない（組み合わせを探すのがゲームの目的）
   開いている間は1秒ごとに再描画してWPに追従する。
   ========================================================================= */
let _craftPick=null;                       // {mid, idx} = いま原材料を選んでいるマス
const machTitle=(m)=>`${(MACH['s'+m.size]||{}).e||'🏭'} ${m.no}号機`;
function openCraft(){
  _craftPick=null;
  return openDialog({ title:'🏭 製造',
    sub:()=>{ const ms=machines(); return ms.length?`${ms.length}台 / 稼働 ${runningCount()}台`:'製造機がありません'; },
    live:1000,
    body:()=>{
      const ms=machinesSorted();
      if(!ms.length) return '<div class="cost" style="padding:12px">製造機がありません。🏪ショップで購入 → 🔧レイアウト編集で床に設置してください。</div>';
      const head=`<div class="cost" style="margin:2px 0 9px">1マスにつき原材料1つ。入っている原材料の<b>組合せ</b>で作れる物が変わります（順番は関係なし）。
        必要WPは<b>マス数 × ${WP_PER_SLOT}WP</b>。稼いだWPは稼働中の全機械にそれぞれ加算されます（台数で割りません）。</div>`;
      return head + ms.map(m=>{
        const st=machState(m.id), need=needWp(m), pct=Math.min(100, st.wp/need*100);
        const slots=m.slots.map((mid,i)=>{ const mt=MAT[mid];
          const on=_craftPick&&_craftPick.mid===m.id&&_craftPick.idx===i;
          return `<div class="mslot ${mt?'set':''} ${on?'pick':''}" data-cslot="${i}" data-cmid="${m.id}" title="クリックで原材料を選ぶ">
            <span class="e">${mt?mt.e:'＋'}</span><small>${mt?mt.n:`${i+1}マス目`}</small>
            ${mt?`<span class="x" data-cclear="${i}" data-cmid="${m.id}" title="外す">✕</span>`:''}</div>`; }).join('');
        const picker = (_craftPick&&_craftPick.mid===m.id) ? `
          <div class="cost" style="margin:9px 0 5px;color:#7fe6ff">${_craftPick.idx+1}マス目に入れる原材料</div>
          <div class="pgrid">${MATS.map(x=>`<div class="pcard" data-cmat="${x.id}" data-cmid="${m.id}"
             style="cursor:pointer;${m.slots[_craftPick.idx]===x.id?'border-color:var(--gold)':''}">
             <div class="e">${x.e}</div><div class="nm">${x.n}</div></div>`).join('')}</div>` : '';
        const nSet=m.slots.filter(Boolean).length;
        return `<div class="mrow ${st.running?'run':''}">
          <div class="mrowH">
            <b>${machTitle(m)}</b>
            <span class="mtag">${m.size}マス</span>
            <span class="mtag">必要 ${need}WP</span>
            <span class="mst ${st.running?'on':''}">${st.running?'⚙️ 製造中':'⏸ 待機中'}</span>
            <span class="grow"></span>
            <button class="dbtn ${st.running?'ghost':''}" data-crun="${m.id}"${(!st.running&&!nSet)?' disabled':''}
              title="${(!st.running&&!nSet)?'原材料を1つ以上セットしてください':''}">${st.running?'■ 停止':'▶ 製造開始'}</button>
          </div>
          <div class="mslots">${slots}</div>${picker}
          <div class="wpline"><div class="kv">
            <span${WPST.ok?'':' style="color:#ff9f7a"'}>${!WPST.ok?'WP未取得（サーバ未接続）':(st.running?'次の製品まで':'停止中（溜めたWPは保持）')}</span>
            <b>${Math.floor(st.wp)} / ${need} WP</b></div>
            <div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div></div>
        </div>`;
      }).join('');
    },
    onRender:(p,d)=>{
      p.querySelectorAll('[data-crun]').forEach(el=>el.onclick=()=>{ toggleMachine(el.dataset.crun); d.refresh(); });
      p.querySelectorAll('[data-cslot]').forEach(el=>el.onclick=(ev)=>{
        if(ev.target.dataset && ev.target.dataset.cclear!=null) return;   // ✕(外す)は別扱い
        const mid=el.dataset.cmid, i=+el.dataset.cslot;
        _craftPick=(_craftPick&&_craftPick.mid===mid&&_craftPick.idx===i)?null:{mid,idx:i}; d.refresh(); });
      p.querySelectorAll('[data-cclear]').forEach(el=>el.onclick=(ev)=>{
        ev.stopPropagation(); setMat(el.dataset.cmid, +el.dataset.cclear, null); _craftPick=null; d.refresh(); });
      p.querySelectorAll('[data-cmat]').forEach(el=>el.onclick=()=>{
        if(!_craftPick) return; setMat(el.dataset.cmid, _craftPick.idx, el.dataset.cmat); _craftPick=null; d.refresh(); });
    } });
}

function openMatPicker(machineId, slotIdx){
  const F=window.__factory, mm=F&&F.getMachine(machineId);
  const cur=mm?mm.slots[slotIdx]:null;
  craftState().activeId = machineId;
  openDialog({ title:`🥫 原材料をセット（${(slotIdx|0)+1}マス目）`,
    body:`<div class="rowline" style="font-size:11px;color:#9fb0c0">
        選んだ組み合わせで作られる製品が変わります。同じ組み合わせでも5種類の中からランダムです。<br>
        <b style="color:#ff9f7a">変更・解除すると製造が停止し、WPは0に戻ります。</b></div>
      <div class="pgrid">${MATS.map(m=>`
        <div class="pcard" data-mat="${m.id}" style="cursor:pointer;${cur===m.id?'border-color:var(--gold)':''}">
          <div class="e">${m.e}</div><div class="nm">${m.n}</div></div>`).join('')}</div>`,
    actions: cur ? [{label:'原材料を外す',kind:'ghost',on:()=>{ setMat(machineId, slotIdx, null); closeOverlay(); }}] : null,
    onRender:(p)=>{ p.querySelectorAll('[data-mat]').forEach(el=>el.onclick=()=>{ setMat(machineId, slotIdx, el.dataset.mat); closeOverlay(); }); } });
}
function setMat(machineId, slotIdx, matId){
  const c=craftState(), F=window.__factory;
  if(!F||!F.setSlot(machineId, slotIdx, matId||null)) return;   // 素材の実体は機械のマス(レイアウトに保存)
  c.activeId = machineId;
  // 原材料を変えても製造は止めず、溜まったWPも保持する。
  // 何ができるかは「必要WPに達した時点」の組み合わせで決まる（tickCraft）。
  snapLayout(); saveGame();
  renderCraft();
  toast(matId ? `${MAT[matId].e} ${MAT[matId].n} をセット` : '原材料を外しました');
}

/* --- 完成品 --- */
function updateDoneBtn(){
  const c=craftState(), b=document.getElementById('doneBtn'); if(!b) return;
  const unseen=c.made.filter(m=>!m.viewed).length;
  b.classList.toggle('show', c.made.length>0);
  document.getElementById('doneN').textContent = unseen ? unseen : '';
}
function openDone(){
  const c=craftState();
  const had={}; for(const k in c.dex) had[k]=c.dex[k];      // 「初めて」の判定は登録前の図鑑で行う
  const cards=[...c.made].reverse().slice(0,200).map(m=>{
    const p=PROD[m.pid]; if(!p) return '';
    // 未登録の製品は該当する全部に NEW を付ける（3個できていれば3個とも）
    const isNew = !had[m.pid];
    const ks=(m.key||'').split(',').map(x=>MAT[x]?MAT[x].e:'').join('');
    return `<div class="pcard">${isNew?'<span class="new">NEW</span>':''}
      <div class="e">${p.e}</div><div class="nm">${p.n}</div>
      <div class="rr" style="color:${RAR[p.r].c}">${RAR[p.r].n}</div>
      <div class="qn">${ks}</div></div>`;
  }).join('');
  // 一覧を表示したタイミングで図鑑に登録し、同時に売上を💰に加算する（仕様）
  let reg=0, gain=0, byRar={};
  for(const m of c.made){
    if(m.viewed) continue;
    const p=PROD[m.pid]; if(!p){ m.viewed=true; continue; }
    c.dex[m.pid]=(c.dex[m.pid]||0)+1; m.viewed=true; reg++;
    const price=PROD_PRICE[p.r]||0; gain+=price;
    byRar[p.r]=(byRar[p.r]||0)+1;
  }
  if(gain){ G.money+=gain; }
  saveGame(); updateDoneBtn(); updateBadge();
  const bd=Object.keys(byRar).sort().map(r=>
    `<span class="chip"><b style="color:${RAR[r].c}">${RAR[r].n}</b>×${byRar[r]} = 💰${(PROD_PRICE[r]*byRar[r]).toLocaleString()}</span>`).join('');
  openDialog({ title:'🎁 完成品', sub:`${c.made.length}個`,
    body:`${gain?`<div class="invbar" style="font-size:12px">
          <span style="color:#9fb0c0">今回の売上</span>
          <b style="color:#ffd27a;font-size:19px">💰 ${gain.toLocaleString()}</b>
          <span style="color:#9fb0c0">（${reg}個・所持 💰${Math.floor(G.money).toLocaleString()}）</span>
          ${bd}</div>`
        :`<div class="rowline" style="font-size:11px;color:#9fb0c0">新しく完成した製品はありません（売上は初回表示時に加算されます）。</div>`}
      <div class="rowline" style="font-size:11px;color:#9fb0c0">
        ${reg?`${reg}個を📖図鑑に登録しました。`:''}NEW は初めて作られた製品です。図鑑を埋めていこう。</div>
      <div class="pgrid">${cards||'<div class="cost">まだありません</div>'}</div>`,
    actions:[{label:'📖 図鑑を見る',kind:'ghost',on:()=>openDex('prod')}] });
}

/* ===== 🧑‍🏭 エージェント一覧（スキン変更つき）=====
   常時表示はやめ、左下の稼働/休憩HUD か ☰メニューから開く。開いている間は1秒ごとに更新。 */
let _agentSel=null;                     // スキン選択を開いているプロジェクト(null=閉じている)
function agentRows(){                   // プロジェクト単位に集約(同名エージェントは稼働数をまとめる)
  const list=(window.__factory&&window.__factory.getAgents())||[];
  const by={};
  for(const a of list){ const p=by[a.proj]||(by[a.proj]={proj:a.proj,color:a.color,skinId:'none',n:0,busy:0});
    p.n++; if(a.working)p.busy++; if(a.skinId&&a.skinId!=='none')p.skinId=a.skinId; }
  return Object.values(by);
}
const skinName=(id)=>{ const s=((window.__factory&&window.__factory.skinList)||[]).find(x=>x.id===id); return s?s.n:'デフォルト'; };
// スキンの見本。画像(assets/hat-*.png)は未生成のものが多いので onerror で絵文字に差し替える
function skinThumb(id,px){ const e=(id==='none')?'🧑‍🏭':((BG_META[id]&&BG_META[id].e)||'🎨');
  return (id==='none') ? `<span style="font-size:${px}px">${e}</span>`
    : `<img src="assets/hat-${id}.png" alt="" style="width:${px+16}px;height:${px+16}px;object-fit:contain" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'${e}',style:'font-size:${px}px'}))">`;
}
function openAgents(){
  const esc=(s)=>String(s||'').replace(/[<>&]/g,'');
  return openDialog({ title:'🧑‍🏭 エージェント',
    sub:()=>{ const r=agentRows(), n=r.reduce((s,p)=>s+p.n,0), b=r.reduce((s,p)=>s+p.busy,0);
      return `稼働 ${b} / 休憩 ${n-b}`; },
    live:1000,                          // 開いている間は最新の稼働状況に追従
    body:()=>{
      const rows=agentRows(); if(!rows.length) return '<div class="cost" style="padding:12px">稼働中のエージェントがいません。</div>';
      const skins=(window.__factory&&window.__factory.skinList)||[];
      return rows.map(p=>{
        const key=encodeURIComponent(p.proj), nm=esc(p.proj)||'(無名)', open=_agentSel===p.proj;
        const hat=(p.skinId&&p.skinId!=='none')?`<img src="assets/hat-${p.skinId}.png" alt="" onerror="this.remove()">`:'';
        let h=`<div class="rc">
          <div class="ic"><span class="lgAv" style="background:${p.color||'#4f7fc4'}"><span class="eye l"></span><span class="eye r"></span>${hat}</span></div>
          <div class="mid"><div class="nm">${nm}${p.n>1?` <span style="color:#9fb0c0;font-size:10px">×${p.n}</span>`:''}</div>
            <div class="cost"><span class="agSt ${p.busy?'on':''}">${p.busy?`🟢 稼働 ${p.busy}/${p.n}`:'💤 休憩'}</span>スキン: ${skinName(p.skinId)}</div></div>
          <button data-agsel="${key}">${open?'閉じる':'🎨 スキン'}</button></div>`;
        // スキンの一覧は長いので行の直下で折りたたみ表示（他の行が押し出されないよう高さを制限）
        if(open) h+=`<div class="grid" style="margin:0 0 12px 8px;max-height:196px;overflow-y:auto">${skins.map(s=>{ const on=p.skinId===s.id;
            return `<div class="cell own" data-skin="${s.id}" data-proj="${key}" title="${s.n}"
              style="${on?'border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset':''}">${skinThumb(s.id,26)}<small style="color:#cfeee0">${s.n}</small>${on?'<span class="cnt">✓</span>':''}</div>`;

      +'<div class="rowline" style="font-size:11px;color:#9fb0c0">「🎨 スキン」から被り物を変更できます。画像が未生成のスキンは仮アイコン表示で、アセット到着までは見た目がデフォルトのままです。</div>';
    },

        toast(`${pj||'(無名)'} → ${skinName(el.dataset.skin)}`); d.refresh(); });
    } });
}

/* ===== ショップ（景品の売却＋購入/強化） ===== */
function sellPrize(id,qty){ const p=PRIZES.find(x=>x.id===id); const have=G.inv[id]||0; qty=Math.min(qty,have); if(qty<=0)return;
  G.inv[id]=have-qty; const gain=SELL[p.r]*qty; G.money+=gain; saveGame(); updateBadge(); toast(`${p.e} ${p.n}×${qty} を売却 (+💰${gain})`); }
// 購入=在庫(owned)に追加。設置は編集パレットから床クリックで行う
function buyMachine(type){ if(!MACH[type])return; const pr=MACH[type].price; if(G.money<pr)return; G.money-=pr; addStock('machine',type); saveGame(); updateBadge(); toast(`${MACH[type].e} ${MACH[type].n} を購入（🔧編集で設置）`); }
function levelUp(id){ const e=(G.layout||[]).find(x=>x.id===id&&x.kind==='machine'); if(!e)return; const c=lvCost(e.lvl); if(G.money<c)return; G.money-=c; e.lvl++;
  const M=MACH[machSub(e.sub)];
  if(window.__scene)window.__scene.setMachineLevel(id,e.lvl); snapLayout(); saveGame(); updateBadge(); toast(`${M.e} ${M.n} を Lv${e.lvl} に強化！`); }
// 素材スロットの要約（ショップ一覧用）。何が作れるかは伏せ、素材と稼働状態だけ出す
function slotSummary(e){ const mats=[...new Set((e.slots||[]).filter(Boolean))].sort();
  if(!mats.length) return '素材未設定';
  const icons=mats.map(m=>(MAT[m]||{}).e||'?').join('');
  return `${icons}${machState(e.id).running?' ・ ⚙️製造中':''}`; }
function buyDeco(t){ const pr=DECO[t].price; if(G.money<pr)return; G.money-=pr; addStock('deco',t); saveGame(); updateBadge(); toast(`${DECO[t].e} ${DECO[t].n} を購入（🔧編集で設置）`); }
function buyProp(t){ const pr=PROP[t].price; if(G.money<pr)return; G.money-=pr; addStock('prop',t); saveGame(); updateBadge(); toast(`${PROP[t].n} を購入（🔧編集で設置）`); }
function selectBg(k){ if(!G.bgOwned.includes(k)){ const pr=BG[k].price; if(G.money<pr)return; G.money-=pr; G.bgOwned.push(k); toast(`背景「${BG[k].n}」を購入！`); } G.bg=k; if(window.__scene&&window.__scene.setSkyTheme)window.__scene.setSkyTheme(k); saveGame(); updateBadge(); }
function selectFloor(k){ if(!G.floorOwned.includes(k)){ const pr=FLOOR[k].price; if(G.money<pr)return; G.money-=pr; G.floorOwned.push(k); toast(`床材「${FLOOR[k].n}」を購入！`); } G.floor=k; if(window.__scene&&window.__scene.setFloor)window.__scene.setFloor(k); saveGame(); updateBadge(); }
function buySeries(k){ const S=SERIES[k]; if(!G.seriesOwned.includes(k)){ if(G.money<S.price)return; G.money-=S.price; G.seriesOwned.push(k);
    if(window.__scene) for(const e of S.decos) window.__scene.placeEmojiDeco(e); snapLayout(); toast(`${S.n} シリーズを購入！内装と装飾を反映`); }
  G.bg=S.sky; G.floor=S.floor; if(window.__scene){ window.__scene.setSkyTheme(S.sky); window.__scene.setFloor(S.floor); } saveGame(); updateBadge(); }

let _shopTab='sell';
const SHOP_TABS=[['sell','💵 売却'],['mach','🏭 製造機'],['equip','🧰 設備'],['decor','🎨 内装'],['series','🌏 シリーズ']];
function shopBody(){
    let body='';
    if(_shopTab==='sell'){
      const owned=PRIZES.filter(p=>G.inv[p.id]>0);
      body = owned.length ? owned.map(p=>{ const have=G.inv[p.id],col=RAR[p.r].c;
        return `<div class="rc"><div class="ic">${p.e}</div><div class="mid"><div class="nm">${p.n} <span style="color:${col};font-size:10px">${RAR[p.r].n}</span> ×${have}</div>

      }).join('') : '<div class="cost" style="padding:12px">売れる景品がありません。🎁ガチャで景品を集めよう。</div>';

      body = '<div class="cost" style="margin:2px 0 6px">設置済みの製造機（Lv↑で生産量が増える。素材は🏭製造タブでセット）</div>';
      const machs=(G.layout||[]).filter(e=>e.kind==='machine');

        return `<div class="rc"><div class="ic">${M.e}</div>
        <div class="mid"><div class="nm">${M.n} <span style="color:#7fe6ff;font-size:11px">Lv${e.lvl}</span></div>

        <button data-lv="${e.id}" ${G.money>=c?'':'disabled'}>強化</button></div>`; }).join('') || '<div class="cost" style="padding:6px 2px">未設置。🔧編集で在庫から設置</div>';
      body += '<div class="cost" style="margin:12px 0 6px">製造機を購入（マス数が多いほど素材を多く入れられる＝作れる物が増える）</div>';

    } else if(_shopTab==='equip'){

      for(const [th,label] of PROP_GROUPS){
        const all=Object.keys(PROP).filter(t=>(PROP[t].th||'')===th);

        // 基本家具(全テーマ共通スロット)と名物(そのテーマだけの一点物)を分けて並べる
        const ks=[...all.filter(t=>PROP[t].fu), ...all.filter(t=>!PROP[t].fu)];
        body += ks.map(t=>{ const sp=(window.PROP_SPAN||{})[t]||1;   // 占有コマ数(見た目の大きさ)
          return `<div class="rc"><div class="ic">${PROP[t].e}</div>
          <div class="mid"><div class="nm">${PROP[t].n} <span style="color:#9fb0c0;font-size:10px">在庫 ${ownedN('prop',t)}</span></div>
          <div class="cost">💰${PROP[t].price}${sp>1?` ・ ${sp}コマ`:''}</div></div>
          <button data-prop="${t}" ${G.money>=PROP[t].price?'':'disabled'}>購入</button></div>`; }).join('');
      }
      body += '<div class="cost" style="margin:12px 0 6px">その他</div>';
      body += Object.keys(DECO).map(t=>`<div class="rc"><div class="ic">${DECO[t].e}</div>

    } else if(_shopTab==='decor'){   // 内装（背景=窓の外の景色 / 床材）
      const bgRow=Object.keys(BG).map(k=>{ const own=G.bgOwned.includes(k),cur=G.bg===k;

      const flRow=Object.keys(FLOOR).map(k=>{ const own=G.floorOwned.includes(k),cur=G.floor===k;
        return `<div class="rc"><div class="ic">${cur?'✅':'🔲'}</div><div class="mid"><div class="nm">床材: ${FLOOR[k].n}</div>
          <div class="cost">${own?(cur?'使用中':'所持'):'💰'+FLOOR[k].price.toLocaleString()}</div></div>
          <button data-fl="${k}" ${(own||G.money>=FLOOR[k].price)&&!cur?'':'disabled'}>${own?(cur?'---':'適用'):'購入'}</button></div>`; }).join('');
      body = '<div class="cost" style="margin:2px 0 6px">背景（窓の外の景色）</div>'+bgRow+'<div class="cost" style="margin:12px 0 6px">床材</div>'+flRow;
    } else {   // シリーズ（背景＋床＋絵文字装飾のセット）
      body = '<div class="cost" style="margin:2px 0 8px">背景・床材・装飾をまとめて着せ替え（購入後は無料で再適用）</div>';
      body += Object.keys(SERIES).map(k=>{ const S=SERIES[k],own=G.seriesOwned.includes(k),cur=(G.bg===S.sky&&G.floor===S.floor);
        return `<div class="rc"><div class="ic">${S.n.split(' ')[0]}</div><div class="mid"><div class="nm">${S.n.split(' ')[1]}シリーズ ${cur?'<span style="color:#7fe6ff;font-size:10px">適用中</span>':''}</div>
          <div class="cost">${S.decos.join(' ')} ・ ${own?'所持':'💰'+S.price.toLocaleString()}</div></div>
          <button data-series="${k}" ${((own||G.money>=S.price)&&!cur)?'':'disabled'}>${own?(cur?'---':'適用'):'購入'}</button></div>`; }).join('');
    }
    return body;
}
function openShop(tab){ if(tab)_shopTab=tab;
  return openDialog({ title:'🏪 ショップ',
    sub:()=>`<span id="shopMoney" style="color:#ffd27a;font-size:13px">💰 ${Math.floor(G.money).toLocaleString()}</span>`,
    tabs:SHOP_TABS.map(t=>({id:t[0],label:t[1]})), tab:_shopTab,

    onRender:(p,d)=>{

      p.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{ levelUp(b.dataset.lv); re(); });

    } });
}
document.getElementById('shopBtn').addEventListener('click',()=>openShop());

/* ===== 起動: ロード→オフライン生産→シーン待ち→所持品反映→生産tick ===== */
function waitScene(){ return new Promise(res=>{ (function chk(){ if(window.__scene) res(); else setTimeout(chk,60); })(); }); }
function applyOwned(){ const s=window.__scene; if(!s)return;
  if(G.layout&&G.layout.length){ const dropped=s.buildLayout(G.layout);   // 保存済みレイアウト(位置)を復元
    snapLayout();
    if(dropped) setTimeout(()=>toast(`コンベアは廃止されました（${dropped} 個を撤去）。製造機をクリックして素材を設定してください`),900); }
  else {                                                            // 初回: 所持品を配置→レイアウト確定
    s.syncMachines(G.machines);
    for(const t in G.decos) for(let i=0;i<(G.decos[t]||0);i++) s.placeDeco(t);
    for(const e of (G.emojiDecos||[])) s.placeEmojiDeco(e);
    snapLayout();
  }
  migrateCraftMats();                       // 旧セーブの原材料を機械のマスへ
  reconcileStock(); saveGame();
  s.setSkyTheme(G.bg); s.setFloor(G.floor); s.applySkins(G.skins); }
/* ===== 編集パレット: 大項目→在庫から選ぶ→床クリックで設置 ===== */
const ROOM_THEMES=['arabia','undersea','japan','china','diner','fantasy','scifi','cabin','dino','haunted','pirate','circuit','dwarf','hell','steampunk','retrofuture','tokyo','halloween','western','sushi','beehive','circus','carnival','desert','jungle','egypt','christmas','space','ice','mushroom','onsen'];
const SKY_THEMES=['blue','sunset','night','space','aurora'];
const BG_META={auto:{e:'🕐',n:'標準'},blue:{e:'☀️',n:'快晴'},sunset:{e:'🌆',n:'夕焼け'},night:{e:'🌙',n:'星空'},space:{e:'🌌',n:'宇宙'},aurora:{e:'🌈',n:'オーロラ'},arabia:{e:'🕌',n:'アラビア'},undersea:{e:'🐚',n:'海底'},japan:{e:'⛩️',n:'日本'},china:{e:'🐉',n:'中華'},diner:{e:'🍔',n:'ダイナー'},fantasy:{e:'🧙',n:'ファンタジー'},scifi:{e:'🚀',n:'SF宇宙'},cabin:{e:'🌲',n:'森コテージ'},dino:{e:'🦖',n:'ダイナソー'},haunted:{e:'👻',n:'幽霊屋敷'},pirate:{e:'🏴‍☠️',n:'海賊船'},circuit:{e:'🏁',n:'サーキット'},dwarf:{e:'⛏️',n:'ドワーフ鉱山'},hell:{e:'😈',n:'地獄'},steampunk:{e:'⚙️',n:'スチパン'},retrofuture:{e:'🛸',n:'レトロ未来'},tokyo:{e:'🌃',n:'Tokyo'},halloween:{e:'🎃',n:'ハロウィン'},western:{e:'🤠',n:'西部開拓時代'},sushi:{e:'🍣',n:'回転寿司'},beehive:{e:'🐝',n:'ミツバチの巣'},circus:{e:'🎪',n:'サーカス'},carnival:{e:'🎭',n:'カーニバル'},desert:{e:'🏜️',n:'砂漠'},jungle:{e:'🌴',n:'ジャングル'},egypt:{e:'🔺',n:'古代エジプト'},christmas:{e:'🎄',n:'クリスマス'},space:{e:'🚀',n:'宇宙ステーション'},ice:{e:'🧊',n:'氷の城'},mushroom:{e:'🍄',n:'森のキノコ'},onsen:{e:'♨️',n:'和風温泉'}};
function ownedBgs(){ const a=['auto']; for(const k of SKY_THEMES) if(G.bgOwned.includes(k)) a.push(k); for(const k of ROOM_THEMES) if(G.seriesOwned.includes(k)) a.push(k); return a; }
function applyBg(k){ G.bg=k; if(window.__scene){ window.__scene.setSkyTheme(k); window.__scene.setFloor(ROOM_THEMES.includes(k)?'wood':G.floor); } saveGame(); updateBadge(); }
const paletteEl=document.getElementById('palette');
let editCat='bg', editSel=null; window.__editSel=null;
let selMode=false, selN=0;                       // 収納の複数選択モードと選択数
let propFilter=null;                             // 装飾の絞り込みテーマ(null=すべて / ''=汎用)
window.__selChanged=(n)=>{ selN=n; renderPalette(); };
function renderPalette(){
  const cats=[['bg','🌏 背景'],['prop','🧰 装飾'],['machine','🏭 製造機']];
  let items='', hint='', acts='', fil='';
  const cell=(dataAttr,e,n,extra,qn,on)=>`<div class="pitem ${on?'on':''}" ${dataAttr}>${e}<small>${n}</small>${qn!=null?`<span class="qn">${qn}</span>`:''}</div>`;
  if(editCat==='bg'){ hint='背景を選ぶと即適用（部屋ごと切替）';
    items=ownedBgs().map(k=>`<div class="pitem ${G.bg===k?'cur':''}" data-bg="${k}">${BG_META[k].e}<small>${BG_META[k].n}</small></div>`).join('');
  } else if(editCat==='prop'){
    const s=window.__scene, placedN=s?s.stowables().length:0;
    if(selMode){ hint=`床の装飾をクリックで選択（もう一度クリックで解除）・ ${selN}個 選択中`;
      items=`<div class="phint" style="padding:8px">選択モード中です。戻したい装飾を床でクリックしてください。</div>`;
    } else {
      hint=(editSel?'床をクリックで設置':'在庫から選んで床をクリックで設置')
        +'<br>設置済みはドラッグで移動 / 🗑ゴミ箱へドラッグで撤去 ・ ラグは床の平物なので家具の下に敷けます';
      // テーマ(=背景)で絞り込む。propFilter が null なら全部。DECO は汎用('')扱い
      const inFilter=(th)=> propFilter===null || (th||'')===propFilter;
      const P=Object.keys(PROP).filter(t=>availN('prop',t)>0&&inFilter(PROP[t].th)).map(t=>cell(`data-place="prop:${t}"`,PROP[t].e,PROP[t].n,0,availN('prop',t),editSel&&editSel.kind==='prop'&&editSel.sub===t));
      const D=Object.keys(DECO).filter(t=>availN('deco',t)>0&&inFilter('')).map(t=>cell(`data-place="deco:${t}"`,DECO[t].e,DECO[t].n,0,availN('deco',t),editSel&&editSel.kind==='deco'&&editSel.sub===t));
      items=(P.concat(D).join(''))||`<div class="phint" style="padding:8px">${propFilter===null?'在庫なし。🏪ショップ→設備 で購入してください。':'このテーマの在庫がありません。「すべて」に戻すか、🏪ショップで購入してください。'}</div>`;
      // 絞り込み行: 在庫のあるテーマだけ出す。適用中の背景と同じテーマには印を付ける
      const nOf=(th)=> Object.keys(PROP).filter(t=>(PROP[t].th||'')===th&&availN('prop',t)>0).length
                     + (th===''?Object.keys(DECO).filter(t=>availN('deco',t)>0).length:0);
      const chips=PROP_GROUPS.filter(([th])=>nOf(th)>0).map(([th,label])=>{
        const cur=(th&&th===G.bg)?' ●':'';                      // いま適用中の背景と同じテーマ
        return `<span class="c ${propFilter===th?'on':''}" data-pfil="${th}">${label}${cur} <span style="color:#9fb0c0">${nOf(th)}</span></span>`; });
      const allN=Object.keys(PROP).filter(t=>availN('prop',t)>0).length
               + Object.keys(DECO).filter(t=>availN('deco',t)>0).length;
      fil=`<span class="c ${propFilter===null?'on':''}" data-pfil="*">すべて <span style="color:#9fb0c0">${allN}</span></span>`+chips.join('');
    }
    // 収納(設置済みを在庫に戻す)。位置は失われるが、在庫に戻るので置き直せる
    acts = selMode
      ? `<span class="c ${selN?'on':''}" data-stow="sel">📦 選択した${selN}個を収納</span><span class="c" data-selmode="0">✖ 選択をやめる</span>`
      : `<span class="c" data-stow="all">📦 すべて収納 (${placedN})</span><span class="c" data-selmode="1">☑️ 選んで収納</span>`;
  } else { hint=(editSel?'床をクリックで設置（Rキーで向き切替）':'在庫から選んで床をクリックで設置。マス数ぶんの空きが必要です')
      +'<br>設置済みはドラッグで移動 / 🗑ゴミ箱へドラッグで撤去 ・ クリックで設定パネル（↻回転・✥移動／素材は🏭製造タブ）';
    const M=Object.keys(MACH).filter(t=>availN('machine',t)>0).map(t=>cell(`data-place="machine:${t}"`,MACH[t].e,MACH[t].n,0,availN('machine',t),editSel&&editSel.kind==='machine'&&editSel.sub===t));
    items=M.join('')||'<div class="phint" style="padding:8px">在庫なし。🏪ショップ→製造機 で購入してください。</div>';
  }
  paletteEl.innerHTML=`<div class="pcat">${cats.map(c=>`<span class="c ${c[0]===editCat?'on':''}" data-cat="${c[0]}">${c[1]}</span>`).join('')}</div>
    ${fil?`<div class="pcat pfil">${fil}</div>`:''}
    <div class="pitems">${items}</div>${acts?`<div class="pcat">${acts}</div>`:''}<div class="phint">${hint}</div>`;
  paletteEl.querySelectorAll('.c[data-cat]').forEach(el=>el.onclick=()=>{ editCat=el.dataset.cat; editSel=null; window.__editSel=null; setSelMode(false); renderPalette(); });
  paletteEl.querySelectorAll('[data-pfil]').forEach(el=>el.onclick=()=>{ propFilter=el.dataset.pfil==='*'?null:el.dataset.pfil; renderPalette(); });
  paletteEl.querySelectorAll('[data-selmode]').forEach(el=>el.onclick=()=>{ setSelMode(el.dataset.selmode==='1'); renderPalette(); });
  paletteEl.querySelectorAll('[data-stow]').forEach(el=>el.onclick=()=>stow(el.dataset.stow));
  paletteEl.querySelectorAll('[data-bg]').forEach(el=>el.onclick=()=>{ applyBg(el.dataset.bg); renderPalette(); });
  paletteEl.querySelectorAll('[data-place]').forEach(el=>el.onclick=()=>{ const p=el.dataset.place.split(':'); editSel={kind:p[0],sub:p[1]||null}; window.__editSel=editSel; renderPalette(); });
}
window.renderPalette=renderPalette;
function setSelMode(on){ const s=window.__scene; if(!s) return;
  selMode=!!on; selN=0; s.setSelectMode(selMode);
  if(selMode){ editSel=null; window.__editSel=null; }   // 選択中は誤って設置しないように
}
// 収納 = 設置済みの装飾を在庫に戻す(位置は失われるが置き直せる)
function stow(mode){ const s=window.__scene; if(!s) return;
  let n=0;
  if(mode==='all'){
    const total=s.stowables().length;
    if(!total){ toast('床に装飾がありません'); return; }
    if(!confirm(`床の装飾 ${total} 個をすべて在庫に戻します。配置はやり直しになります。よろしいですか？`)) return;
    n=s.stowAll();
  } else {
    if(!selN){ toast('戻す装飾を床でクリックして選んでください'); return; }
    n=s.stowSelected();
  }
  snapLayout(); saveGame(); updateBadge(); renderPalette();
  toast(`${n}個を在庫に戻しました`);
}
window.__editPlaceAt=(c,r)=>{ const sel=window.__editSel; if(!sel)return;
  if(availN(sel.kind,sel.sub)<=0){ editSel=null; window.__editSel=null; renderPalette(); return; }
  const s=window.__scene; const id = s.addPlaced(sel.kind, sel.sub, {cell:{c,r}, dir:s.placeDir});
  if(id){ snapLayout(); saveGame(); updateBadge(); toast('設置しました'); if(availN(sel.kind,sel.sub)<=0){ editSel=null; window.__editSel=null; } renderPalette(); } };
/* ===== 製造機の設定パネル: マスごとの素材 / 向き / 移動 / 撤去。編集中に機械をクリックで開く ===== */
let _matPick=null;   // 素材を選んでいる最中のスロット番号
window.__openMachine=(id)=>{
  const F=window.__factory; if(!F) return; _matPick=null;
  const dlg=openDialog({ title:'🏭 製造機', sub:()=>{ const m=F.getMachine(id); return m?`${m.size}マス${m.lvl>1?` Lv${m.lvl}`:''}`:''; },
    body:()=>{
    const m=F.getMachine(id); if(!m){ setTimeout(closeOverlay,0); return ''; }
    const slots=m.slots.map((mat,i)=>{ const d=mat&&MAT[mat];
      return `<div class="rc" style="cursor:pointer" data-slot="${i}">
        <div class="ic">${d?d.e:'➕'}</div>
        <div class="mid"><div class="nm">${i+1}マス目</div>
        <div class="cost">${d?d.n:'素材を選ぶ'}</div></div>
        ${d?`<button data-clear="${i}">外す</button>`:''}</div>`; }).join('');
    const picker = _matPick==null ? '' :
      `<div class="cost" style="margin:10px 0 6px;color:#7fe6ff">${_matPick+1}マス目に入れる素材</div>`
      + `<div class="pitems" style="display:flex;flex-wrap:wrap;gap:6px;width:auto;max-height:none">`
      + MATS.map(m2=>`<div class="pitem" data-mat="${m2.id}" style="cursor:pointer">${m2.e}<small>${m2.n}</small></div>`).join('')
      + `</div>`;
    const st=machState(id), need=needWp(m), pct=Math.min(100, st.wp/need*100);
    const nSet=m.slots.filter(Boolean).length;
    const run = `<div class="wpline" style="margin-top:12px"><div class="kv">
        <span${WPST.ok?'':' style="color:#ff9f7a"'}>${!WPST.ok?'WP未取得':(st.running?'次の製品まで':'停止中（溜めたWPは保持）')}</span>
        <b>${Math.floor(st.wp)} / ${need} WP</b></div>
        <div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div></div>
      <div class="rc" style="margin-top:8px"><div class="mid"><div class="nm">${st.running?'⚙️ 製造中':'⏸ 待機中'}</div>
        <div class="cost">必要WP = ${m.size}マス × ${WP_PER_SLOT}WP</div></div>
        <button data-mrun="1"${(!st.running&&!nSet)?' disabled':''}>${st.running?'■ 停止':'▶ 製造開始'}</button></div>`;
    return `<div class="cost" style="margin:2px 0 8px">1マスにつき素材1つ。入っている素材の<b>組合せ</b>で作れる物が変わります（順番は関係なし）。素材は🏭製造タブでもまとめてセットできます。</div>`
      + slots + picker + run
      + `<div class="rc" style="margin-top:12px"><div class="mid"><div class="nm">配置</div>`
      + `<div class="cost">向きを変える / 別の場所へ移す（撤去は🗑ゴミ箱へドラッグ）</div></div>`
      + `<button data-rot="1">↻ 回転</button><button data-move="1" style="margin-left:5px">✥ 移動</button></div>`;
  },
    actions:[{label:'🏭 製造タブへ',kind:'ghost',on:()=>openCraft()}],
    onRender:(p,d)=>{
    p.querySelectorAll('[data-slot]').forEach(el=>el.onclick=(ev)=>{
      if(ev.target.dataset && ev.target.dataset.clear!=null) return; _matPick=+el.dataset.slot; d.refresh(); });
    p.querySelectorAll('[data-clear]').forEach(el=>el.onclick=(ev)=>{
      ev.stopPropagation(); setMat(id, +el.dataset.clear, null); _matPick=null; d.refresh(); });
    p.querySelectorAll('[data-mat]').forEach(el=>el.onclick=()=>{
      setMat(id, _matPick, el.dataset.mat); _matPick=null; d.refresh(); });
    p.querySelectorAll('[data-mrun]').forEach(el=>el.onclick=()=>{ toggleMachine(id); d.refresh(); });
    p.querySelectorAll('[data-rot]').forEach(el=>el.onclick=()=>{
      if(!F.rotateMachine(id)){ toast('回した先に空きがありません'); return; } window.__layoutChanged(); renderCraft(); d.refresh(); });
    // 移動: シーンが「掴んで床クリックで置き直す」モードに入る。
    // パネルが開いたままだと床をクリックできないので必ず閉じる。保存もシーン側(__layoutChanged)が行う。
    p.querySelectorAll('[data-move]').forEach(el=>el.onclick=()=>{
      if(!F.beginMoveMachine(id)){ toast('移動できません'); return; }
      closeOverlay(); syncEditFab(); });   // 移動は必要なら編集モードをONにするので表示を合わせる
    // 撤去はドラッグ&ドロップ(🗑ゴミ箱)に一本化したのでボタンは持たない
  } });
  return dlg;
};
/* 編集モードのON/OFF表示をシーンに合わせる。Eキーや「✥移動」でシーン側から切り替わることがある */
function syncEditFab(){ const on=!!(window.__scene&&window.__scene.editMode), fab=document.getElementById('editFab');
  if(fab.classList.contains('on')===on) return;              // 変化したときだけ描き直す
  fab.classList.toggle('on',on); paletteEl.classList.toggle('show',on);
  if(on) renderPalette(); else { editSel=null; window.__editSel=null; } }
function toggleEditMode(){ if(!window.__scene){ toast('準備中…'); return; }
  const on=window.__scene.toggleEdit(); syncEditFab();
  toast(on?'🔧 編集: パレットで選ぶ→床クリックで設置（Rで向き）/ 設置済みはドラッグで移動・🗑へドラッグで撤去':'編集モードを終了'); }
document.getElementById('editFab').addEventListener('click',toggleEditMode);
document.getElementById('editMenuBtn').addEventListener('click',toggleEditMode);
loadGame().then(async ()=>{
  G.lastT=Date.now();
  await waitScene(); applyOwned(); updateBadge();
  setInterval(()=>{ G.lastT=Date.now(); saveGame(); }, 15000);
  setInterval(syncEditFab, 1000); syncEditFab();   // Eキー・移動モードでの編集ON/OFFに追従
  // 製造: 原材料バッジを反映してからWPの取得を開始（3秒ごと = OTelのログ送信間隔に合わせる）
  if(window.__scene&&window.__scene.refreshMachineBadges) window.__scene.refreshMachineBadges();
  updateDoneBtn(); renderCraft(); pollWp(); setInterval(pollWp, 3000);
  const q=new URLSearchParams(location.search);
  if(q.get('unlockall')){   // 全背景・全アイテムを所持(テスト用)。何度開いても増殖しないよう max で設定
    G.bgOwned=Array.from(new Set([...G.bgOwned,'auto',...SKY_THEMES]));
    G.seriesOwned=Array.from(new Set([...G.seriesOwned,...ROOM_THEMES]));
    G.floorOwned=Array.from(new Set([...G.floorOwned,...Object.keys(FLOOR)]));
    G.money=Math.max(G.money,999999);
    for(const t of Object.keys(MACH)) G.stock.machine[t]=Math.max(3,G.stock.machine[t]||0);
    for(const t of Object.keys(PROP)) G.stock.prop[t]=Math.max(3,G.stock.prop[t]||0);
    for(const t of Object.keys(DECO)) G.stock.deco[t]=Math.max(3,G.stock.deco[t]||0);
    saveGame(); updateBadge(); toast('✅ 全背景・全アイテムを解放しました（在庫）');
  }
  if(q.get('edit')){ paletteEl.classList.add('show'); document.getElementById('editFab').classList.add('on'); renderPalette(); }
  if(q.get('shop'))openShop(q.get('shop')==='1'?undefined:q.get('shop'));
});
</script>
