<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude Factory</title>
<link rel="icon" type="image/png" sizes="96x96" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/favicon-192.png">
<style>
  :root{ --ink:#e6fff4; --gold:#ffd27a; --mint:#9fdcc6; --panel:rgba(16,24,26,.82); --edge:#2c4740;
         --palw:336px; --slide:.42s cubic-bezier(.22,.75,.24,1); }
  html,body{height:100%;margin:0;background:radial-gradient(120% 120% at 50% 30%,#1b232b 0%,#0c1014 70%);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--ink);overflow:hidden}
  #wrap{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
  /* 編集中は工場が右へスッと寄り、空いた左にパレットが入る。
     縮小して逃がすのではなく、パレットを除いた残り幅いっぱいまで盤面を広げる
     (margin-left で右へ寄せると、flex の中央揃えがパレットの右側を基準に効く)。
     Phaser は Scale.FIT で親要素を見ているが、再フィットは 500ms ポーリングなので
     アニメ中は JS から毎フレーム scale.refresh() を叩いて追従させる。 */
  #game{width:min(1300px,96vw);aspect-ratio:1024/572;margin-left:0;
        transition:width var(--slide),margin-left var(--slide)}
  #wrap.editing #game{width:min(1300px,calc(100vw - var(--palw) - 32px));margin-left:var(--palw)}
  #game canvas{image-rendering:pixelated;border-radius:8px;box-shadow:0 24px 80px rgba(0,0,0,.6)}
  .tab{background:var(--panel);color:var(--mint);border:1px solid var(--edge);border-radius:8px;padding:5px 12px;cursor:pointer;backdrop-filter:blur(3px)}
  .tab:hover{border-color:var(--mint)}
  /* ===== ハンバーガーメニュー（主要機能以外はここに畳む） ===== */
  #menuBtn{position:absolute;top:10px;right:12px;z-index:11;cursor:pointer;font-size:16px;line-height:1;
           background:var(--panel);border:1px solid var(--edge);border-radius:8px;padding:7px 11px;color:var(--mint);backdrop-filter:blur(3px)}
  #menuBtn:hover{border-color:var(--mint)}
  #menu{position:absolute;top:46px;right:12px;z-index:11;display:none;flex-direction:column;gap:2px;min-width:172px;
        background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:6px;backdrop-filter:blur(5px)}
  #menu.show{display:flex}
  #menu .mi{padding:8px 11px;border-radius:7px;cursor:pointer;font-size:12px;color:var(--ink);text-decoration:none;display:block}
  #menu .mi:hover{background:#1d262c;color:var(--gold)}
  /* 役割ごとの小見出しと区切り（工場 / 仲間 / 記録） */
  #menu .mh{font-size:9px;letter-spacing:.14em;color:#7f9a92;text-transform:uppercase;padding:5px 11px 3px}
  #menu .msep{height:1px;background:var(--edge);margin:5px 6px}
  /* ===== 今日の労働量（このゲームの主役の数字。製造設定とは分ける） ===== */
  /* 実績ボードと製造設定は横並び。幅が足りなければ上下に折り返す */
  /* 左の #note と右の☰に被らないよう、左右の余白を非対称に確保して
     その内側で中央寄せする。vw から一律に引くと狭い画面で必要以上に縮む。 */
  #topwrap{position:absolute;top:10px;left:160px;right:70px;margin:0 auto;z-index:7;display:flex;gap:10px;
           flex-wrap:wrap;justify-content:center;align-items:stretch;
           width:fit-content;max-width:min(1040px,100%)}
  #board{display:flex;gap:0;flex:none;align-items:center;
         background:var(--panel);border:1px solid var(--edge);border-radius:12px;overflow:hidden;backdrop-filter:blur(4px)}
  #board .m{padding:8px 22px;text-align:center;min-width:126px}
  #board .m+.m{border-left:1px solid var(--edge)}
  #board .v{font-size:27px;line-height:1.1;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
  #board .v small{font-size:12px;color:#9fdcc6;font-weight:400;margin-left:2px}
  #board .l{font-size:9.5px;color:#9fb0c0;letter-spacing:.06em;margin-top:1px}
  #board .m.prod .v{color:#7fe6ff}
  #board .m.sales .v{color:#ffd27a}
  /* 💰は数字の後ろ。絵文字が行の高さを押し広げないよう固定してベースラインに揃える */
  #board .m.sales .v small{display:inline-block;line-height:1;vertical-align:baseline;
                           margin:0 0 0 3px;color:#ffd27a}
  #board .m.hit{cursor:pointer}                     /* クリックで今日の製造を開く */
  #board .m.hit:hover{background:rgba(127,230,255,.09)}
  /* 工場レイアウト編集は常時アクセスできるよう右下に固定 */
  #editFab{position:absolute;right:12px;bottom:12px;z-index:9;cursor:pointer;font-size:12px;
           background:var(--panel);border:1px solid var(--edge);border-radius:9px;padding:8px 13px;color:var(--mint);backdrop-filter:blur(3px)}
  #editFab:hover{border-color:var(--mint)}
  #editFab.on{background:#78d0a6;border-color:#78d0a6;color:#17251f;font-weight:700}
  /* 稼働/休憩は Claude君の絵で示す（稼働=作業ポーズ+火花 / 休憩=座り+☕）。
     常時見えるのはこのコンパクト表示だけ。クリックでエージェント一覧ダイアログを開く。 */
  #hud{position:absolute;left:12px;bottom:12px;z-index:6;display:flex;gap:8px;background:var(--panel);
       border:1px solid var(--edge);border-radius:10px;padding:5px 9px;backdrop-filter:blur(3px);cursor:pointer}
  #hud:hover{border-color:var(--mint)}
  #hud::after{content:'👥▸';align-self:center;font-size:10px;color:#9fdcc6;margin-left:1px}
  #hud .st{position:relative;display:flex;align-items:flex-end;gap:2px}
  #hud .st img{width:30px;height:32px;image-rendering:pixelated;display:block}
  #hud .st .fx{position:absolute;top:-2px;right:12px;font-size:12px;font-style:normal;line-height:1}
  #hud b{font-size:15px;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1.6}
  #hud b.idle{color:#9fdcc6}
  #note{position:absolute;top:10px;left:12px;font-size:10px;color:#9fdcc6;background:var(--panel);padding:4px 9px;border-radius:6px;z-index:6}
  /* エージェントの顔アイコン(体色＋被り物)。エージェント一覧ダイアログで使う */
  .lgH{font-size:9px;letter-spacing:.14em;color:#9fdcc6;text-transform:uppercase;margin-bottom:1px}
  .lgAv{position:relative;width:22px;height:22px;border-radius:6px;flex:none;border:1px solid #0006;overflow:hidden;display:inline-block}
  .lgAv .eye{position:absolute;top:8px;width:3px;height:3px;background:#241713;border-radius:1px}
  .lgAv .eye.l{left:5px} .lgAv .eye.r{right:5px}
  .lgAv img{position:absolute;left:50%;top:-3px;transform:translateX(-50%);width:24px;height:auto;image-rendering:pixelated}
  /* 稼働/休憩バッジ */
  .agSt{display:inline-block;font-size:10px;padding:1px 7px;border-radius:99px;border:1px solid var(--edge);color:#9fdcc6;margin-right:5px}
  .agSt.on{color:#7fe6ff;border-color:#2f5c6b}
  /* overlay */
  #overlay{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(6,10,12,.72);backdrop-filter:blur(4px)}
  #overlay.show{display:flex}
  /* 固定サイズ: 中身が変わっても外枠がガタつかない。内部(.pbody)だけスクロール。
     共通ダイアログは 見出し(.dlgHead) / 本文(.pbody) / 操作(.dlgFoot) の縦3段。 */
  #panel{position:relative;background:#12181c;border:1px solid var(--edge);border-radius:12px;padding:16px 20px;width:min(680px,92vw);height:min(72vh,560px);overflow:hidden;
         display:flex;flex-direction:column}
  .pbody{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-right:6px}
  #panel h2{margin:0 0 8px;font-size:16px;color:var(--gold);padding-right:22px}
  #panel .close{position:absolute;top:8px;right:14px;font-size:20px;color:#9fb0c0;cursor:pointer;z-index:2}
  #panel .close:hover{color:var(--gold)}
  .dlgHead{flex:none}
  .dlgHead .sttabs{margin:6px 0 2px}
  .dlgSub{font-size:12px;color:#9fb0c0;font-weight:400;margin-left:8px}
  .dlgFoot{flex:none;display:flex;gap:8px;align-items:center;justify-content:flex-end;
           border-top:1px solid var(--edge);margin-top:10px;padding-top:10px}
  .dbtn{background:var(--gold);color:#243b34;font-weight:700;border:none;border-radius:8px;padding:9px 16px;cursor:pointer;font-family:inherit;font-size:12px}
  .dbtn.ghost{background:#3a4a45;color:#cfeee0}
  .dbtn:disabled{background:#33403c;color:#7f8f89;cursor:not-allowed}
  .rowline{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0;font-size:12px}
  .btn{background:var(--gold);color:#243b34;font-weight:700;border:none;border-radius:8px;padding:9px 16px;cursor:pointer;font-family:inherit;font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,66px);gap:8px;margin-top:6px}
  .cell{width:66px;height:80px;border-radius:8px;border:2px solid #333;background:#0e1417;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:28px;position:relative;cursor:pointer}
  .cell small{font-size:8px;margin-top:1px} .cell .qty{position:absolute;bottom:2px;right:5px;font-size:9px;color:#fff}
  .cell.own:hover{box-shadow:0 0 0 2px var(--gold) inset}
  .cardwrap{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:100px;align-items:center;margin:6px 0}
  .card{width:72px;height:94px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:32px;border:2px solid #fff;animation:pop .45s ease both}
  .card small{font-size:9px;font-weight:700;margin-top:2px}
  @keyframes pop{0%{transform:scale(.2) rotate(-8deg);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1)}}
  /* トーストは盤面の上に一瞬出るだけ。ドラッグ中に出てもポインタを奪わない */
  #toast{position:absolute;bottom:70px;left:50%;transform:translateX(-50%);background:var(--panel);color:var(--ink);padding:8px 16px;border-radius:8px;z-index:7;display:none;font-size:12px;pointer-events:none}
  /* craft */
  .invbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;background:#0e1417;border:1px solid var(--edge);border-radius:8px;padding:7px 9px;margin:6px 0;font-size:12px}
  .chip{display:inline-flex;align-items:center;gap:3px;background:#1a2228;border-radius:6px;padding:2px 7px}
  .chip b{color:#eafff4}
  .sttabs{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0 4px}
  .sttab{background:#141b20;border:1px solid var(--edge);border-radius:8px 8px 0 0;padding:5px 11px;cursor:pointer;font-size:12px;color:#9fdcc6}
  .sttab.on{background:#1d262c;border-color:var(--gold);color:var(--gold)}
  .rc{display:flex;align-items:center;gap:10px;background:#10171b;border:1px solid #243036;border-radius:9px;padding:8px 11px;margin:6px 0}
  .rc .ic{font-size:26px;width:34px;text-align:center}
  .rc .mid{flex:1;min-width:0}
  .rc .nm{font-size:13px;color:#eafff4;font-weight:700}
  .rc .cost{font-size:11px;color:#9fb0c0;margin-top:2px}
  .rc .cost .lack{color:#e0674e}
  .rc button{background:var(--gold);color:#243b34;font-weight:700;border:none;border-radius:7px;padding:8px 13px;cursor:pointer;font-family:inherit;font-size:12px}
  .rc button:disabled{background:#33403c;color:#7f8f89;cursor:not-allowed}
  .locked{opacity:.5}
  /* tech map */
  .map{display:flex;flex-direction:column;gap:2px}
  .tier{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:7px 0}
  .tlab{font-size:10px;color:#9fb0c0;width:74px;flex:none}
  .node{display:inline-flex;flex-direction:column;align-items:center;background:#131b20;border:1px solid var(--edge);border-radius:8px;padding:6px 9px;min-width:60px}
  .node.mach{border-color:#c98b52} .node.mat{border-color:#4a6b7a} .node .e{font-size:22px} .node small{font-size:9px;color:#cfeee0;margin-top:1px}
  .arrow{color:#5f7a72;font-size:16px}
  /* 編集パレット。盤面に重ねると工場が隠れるので、左からスライドインする縦のサイドバーにした。
     盤面とは領域が重ならないので、以前必要だった pointer-events:none の逃がしは不要。 */
  #palette{position:fixed;left:0;top:0;bottom:0;width:var(--palw);box-sizing:border-box;z-index:8;display:flex;flex-direction:column;gap:7px;
    background:var(--panel);border-right:1px solid var(--edge);padding:14px 12px;backdrop-filter:blur(6px);
    overflow-y:auto;overscroll-behavior:contain;box-shadow:8px 0 32px rgba(0,0,0,.45);
    transform:translateX(-100%);transition:transform var(--slide);will-change:transform}
  #palette.show{transform:none}
  .phead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:8px;border-bottom:1px solid var(--edge)}
  .phead b{color:var(--gold);font-size:13px}
  .phead .c{background:#141b20;border:1px solid var(--edge);border-radius:7px;padding:3px 9px;cursor:pointer;font-size:11px;color:#9fdcc6}
  .pcat{display:flex;gap:5px;flex-wrap:wrap}
  .pcat .c{background:#141b20;border:1px solid var(--edge);border-radius:7px;padding:4px 11px;cursor:pointer;font-size:12px;color:#9fdcc6}
  .pcat .c.on{border-color:var(--gold);color:var(--gold);background:#1d262c}
  /* 装飾のテーマ絞り込み行。数が多いので少し小さめ＋縦スクロールで畳む */
  .pfil{max-height:84px;overflow-y:auto}
  .pfil .c{font-size:11px;padding:3px 8px}
  .pitems{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-height:120px;overflow-y:auto;align-content:flex-start}
  .pitem{width:62px;height:64px;border:2px solid #2c3a38;border-radius:8px;background:#0e1417;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;cursor:pointer;position:relative;pointer-events:auto}
  .pitem:hover{border-color:#5f8a80}
  .pitem.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
  .pitem.cur{border-color:#7fe6ff}
  .pitem small{font-size:8px;color:#cfeee0;margin-top:1px;max-width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pitem .qn{position:absolute;top:1px;right:4px;font-size:9px;color:#7fe6ff;font-weight:700}
  .pitem.dim{opacity:.4;cursor:default}
  .phint{font-size:10px;color:#9fb0c0}
  /* ===== 製造のコンパクト表示（いま作っている物とWPだけ）。クリックで🏭製造ダイアログ ===== */
  #craft{background:var(--panel);border:1px solid var(--edge);border-radius:11px;padding:7px 12px;font-size:11px;
         backdrop-filter:blur(4px);display:flex;align-items:center;gap:9px;cursor:pointer;
         width:fit-content;max-width:min(340px,100%)}
  #craft:hover{border-color:var(--mint)}
  #craft .pe{font-size:25px;line-height:1;flex:none}
  #craft .nm{font-size:13px;font-weight:700;color:#eafff4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
  #craft .note{font-size:10px;color:#9fb0c0;margin-top:2px}
  #craft .note.warn{color:#ff9f7a}
  #craft .go{font-size:10px;color:#9fdcc6;flex:none}
  /* ===== 🏭製造ダイアログ: 原材料のマスとWPの進捗 ===== */
  .mslots{display:flex;gap:7px;flex-wrap:wrap}
  .mslot{position:relative;width:76px;height:66px;border:2px dashed #33443f;border-radius:9px;background:#0e1417;
         display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
  .mslot:hover{border-color:#5f8a80}
  .mslot.set{border-style:solid;border-color:var(--mint)}
  .mslot.pick{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
  .mslot .e{font-size:24px;line-height:1}
  .mslot small{font-size:9px;color:#cfeee0;margin-top:2px}
  .mslot .x{position:absolute;top:0;right:5px;font-size:11px;color:#9fb0c0}
  .mslot .x:hover{color:#ff9f7a}
  .wpline{margin-top:14px;border-top:1px solid var(--edge);padding-top:9px}
  /* 製造ダイアログ: 1台=1行の縦一覧。1画面に多く入るよう行の高さを詰める
     （見出し行は持たず、マス列の右端に開始ボタン / 進捗はバーと数値の横並び） */
  .mrow{background:#10171b;border:1px solid #243036;border-radius:9px;padding:7px 9px;margin:0 0 6px}
  .mrow.run{border-color:#3f6b58;background:#111d1a}
  .mrow .mslots{align-items:center;gap:5px}
  .mrow .mslot{width:40px;height:40px;border-radius:7px;border-width:1.5px}
  .mrow .mslot .e{font-size:19px}
  .mrow .mslot .x{top:-3px;right:1px;font-size:10px}
  .mrow .dbtn{margin-left:auto;padding:6px 11px;font-size:11px;white-space:nowrap}
  /* 進捗はバーと数値だけを1行に */
  .mrow .wpline{display:flex;align-items:center;gap:9px;margin-top:6px;padding-top:0;border-top:none}
  .mrow .wpline .bar{flex:1;margin-top:0}
  /* 桁数で幅が変わるとバーの長さが行ごとにずれるので、数値欄は固定幅＋等幅数字にする */
  .mrow .wpline b{flex:none;width:92px;text-align:right;font-size:10.5px;color:#cfeee0;
                  font-variant-numeric:tabular-nums;white-space:nowrap}
  /* 原材料ピッカー: 小さいチップを折り返して並べる */
  .mpick{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:6px;
         background:#0c1215;border:1px solid var(--edge);border-radius:8px;padding:6px 7px}
  .mchip{display:inline-flex;align-items:center;gap:3px;font-size:14px;cursor:pointer;
         background:#141b20;border:1px solid #2c3a38;border-radius:6px;padding:3px 7px}
  .mchip small{font-size:9.5px;color:#cfeee0}
  .mchip:hover{border-color:#5f8a80}
  .mchip.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
  /* ピッカーはジャンルごとの見出し + その下に原材料（タブでは切り替えない） */
  .mpick{flex-direction:column;align-items:stretch;gap:5px}
  .pgroup{display:flex;flex-direction:column;gap:3px}
  .pgroup .ghead{font-size:10px;color:var(--mint);letter-spacing:.04em}
  .pgroup .grow{display:flex;flex-wrap:wrap;gap:4px}
  .wpline .kv{display:flex;justify-content:space-between;color:#9fb0c0;font-size:11px}
  .wpline .kv b{color:#eafff4;font-variant-numeric:tabular-nums}
  .wpline .bar{height:9px;background:#0d1315;border:1px solid var(--edge);border-radius:5px;overflow:hidden;margin-top:5px}
  .wpline .bar>i{display:block;height:100%;background:linear-gradient(90deg,#78d0a6,var(--gold));width:0}
  /* メニューのドロップダウンと重ならないよう右の中央に置く */
  #doneBtn{position:absolute;top:50%;right:12px;transform:translateY(-50%);z-index:8;display:none;cursor:pointer;
           font-size:12px;background:var(--gold);color:#243b34;font-weight:700;padding:9px 14px;border-radius:9px;
           box-shadow:0 6px 20px rgba(0,0,0,.45)}
  #doneBtn.show{display:block}
  #doneN{background:#243b34;color:var(--gold);border-radius:99px;padding:0 6px;margin-left:3px;font-size:10px}
  /* 完成品 / 製品図鑑 のグリッド */
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:7px}
  .pcard{position:relative;background:#10171b;border:1px solid #243036;border-radius:9px;padding:8px 4px;text-align:center}
  .pcard .e{font-size:28px;line-height:1.1}
  .pcard .nm{font-size:10px;color:#eafff4;margin-top:2px}
  .pcard .rr{font-size:9px;margin-top:1px}
  .pcard .qn{font-size:9px;color:#7fe6ff}
  .pcard.miss{opacity:.28}
  .pcard .new{position:absolute;top:-5px;left:-4px;background:#ff5d6c;color:#fff;font-size:8px;
              font-weight:700;padding:1px 5px;border-radius:99px;transform:rotate(-8deg)}
  /* マイページ（工場名 / 選択した日・週のサマリ / WPの折れ線） */
  .myname{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .myname b{font-size:20px;color:var(--gold);line-height:1.3}

const NET={
  multi:false, last:null, collectionLoaded:false,
  rev:-1,          // いま手元にある工場の版番号。サーバはこれが一致すれば factory を省略する
  async probe(){
    try{
      const r=await fetch('/api/state',{cache:'no-store'});
      if(r.status===401){ location.href='/login'; return false; }
      if(!r.ok) return false;
      NET.last=await r.json(); NET.multi=true; return true;
    }catch(_){ return false; }
  },
  async call(method,path,body){
    try{
      const r=await fetch(path,{method,cache:'no-store',
        headers:body!==undefined?{'Content-Type':'application/json'}:undefined,
        body:body!==undefined?JSON.stringify(body):undefined});
      const j=await r.json().catch(()=>({}));
      if(!r.ok){ toast(j.error||`通信エラー (${r.status})`); return null; }
      return j;
    }catch(e){ toast('サーバに繋がりません'); return null; }
  },
};
/* サーバの factory を G に写す。UI 側のコードは G を読むだけなので変更不要 */
function applyFactory(f){
  if(!f) return;
  if(typeof f.rev==='number') NET.rev=f.rev;
  G.money=f.money; G.bg=f.bg; G.floor=f.floor; G.factoryName=f.name||'';
  G.bgOwned=f.bgOwned||['auto']; G.floorOwned=f.floorOwned||['wood'];
  G.seriesOwned=f.seriesOwned||[]; G.stock=f.stock||{machine:{},prop:{},deco:{}};
  G.emojiDecos=f.emojiDecos||[];
  G.layout=[
    ...(f.machines||[]).map(m=>({id:m.id,kind:'machine',variant:m.variant,dir:m.dir,c:m.cx,r:m.cy,lvl:m.lvl,slots:m.slots})),
    ...(f.props||[]),
  ];
  const c=craftState(); c.mach={};
  for(const m of (f.machines||[])) c.mach[m.id]={running:!!m.running, wp:m.wp};

/* サーバへ配置を送る（在庫を超える設置はサーバが拒否する） */
let layoutT=null;
function pushLayout(){
  if(layoutT) clearTimeout(layoutT);
  layoutT=setTimeout(async ()=>{
    snapLayout();
    const ms=(G.layout||[]).filter(e=>e.kind==='machine')
      .map(e=>({id:e.id,variant:e.variant,dir:e.dir,cx:e.c,cy:e.r,lvl:e.lvl}));
    const props=(G.layout||[]).filter(e=>e.kind!=='machine');
    const r=await NET.call('PUT','/api/layout',{machines:ms,props});
    if(r&&r.factory) applyFactory(r.factory);
  },400);
}
function saveGame(){
  if(NET.multi){ pushLayout(); return; }              // サーバ権威。配置だけ同期する
  if(saveT)clearTimeout(saveT); saveT=setTimeout(()=>{ const b=JSON.stringify(G);
  try{fetch('/api/save',{method:'POST',body:b});}catch(_){} try{localStorage.setItem('cf-save',b);}catch(_){}} ,400); }
async function loadGame(){
  if(await NET.probe()){                              // マルチユーザー版サーバに繋がった
    applyFactory(NET.last.factory);
    const d=await NET.call('GET','/api/collection');
    if(d){ const c=craftState();
      c.collection=Object.fromEntries(
        Object.entries(d.collection||{}).map(([k,v])=>[k,v.owned]));
      c.collectionMeta=d.collection||{}; G.inv=d.inv||{}; NET.collectionLoaded=true; }
    const sk=await NET.call('GET','/api/skins'); if(sk) G.skins=sk.skins||{};
    return;
  }
  let s=null; try{ s=await (await fetch('/api/save',{cache:'no-store'})).json(); }catch(_){}
  if(!s||typeof s!=='object'){ try{ s=JSON.parse(localStorage.getItem('cf-save')); }catch(_){} }
  if(s&&typeof s==='object') G=Object.assign(G,s);     // 旧セーブの景品(inv)・pityは引き継ぎ、経済フィールドを補完
  if(!G.inv)G.inv={}; if(!Array.isArray(G.machines)||!G.machines.length)G.machines=[{variant:'s2',lvl:1}]; if(!G.decos)G.decos={};
  /* 旧セーブ移行: 製造機の種別は machines[].type / layout[].sub と名前が割れていた。
     どちらも variant に寄せる（kind の下位で MACH/PROP/DECO 表を引くキー、の意）。 */
  for(const m of G.machines){ if(m.variant==null&&m.type!=null){ m.variant=m.type; delete m.type; }
    m.variant=machVariant(m.variant); }
  if(!Array.isArray(G.bgOwned))G.bgOwned=['auto']; if(!Array.isArray(G.floorOwned))G.floorOwned=['wood']; if(!G.bg)G.bg='auto'; if(!G.floor)G.floor='wood';
  if(!G.skins||typeof G.skins!=='object')G.skins={}; if(!Array.isArray(G.seriesOwned))G.seriesOwned=[]; if(!Array.isArray(G.emojiDecos))G.emojiDecos=[]; if(!Array.isArray(G.layout))G.layout=[];
  // 旧セーブの layout[].sub → variant。この下の在庫復元が variant を読むので必ず先に済ませる
  for(const e of G.layout) if(e.variant==null&&e.sub!=null){ e.variant=e.sub; delete e.sub; }
  ['money'].forEach(k=>{ if(typeof G[k]!=='number')G[k]=0; });
  // 在庫(owned)。無ければ現在の配置から復元(既存の設置物は所持扱い)
  if(!G.stock||typeof G.stock!=='object'){ G.stock={machine:{},prop:{},deco:{}};
    for(const e of G.layout){ if(G.stock[e.kind]) G.stock[e.kind][e.variant]=(G.stock[e.kind][e.variant]||0)+1; } }
  for(const k of ['machine','prop','deco']) if(!G.stock[k]||typeof G.stock[k]!=='object') G.stock[k]={};
  delete G.stock.belt; delete G.belts;                       // コンベアは廃止
  // 旧セーブの移行: コンベア/出荷口の配置を捨て、旧4種の製造機を1マス機に読み替える
  G.layout=(G.layout||[]).filter(e=>e.kind!=='belt'&&e.kind!=='outlet');
  for(const e of G.layout) if(e.kind==='machine') e.variant=machVariant(e.variant);
  const ms={}; for(const t in G.stock.machine) ms[machVariant(t)]=(ms[machVariant(t)]||0)+G.stock.machine[t];
  G.stock.machine=ms; }
// 在庫と配置数
function ownedN(kind,variant){ return (G.stock[kind]&&G.stock[kind][variant])||0; }
function availN(kind,variant){ return Math.max(0, ownedN(kind,variant) - placedCount(kind,variant)); }
function addStock(kind,variant,n){ n=n||1; if(!G.stock[kind])G.stock[kind]={}; G.stock[kind][variant]=(G.stock[kind][variant]||0)+n; }
// 設置済みは必ず所持(在庫)に含める(在庫 >= 設置数 を保証)
function reconcileStock(){ const need={machine:{},prop:{},deco:{}};
  for(const e of (G.layout||[])) if(need[e.kind]) need[e.kind][e.variant]=(need[e.kind][e.variant]||0)+1;
  for(const k of ['machine','prop','deco']){ for(const s in need[k]) if((G.stock[k][s]||0)<need[k][s]) G.stock[k][s]=need[k][s]; } }
// 配置レイアウト(位置)の唯一の真実 = G.layout。シーンから同期。
function snapLayout(){ if(window.__scene) G.layout=window.__scene.getLayout(); }
window.__layoutChanged=()=>{ snapLayout(); saveGame(); };
const placedCount=(kind,variant)=> (G.layout||[]).filter(e=>e.kind===kind&&(variant==null||e.variant===variant)).length;

window.__skinChanged=(proj,skinId)=>{ if(!proj)return;

const overlay=document.getElementById('overlay'), panel=document.getElementById('panel');
/* =========================================================================
   DOM差分適用（morph） — 再描画で「いまの状態」を壊さないための土台
   innerHTML の貼り替えは DOM ノードを丸ごと捨てるので、
     ・選択中のテキスト（ハイライト）が解除される
     ・入れ子のスクロール位置 / フォーカス / ホバー / 入力途中の値が失われる
     ・<img> が読み直しになってちらつく
   live更新（1〜2秒ごと）ではこれが延々と起きる。そこで
   「新しく描いたツリーへ、既存ツリーを最小の変更で寄せる」方式にする。
   ノードが生き残るので、上のどれも副作用として保たれる。
     data-key   : 並び替わるリストに付けると、ノードを持ち回して同一性を保てる
     data-morph="skip" : 既にある要素の中身には触れない（外部が触る領域の保護用）
   ========================================================================= */
function _morphAttrs(from,to){
  for(const a of Array.from(from.attributes)) if(!to.hasAttribute(a.name)) from.removeAttribute(a.name);
  for(const a of Array.from(to.attributes)) if(from.getAttribute(a.name)!==a.value) from.setAttribute(a.name,a.value);
}
// 差し替えずに寄せられる組み合わせか。data-key が違うものは別物として扱う
function _morphSame(a,b){
  if(a.nodeType!==b.nodeType) return false;
  if(a.nodeType!==1) return true;
  return a.tagName===b.tagName && (a.getAttribute('data-key')||null)===(b.getAttribute('data-key')||null);
}
function _morphNode(from,to){
  if(from.nodeType!==1){ if(from.nodeValue!==to.nodeValue) from.nodeValue=to.nodeValue; return; }
  if(to.getAttribute('data-morph')==='skip') return;
  _morphAttrs(from,to);
  _morphChildren(from,to);
}
function _morphChildren(from,to){
  // data-key を持つ既存の子を先に拾っておく（並びが変わってもノードを使い回す）
  const keyed=new Map();
  for(const c of Array.from(from.childNodes))
    if(c.nodeType===1){ const k=c.getAttribute('data-key'); if(k) keyed.set(k,c); }
  let cur=from.firstChild;
  for(const t of Array.from(to.childNodes)){
    const k=(t.nodeType===1)?t.getAttribute('data-key'):null;
    let hit=null;
    if(k){ if(keyed.has(k)){ hit=keyed.get(k); keyed.delete(k); } }
    // キー無しは位置で対応づける。キー付きの既存ノードは「その場所の持ち主」ではないので使わない
    else if(cur && _morphSame(cur,t) && !(cur.nodeType===1&&cur.getAttribute('data-key'))) hit=cur;
    if(hit){
      if(hit===cur) cur=cur.nextSibling; else from.insertBefore(hit,cur);
      _morphNode(hit,t);
    } else from.insertBefore(t.cloneNode(true),cur);       // cur が null なら末尾に足される
  }
  while(cur){ const n=cur.nextSibling; from.removeChild(cur); cur=n; }   // cur 以降は残りもの
}
/* html を root の中身に反映する。root の子ノードは可能な限り再利用される */
function morphInto(root,html){
  const tmp=document.createElement('div'); tmp.innerHTML=html;
  _morphChildren(root,tmp);
}
window.morphInto=morphInto;        // scene(main.js)のHUD更新からも使う
/* =========================================================================
   共通ダイアログ — 見出し / タブ / 本文 / フッターの操作ボタン / 閉じる
   すべてのダイアログ(ショップ・図鑑・エージェント・原材料・製造機…)はこれに載せる。
     openDialog({
       title  : 見出し（絵文字込みの文字列）
       subtitle: 見出し右の小さい補足。文字列 or (dlg)=>文字列
       tabs   : [{id,label}] or (dlg)=>[…]  省略可。タブ付きダイアログ
       tab    : 初期タブid
       onTab  : (id,dlg)=>void  タブを押したとき（省略時は dlg.tab を差し替えて再描画）
       body   : 本文HTML or (dlg)=>HTML   ※refresh のたびに呼ばれる
       actions: [{label,on,kind:'primary'|'ghost',disabled}] or (dlg)=>[…]  フッターのボタン
       live   : ミリ秒。開いている間この間隔で再描画する（エージェント一覧など）
       onRender:(panel,dlg)=>void  本文描画後のイベント結線
     })
   戻り値 dlg = { tab, refresh(), setTab(id), close() }

   body は毎回まるごと組み直してよい（宣言的に書ける）。実際の DOM への反映は
   morphInto による差分適用なので、変わっていない部分のノードはそのまま残る。
   ＝ 文字の選択・入れ子のスクロール位置・フォーカス・画像は live更新でも壊れない。
   並びが変わりうるリストの各要素には data-key を付けること（付いていないと
   位置で対応づけるため、並び替えのときに中身だけが入れ替わる）。
   onRender は毎回呼ばれるので、結線は el.onclick= のような冪等な形で書く
   （addEventListener はノードが残るぶん二重登録になる）。
   ========================================================================= */
let _dlg=null, _dlgTimer=null;
function closeOverlay(){ overlay.classList.remove('show');
  if(_dlgTimer){ clearInterval(_dlgTimer); _dlgTimer=null; } _dlg=null;
  if(document.getElementById('palette').classList.contains('show')&&window.renderPalette) renderPalette(); }
function openDialog(o){
  const val=(v,d)=>(typeof v==='function')?v(d):v;
  const dlg={ tab:o.tab||null, refresh, setTab, close:closeOverlay };
  let mounted=false, shownTab=null;                          // 初回だけは前のダイアログの残骸を捨てて建て直す
  function setTab(id){ dlg.tab=id; if(o.onTab) o.onTab(id,dlg); else refresh(); }
  function refresh(){
    if(_dlg!==dlg) return;                                   // 別のダイアログに差し替わっていたら描かない
    const tabs=val(o.tabs,dlg)||[];
    const acts=val(o.actions,dlg)||[];
    const subtitle=o.subtitle!=null?val(o.subtitle,dlg):'';
    const html='<span class="close" title="閉じる">✕</span>'
      +`<div class="dlgHead"><h2>${o.title||''}${subtitle?`<span class="dlgSub">${subtitle}</span>`:''}</h2>`
      +(tabs.length?`<div class="sttabs">${tabs.map(t=>`<span class="sttab ${t.id===dlg.tab?'on':''}" data-dlgtab="${t.id}">${t.label}</span>`).join('')}</div>`:'')
      +'</div>'
      +`<div class="pbody">${val(o.body,dlg)||''}</div>`
      +(acts.length?`<div class="dlgFoot">${acts.map((a,i)=>
          `<button class="dbtn ${a.kind==='ghost'?'ghost':''}" data-dlgact="${i}"${a.disabled?' disabled':''}>${a.label}</button>`).join('')}</div>`:'');
    // 2回目以降は差分適用。選択中のテキストもスクロール位置も生き残る（morphInto の項を参照）
    const tabChanged = mounted && shownTab!==dlg.tab;
    if(mounted) morphInto(panel,html); else { panel.innerHTML=html; mounted=true; }
    shownTab=dlg.tab;
    // 本文が別物になるタブ切替のときだけ先頭へ。live更新ではスクロール位置を保つ
    if(tabChanged){ const b=panel.querySelector('.pbody'); if(b) b.scrollTop=0; }
    panel.querySelector('.close').onclick=closeOverlay;
    panel.querySelectorAll('[data-dlgtab]').forEach(el=>el.onclick=()=>setTab(el.dataset.dlgtab));
    panel.querySelectorAll('[data-dlgact]').forEach(el=>el.onclick=()=>{ const a=acts[+el.dataset.dlgact]; if(a&&a.on) a.on(dlg); });
    if(o.onRender) o.onRender(panel,dlg);
  }
  if(_dlgTimer){ clearInterval(_dlgTimer); _dlgTimer=null; }

  if(o.live) _dlgTimer=setInterval(()=>{ if(overlay.classList.contains('show')) refresh(); else closeOverlay(); }, o.live);
  return dlg;
}

/* =========================================================================
   製造プロトタイプ — 抽出機に原材料をセット → 実WPを溜めて製品化
   WP は /api/otel（OTel実測）の累計を参照する。セッション開始時点の累計を

/* 組み合わせ（重複を除いた原材料のソート済みキー）→ 出うる製品。
   手で書く表は持たず、PRODS の m から機械的に作る。m は製品ごとに1つしかないので
   「違う組み合わせから同じ製品が出る」ことが構造的に起きない（製品 → 組み合わせ は1対1）。
   図鑑に出す材料アイコンも同じ m を見ているので、表示とレシピは必ず一致する。
   逆向き（1つの組み合わせから複数の製品）は残してある。同じ m を持つ製品どうしは
   レア度の重み（RAR[r].w）で引き分けるので、同じ組み合わせを何度も試して上位レア度を狙う遊びになる。 */
const recipeKeyOf = (p)=> [...new Set(p.m||[])].sort().join(',');
const RECIPES = PRODS.reduce((r,p)=>{
  if(p.g===SECRET_G) return r;                  // シークレットはジャンル跨ぎ限定なので SECRETS 側
  const k=recipeKeyOf(p); (r[k]=r[k]||[]).push(p.id); return r;
}, {});

/* ジャンルを跨いだ組み合わせのときだけ引かれる隠しレシピ。
   ここに書いた組み合わせだけ p の確率でシークレット製品、外れは 🪨 謎のカタマリ。
   ここに無いジャンル跨ぎは必ず 🪨（＝跨ぎは基本ハズレ、という体験を保つ）。 */
const SECRETS = {
  'cotton,milk,thread'  : {pid:'cat',    p:0.12},   // 🥛牛乳 + ☁️綿 + 🪢糸
  'cloth,noodle'        : {pid:'ghost',  p:0.10},   // 🍥麺 + 🧵布
  'egg,glass,semic'     : {pid:'alien',  p:0.06},   // 🥚卵 + 🪟ガラス + 💾半導体
  'iron,leather,meat'   : {pid:'dragon', p:0.04},   // 🥩肉 + 🔩鉄 + 👝皮
};

/* レシピ値の3通りの書き方を [{p:製品, w:重み}] に正規化する。
   重み未指定はレア度の既定重み（RAR[r].w）を使う。 */
function normPool(spec){
  let list=[];
  if(Array.isArray(spec)) list=spec.map(x=>Array.isArray(x)?{id:x[0],w:+x[1]}:{id:x,w:null});
  else if(spec&&typeof spec==='object') list=Object.keys(spec).map(id=>({id,w:+spec[id]}));
  return list.filter(x=>PROD[x.id]).map(x=>({ p:PROD[x.id],
    w:(x.w!=null&&isFinite(x.w)&&x.w>0)?x.w:RAR[PROD[x.id].r].w }));
}
function pickWeighted(pool){
  if(!pool.length) return null;
  const ws=pool.reduce((s,x)=>s+x.w,0); let x=Math.random()*ws;
  for(const it of pool){ x-=it.w; if(x<=0) return it.p; }
  return pool[pool.length-1].p;
}
// デバッグ・テスト用: その組み合わせで出うる製品と確率（%）
function poolFor(key){
  if(!key) return [];
  const s=SECRETS[key];
  if(s&&PROD[s.pid]) return [{p:PROD[s.pid],w:s.p},{p:PROD[UNKNOWN_PRODUCT],w:1-s.p}];
  if(genresOfMats(key.split(',')).length>1) return [{p:PROD[UNKNOWN_PRODUCT],w:1}];
  const pool=normPool(RECIPES[key]);
  return pool.length?pool:[{p:PROD[UNKNOWN_PRODUCT],w:1}];
}
/* 組み合わせから1つ引く。判定の順番がゲーム性なのでここが唯一の分岐点。
   1. 隠しレシピ（ジャンル跨ぎ）→ p の確率でシークレット / 外れは🪨
   2. ジャンル跨ぎでレシピ無し  → 🪨
   3. 同ジャンルのレシピ         → 重み付き抽選
   4. 同ジャンルでレシピ無し     → 🪨 */
function rollProduct(key){
  if(!key) return PROD[UNKNOWN_PRODUCT];
  const s=SECRETS[key];
  if(s&&PROD[s.pid]) return (Math.random()<(s.p||0)) ? PROD[s.pid] : PROD[UNKNOWN_PRODUCT];
  if(genresOfMats(key.split(',')).length>1) return PROD[UNKNOWN_PRODUCT];
  return pickWeighted(normPool(RECIPES[key])) || PROD[UNKNOWN_PRODUCT];
}

// 旧セーブ移行: 原材料は「機械ID→素材1つ」だった。いまは機械のマスに入るので1マス目へ移す。
let _matsMigrated=false;
function migrateCraftMats(){
  if(_matsMigrated) return; const F=window.__factory; if(!F) return; _matsMigrated=true;
  const c=craftState(); const keys=Object.keys(c.mats||{}); if(!keys.length) return;
  let moved=0;
  for(const id of keys){ if(F.setSlot(id, 0, c.mats[id])) moved++; }
  c.mats={}; if(moved){ snapLayout(); saveGame(); toast(`原材料 ${moved} 件を製造機のマスへ移しました`); }
}
/* 製造の記録は「今日の集計」にしか使わないので7日ぶん・2000件までに抑える。
   売上も同じ期間だけ残す（セーブがじわじわ膨らむのを防ぐ） */
function trimCraftLog(c){
  const keepFrom=Date.now()-7*24*3600*1000;
  if(c.log.length>2000 || c.log.some(m=>!(m.at>=keepFrom)))
    c.log=c.log.filter(m=>m.at>=keepFrom).slice(-2000);
  const keepDay=jstDay(keepFrom);
  for(const d in c.sales) if(d<keepDay) delete c.sales[d];
}
function craftState(){
  if(!G.craft||typeof G.craft!=='object') G.craft={};
  const c=G.craft;
  if(!c.mats||typeof c.mats!=='object') c.mats={};
  if(c.activeId===undefined) c.activeId=null;
  // made = 🎁完成品の「まだ見ていない分」だけ。一覧を開いたら空にする（＝毎回が新着）
  if(!Array.isArray(c.made)) c.made=[];
  /* collection = 図鑑（product_id → 所持数）。旧セーブは c.dex という名前だったので拾う。
     旧名のまま残すと図鑑がまるごと空に見えるので、移行してから旧キーを消す。 */
  if(!c.collection||typeof c.collection!=='object'){
    c.collection = (c.dex&&typeof c.dex==='object') ? c.dex : {}; }
  if(c.dex!==undefined) delete c.dex;
  /* log = 製造の記録（📊今日の製造で使う）。made は開くと消えるので別に持つ。
     旧セーブには log が無いので、そのときだけ made から起こす。 */
  if(!Array.isArray(c.log)) c.log=c.made.map(m=>({pid:m.pid, at:m.at, key:m.key||'', mid:m.mid}));
  // sales = 日付(JST)ごとの売上。💰の加算と同じタイミングで積む
  if(!c.sales||typeof c.sales!=='object') c.sales={};
  trimCraftLog(c);
  // 製造は機械ごとに独立。mach[id] = {running, wp}
  if(!c.mach||typeof c.mach!=='object') c.mach={};
  // 旧セーブ移行: 単一セッション → いま選んでいた機械を稼働中にする
  if(c.session&&typeof c.session==='object'){
    const id=c.activeId; if(id){ if(!c.mach[id]) c.mach[id]={running:true,wp:0}; else c.mach[id].running=true; }
    c.session=null;
  } else if(c.session) c.session=null;
  return c;
}
/* 機械1台ぶんの製造状態。WPは「稼働中に稼いだ分の累積」。
   稼いだWPは台数で按分せず、稼働中の全機械に同額を加算する。 */
function machState(id){
  const c=craftState();
  if(!c.mach[id]||typeof c.mach[id]!=='object') c.mach[id]={running:false, wp:0};
  const st=c.mach[id];
  if(typeof st.wp!=='number'||!isFinite(st.wp)||st.wp<0) st.wp=0;
  st.running=!!st.running;
  return st;
}
const keyOfSlots = (slots)=>{ const set=[...new Set((slots||[]).filter(Boolean))].sort();
  return set.length?set.join(','):null; };
// 一覧はマス数の昇順。番号は設置順で固定しておく（並べ替えても号機名が変わらないように）
function machinesSorted(){
  const ms=machines(), no={}; ms.forEach((m,i)=>no[m.id]=i+1);
  return ms.slice().sort((a,b)=>(a.size-b.size)||(no[a.id]-no[b.id])).map(m=>({...m, no:no[m.id]}));
}
function runningCount(){ return machines().filter(m=>machState(m.id).running).length; }
/* 製造は「1台の製造機」単位。その機械の各マス(2〜5)が原材料スロット。
   activeId = いま製造に使っている機械。未指定なら最初の1台。 */
function machines(){ const s=window.__scene; return (s&&s.machineList)?s.machineList():[]; }
function activeMachine(){ const c=craftState(), ms=machines(); if(!ms.length) return null;
  return ms.find(m=>m.id===c.activeId) || ms[0]; }
function comboMats(){ const m=activeMachine(); return m ? m.slots.filter(Boolean) : []; }
function comboKey(){ return keyOfSlots(comboMats()); }
/* main.js が「この機械で何が作れるか」を描くために引く。レシピの正はこちら側。 */
window.__craft = {
  mat:(id)=>MAT[id]||null,
  // 何が作れるかは伏せる（探す楽しみを残す）。代わりに稼働状態と進捗だけ返す。
  preview:(slots, id)=>{
    const set=(slots||[]).filter(Boolean);
    if(!set.length) return null;                       // 素材未設定 → main.js 側が「素材未設定」を出す
    const ms=machines(), m=id?ms.find(x=>x.id===id):null;
    if(!m) return {e:'📦', n:'素材セット済み', unknown:false};
    const st=machState(m.id), need=needWp(m);
    return st.running
      ? {e:'⚙️', n:`製造中 ${Math.floor(st.wp)}/${need}WP`, unknown:false}
      : {e:'📦', n:'待機中', unknown:true};
  },
};

/* --- 状態の取得 ---
   マルチユーザー版は /api/state の1本にまとめてある。実測するとブラウザのポーリングが
   テレメトリ受信の30倍のリクエストを生むので、エンドポイントを統合し、
   タブが見えていないときは止める。 */
let wpState={ total:0, today:0, ok:false, scorecard:[] };
let pendingCount=0;
async function pollWp(){
  if(NET.multi){
    if(document.visibilityState==='hidden') return;   // 裏に回っている間は叩かない
    // 手元の版番号を渡す。工場の形が変わっていなければサーバは factory を返さない
    const d=await NET.call('GET','/api/state?rev='+NET.rev);
    if(!d){ wpState.ok=false; return; }
    NET.last=d;
    wpState={ total:d.wp.total, today:d.wp.today, ok:true, scorecard:wpState.scorecard };
    pendingCount=d.pending;
    if(d.factory){ applyFactory(d.factory); }      // 版が変わったときだけ来る
    else {
      // 差分だけ反映する（毎回変わるのは 💰 と各機械の進捗だけ）
      NET.rev=d.rev; G.money=d.money;
      const c=craftState();
      for(const m of (d.machines||[])) c.mach[m.id]={running:!!m.running, wp:m.wp};
    }
    if(window.__scene&&window.__scene.refreshMachines) window.__scene.refreshMachines();
    updateDoneBtn(); updateBadge(); renderCraft(); renderBoard();
    return;
  }
  try{
    const r=await fetch('/api/otel',{cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status);
    const d=await r.json();
    wpState={ total:d.wpTotal||0, today:d.wpToday||0, ok:true, scorecard:d.scorecard||[] };
  }catch(_){ wpState.ok=false; }
  tickCraft(); renderCraft();
}
/* main.js の poll() はここからエージェント一覧を受け取る（二重ポーリングを避ける） */
window.__agentFeed=()=> (NET.multi&&NET.last) ? {workers:NET.last.agents} : null;
/* --- 製造判定 ---
   ・稼いだWPは按分せず、稼働中の全機械にそれぞれ同額を加算する
   ・必要WPに達した「その時点」のマスの組み合わせで作られる製品が決まる
   ・原材料を変えてもWPはリセットしない（溜まった分はそのまま次に使う） */
function tickCraft(){
  if(NET.multi) return;            // 製造判定はサーバ側（server/craft.mjs）
  const c=craftState(); if(!wpState.ok) return;
  // 初回は基準だけ取る（起動前に稼いだWPを遡って入れない）
  if(typeof c.wpMark!=='number'){ c.wpMark=wpState.total; saveGame(); return; }
  const delta=Math.max(0, wpState.total - c.wpMark);
  c.wpMark=wpState.total;
  if(delta<=0) return;
  let last=null, total=0, gain=0;
  for(const m of machines()){
    const st=machState(m.id); if(!st.running) continue;
    st.wp += delta;
    const need=needWp(m); let n=0;
    while(st.wp>=need && n<20){
      st.wp-=need;                                  // 超過分は次の製品に繰り越す
      const key=keyOfSlots(m.slots);                // ここで初めて組み合わせを見る
      const p=key ? rollProduct(key) : PROD[UNKNOWN_PRODUCT];  // 空なら「レシピに無い」扱い
      if(!p) break;
      const rec={ pid:p.id, at:Date.now(), key:key||'', mid:m.id };
      c.made.push({...rec, viewed:false});   // 🎁完成品（開くと消える新着分）
      c.log.push(rec);                       // 📊今日の製造（記録として残る分）
      gain+=PROD_PRICE[p.r]||0;              // 売上は完成した瞬間に立てる（下でまとめて加算）
      last=p; total++; n++;
    }
  }
  // 製造個数と同じタイミングで 💰 と売上を積む（🎁を開くまで待たない）
  if(gain){ G.money+=gain; const d=jstDay(Date.now()); c.sales[d]=(c.sales[d]||0)+gain; }
  saveGame();
  if(total){
    updateDoneBtn(); updateBadge(); renderBoard();   // 💰と今日の売上がその場で動く
    if(window.__scene&&window.__scene.celebrate) window.__scene.celebrate(last.e);
    toast(`${last.e} ${last.n} が完成！(+💰${(PROD_PRICE[last.r]||0).toLocaleString()})${total>1?` ×${total}個`:''} 🎁完成品で確認`);
    if(window.__scene&&window.__scene.refreshMachines) window.__scene.refreshMachines();
  }
}

/* --- 今日の労働量ボード（画面上中央・このゲームの主役の数字） ---
   「今日どれだけ働いたか」を示す数字なので、製造の設定とは切り離して大きく出す。 */
const jstDay = t => new Date(t + 9*3600*1000).toISOString().slice(0,10);
// 今日の製造は記録(c.log)から数える。🎁完成品を開いても消えない
function logToday(){ const d=jstDay(Date.now()); return craftState().log.filter(m=>jstDay(m.at)===d); }
const madeToday = ()=> NET.multi ? ((NET.last&&NET.last.today.made)||0) : logToday().length;
const salesToday = ()=> NET.multi ? ((NET.last&&NET.last.today.sales)||0)
                                  : (craftState().sales[jstDay(Date.now())]||0);
function renderBoard(){
  const el=document.getElementById('board'); if(!el) return;
  // pollWp から数秒おきに呼ばれる。innerHTML を貼り替えると、そのたびに
  // ここの文字の選択（ハイライト）が解除されてしまうので差分適用にする
  morphInto(el,`
    <div class="m"><div class="v">${wpState.ok?Math.floor(wpState.today).toLocaleString():'—'}<small>WP</small></div>
      <div class="l">今日の労働量</div></div>
    <div class="m prod hit" id="todayBtn" title="クリックで今日つくったものを見る">
      <div class="v">${madeToday()}<small>個</small></div>
      <div class="l">今日の製造</div></div>
    <div class="m sales"><div class="v">${Math.floor(salesToday()).toLocaleString()}<small>💰</small></div>
      <div class="l">今日の売上</div></div>`);
  const b=document.getElementById('todayBtn'); if(b) b.onclick=openToday;
}
/* マルチユーザー版は製造判定がサーバ側なので c.log は空のまま。
   記録は /api/made（products_made）から取り、ローカル版と同じ形に揃えて同じ描画に流す。 */
let _madeToday=null;                  // null=まだ取れていない / 配列=今日の記録
const normMadeRow = r => ({ pid:r.product_id, at:new Date(r.made_at).getTime(), key:r.recipe_key||'' });
async function fetchMadeToday(dlg){
  const d=await NET.call('GET','/api/made');
  if(!d){ if(!_madeToday) _madeToday=[]; return; }   // 取れなかったら前回の内容を残す
  _madeToday=(d.made||[]).map(normMadeRow);
  if(dlg) dlg.refresh();
}
const madeTodayRows = ()=> NET.multi ? (_madeToday||[]) : logToday();
/* 📊 今日の製造 — 今日つくったものをレア度順に並べる（図鑑に近い見た目）。
   原材料の組み合わせも出すので、当たった組み合わせを見返す用途にも使える。 */
function openToday(){
  if(NET.multi) _madeToday=null;                    // 開くたび取り直す（前回開いた内容を出さない）
  const dlg=openDialog({ title:'📊 今日の製造',
    subtitle:()=>`${madeToday()}個 / 売上 💰${Math.floor(salesToday()).toLocaleString()}`,
    live:2000,
    body:()=>{
      if(NET.multi && !_madeToday) return '<div class="cost" style="padding:12px">読み込み中…</div>';
      const rows={};
      for(const m of madeTodayRows()){ const p=PROD[m.pid]; if(!p) continue;
        const r=rows[m.pid]||(rows[m.pid]={p, n:0, keys:{}});
        r.n++; if(m.key) r.keys[m.key]=(r.keys[m.key]||0)+1; }
      const list=Object.values(rows).sort((a,b)=>(b.p.r-a.p.r)||(b.n-a.n));
      if(!list.length) return '<div class="cost" style="padding:12px">今日はまだ何も作っていません。🏭製造で原材料をセットして ▶製造開始。</div>';
      const gain=list.reduce((s,r)=>s+(PROD_PRICE[r.p.r]||0)*r.n,0);
      return `<div class="pgrid">${list.map(r=>{
          // 製品ごとの組み合わせは1つなので普通は1行。過去の履歴に旧レシピが残る場合だけ複数出る（多い順に3つまで）
          const ks=Object.keys(r.keys).sort((a,b)=>r.keys[b]-r.keys[a]).slice(0,3)
            .map(k=>`<div class="qn" title="${k.split(',').map(x=>MAT[x]?MAT[x].n:x).join(' + ')}">${
              k.split(',').map(x=>MAT[x]?MAT[x].e:'').join('')}${r.keys[k]>1?` ×${r.keys[k]}`:''}</div>`).join('');
          return `<div class="pcard" data-key="pd:${r.p.id}" style="border-color:${RAR[r.p.r].c}"><div class="e">${r.p.e}</div>
            <div class="nm">${r.p.n}</div><div class="rr" style="color:${RAR[r.p.r].c}">${RAR[r.p.r].n}</div>
            <div class="qn"><b style="color:#eafff4">×${r.n}</b></div>${ks}</div>`; }).join('')}</div>
        <div class="rowline" style="font-size:11px;color:#9fb0c0">
          レア度の高い順。数字は今日つくった個数、その下は使った原材料の組み合わせ。
          今日つくったものの合計価値は 💰${gain.toLocaleString()}（完成した時点で 💰 に入っている）。</div>`;
    },
    actions:[{label:'📖 図鑑を見る',kind:'ghost',on:()=>openCollection('prod')}] });
  if(NET.multi){                       // 開いている間だけ記録を取りに行く（閉じたら止める）
    const pull=()=>{ if(_dlg!==dlg){ clearInterval(t); return; } fetchMadeToday(dlg); };
    const t=setInterval(pull, 5000); pull();
  }
  return dlg;
}

/* --- 製造のコンパクト表示（画面上中央）。詳しい操作は🏭製造ダイアログに寄せ、
       ここは「いま何を作っているか + WP」だけを出す導線にする --- */
/* 上中央のこれは🏭製造ダイアログを開くためのトリガー。
   進捗は各機械の行で見るので、ここでは稼働台数だけ出す。 */
function renderCraft(){
  const el=document.getElementById('craft'); if(!el) return;
  const ms=machines(), run=ms.filter(m=>machState(m.id).running).length;
  // メインは「製造機設定」。稼働状況は下に小さく添える（何のボタンか一目で分かるように）
  const st = !ms.length ? '製造機なし' : run ? `⚙️ 製造中 ${run}/${ms.length}台` : `📦 待機中 ${ms.length}台`;
  morphInto(el,`<span class="pe">🏭</span>
    <div class="mid"><div class="nm">製造機設定</div>
      <div class="note">${st}</div>${
      wpState.ok?'':'<div class="note warn">WP未取得（サーバ未接続）</div>'}</div>
    <span class="go">▸</span>`);
  el.title='クリックで🏭製造（原材料のセット・製造開始）';
  renderBoard();
}
/* 機械1台の製造開始/停止。WPはリセットしない（停止中は増えないだけ） */
function toggleMachine(id){
  const st=machState(id), ms=machines(), m=ms.find(x=>x.id===id);
  st.running=!st.running;
  craftState().activeId=id;
  if(NET.multi){ NET.call('PUT','/api/machine/run',{id,running:st.running})
    .then(r=>{ if(r&&r.factory){ applyFactory(r.factory); renderCraft(); } }); }
  else saveGame();
  renderCraft();
  if(window.__scene&&window.__scene.refreshMachines) window.__scene.refreshMachines();
  toast(st.running ? `${m?(m.no||''):''}号機の製造を開始（${m?needWp(m):0}WPで1個）` : '製造を停止（溜めたWPは保持）');
}

/* =========================================================================
   🏭 製造ダイアログ — 全機械を縦に並べた一覧
     ・タブで切り替えない（一覧性を優先）。並びはマス数の昇順
     ・各行でマスのセット / 進捗 / 製造開始・停止が完結する
     ・作れる物は出さない（組み合わせを探すのがゲームの目的）
   開いている間は1秒ごとに再描画してWPに追従する。
   ========================================================================= */
let _craftPick=null;                       // {mid, idx} = いま原材料を選んでいるマス
const matsOfGenre=(g)=>MATS.filter(m=>m.g===g);
const machTitle=(m)=>`${(MACH['s'+m.size]||{}).e||'🏭'} ${m.no}号機`;
/* 機械1台ぶんの行。🏭製造の一覧と、機械単体のダイアログで同じものを使う（見た目を揃える）。
   マス → クリックで原材料ピッカー / ▶製造開始・停止 / WPの進捗。 */
function machRow(m){
  const st=machState(m.id), need=needWp(m), pct=Math.min(100, st.wp/need*100);
  const nSet=m.slots.filter(Boolean).length;
  const slots=m.slots.map((mid,i)=>{ const mt=MAT[mid];
    const on=_craftPick&&_craftPick.mid===m.id&&_craftPick.idx===i;
    return `<div class="mslot ${mt?'set':''} ${on?'pick':''}" data-cslot="${i}" data-cmid="${m.id}"
      title="${i+1}マス目${mt?`: ${mt.n}`:''} — クリックで原材料を選ぶ">
      <span class="e">${mt?mt.e:'＋'}</span>
      ${mt?`<span class="x" data-cclear="${i}" data-cmid="${m.id}" title="外す">✕</span>`:''}</div>`; }).join('');
  // ピッカーはジャンルごとの見出し + その下に原材料（タブで切り替えない。跨いだセットもできる）
  const picker = (_craftPick&&_craftPick.mid===m.id) ? `<div class="mpick">
    ${GENRES.map(g=>`<div class="pgroup"><div class="ghead">${g.e} ${g.n}</div><div class="grow">
      ${matsOfGenre(g.id).map(x=>`<span class="mchip ${m.slots[_craftPick.idx]===x.id?'on':''}"
        data-cmat="${x.id}" data-cmid="${m.id}" title="${x.n}">${x.e}<small>${x.n}</small></span>`).join('')}
      </div></div>`).join('')}</div>` : '';
  return `<div class="mrow ${st.running?'run':''}" data-key="mach:${m.id}" title="${machTitle(m)}（${m.size}マス / 必要 ${need}WP）">
    <div class="mslots">${slots}
      <button class="dbtn ${st.running?'ghost':''}" data-crun="${m.id}"${(!st.running&&!nSet)?' disabled':''}
        title="${(!st.running&&!nSet)?'原材料を1つ以上セットしてください':''}">${st.running?'■ 停止':'▶ 製造開始'}</button>
    </div>${picker}
    <div class="wpline"><div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div>
      <b${wpState.ok?'':' style="color:#ff9f7a"'}>${Math.floor(st.wp)} / ${need} WP</b></div>
  </div>`;
}
/* machRow のクリックを結線する。dlg.refresh() で描き直す前提。 */
function bindMachRow(p,d){
  p.querySelectorAll('[data-crun]').forEach(el=>el.onclick=()=>{ toggleMachine(el.dataset.crun); d.refresh(); });
  p.querySelectorAll('[data-cslot]').forEach(el=>el.onclick=(ev)=>{
    if(ev.target.dataset && ev.target.dataset.cclear!=null) return;   // ✕(外す)は別扱い
    const mid=el.dataset.cmid, i=+el.dataset.cslot;
    _craftPick=(_craftPick&&_craftPick.mid===mid&&_craftPick.idx===i)?null:{mid,idx:i};
    d.refresh(); });
  p.querySelectorAll('[data-cclear]').forEach(el=>el.onclick=(ev)=>{
    ev.stopPropagation(); setMat(el.dataset.cmid, +el.dataset.cclear, null); _craftPick=null; d.refresh(); });
  p.querySelectorAll('[data-cmat]').forEach(el=>el.onclick=()=>{
    if(!_craftPick) return; setMat(el.dataset.cmid, _craftPick.idx, el.dataset.cmat); _craftPick=null; d.refresh(); });
}
function openCraft(){
  _craftPick=null;
  return openDialog({ title:'🏭 製造',
    subtitle:()=>{ const ms=machines(); return ms.length?`${ms.length}台 / 稼働 ${runningCount()}台`:'製造機がありません'; },
    live:1000,
    body:()=>{
      const ms=machinesSorted();
      if(!ms.length) return '<div class="cost" style="padding:12px">製造機がありません。🏪ショップで購入 → 🔧レイアウト編集で床に設置してください。</div>';
      return ms.map(machRow).join('');
    },
    onRender:bindMachRow });
}
document.getElementById('craftBtn').addEventListener('click',()=>openCraft());
document.getElementById('craft').addEventListener('click',()=>openCraft());

/* --- 原材料の選択（ピッカーは machRow の中にある。ここはセットの実体だけ） --- */
function setMat(machineId, slotIdx, matId){
  const c=craftState(), F=window.__factory;
  if(!F||!F.setSlot(machineId, slotIdx, matId||null)) return;   // 素材の実体は機械のマス(レイアウトに保存)
  c.activeId = machineId;
  // 原材料を変えても製造は止めず、溜まったWPも保持する。
  // 何ができるかは「必要WPに達した時点」の組み合わせで決まる（tickCraft）。
  snapLayout();
  if(NET.multi){
    const m=machines().find(x=>x.id===machineId);
    NET.call('PUT','/api/machine/slots',{id:machineId,slots:(m&&m.slots)||[]})
      .then(r=>{ if(r&&r.factory){ applyFactory(r.factory); renderCraft(); } });
  } else saveGame();
  renderCraft();
  toast(matId ? `${MAT[matId].e} ${MAT[matId].n} をセット` : '原材料を外しました');
}
// main.js から呼ばれる: 機械の上に出す原材料バッジ / 機械クリック
window.__matBadge = ()=>'';   // 原材料は機械のマス(スロット)に直接描かれるのでバッジは使わない

/* --- 完成品（新着だけを見せる箱。1回開いたら中身は空になる） --- */
function updateDoneBtn(){
  const c=craftState(), b=document.getElementById('doneBtn'); if(!b) return;
  const n = NET.multi ? pendingCount : c.made.length;
  b.classList.toggle('show', n>0);
  document.getElementById('doneN').textContent = n || '';
}
/* マルチユーザー版: 回収(図鑑登録)はサーバの /api/claim が行う。
   売上は完成した瞬間にサーバの tick() が積んでいるので、ここでは合計額を見せるだけ。 */
async function openDoneServer(){
  const r=await NET.call('POST','/api/claim'); if(!r) return;
  pendingCount=0; updateDoneBtn();
  const st=await NET.call('GET','/api/state'); if(st){ NET.last=st; applyFactory(st.factory); }
  const d=await NET.call('GET','/api/collection');
  if(d){ const c=craftState(); c.collection=Object.fromEntries(
    Object.entries(d.collection||{}).map(([k,v])=>[k,v.owned]));
    c.collectionMeta=d.collection||{}; }
  updateBadge(); renderBoard();
  const byRar={}; for(const it of r.items) byRar[it.r]=(byRar[it.r]||0)+1;
  const cards=[...r.items].reverse().slice(0,200).map(p=>`<div class="pcard">${p.isNew?'<span class="new">NEW</span>':''}
      <div class="e">${p.e}</div><div class="nm">${p.n}</div>
      <div class="rr" style="color:${RAR[p.r].c}">${RAR[p.r].n}</div></div>`).join('');
  const bd=Object.keys(byRar).sort().map(k=>
    `<span class="chip"><b style="color:${RAR[k].c}">${RAR[k].n}</b>×${byRar[k]} = 💰${(PROD_PRICE[k]*byRar[k]).toLocaleString()}</span>`).join('');
  openDialog({ title:'🎁 完成品', subtitle:`${r.items.length}個`,
    body:`${r.gain?`<div class="invbar" style="font-size:12px">
          <span style="color:#9fb0c0">今回の売上<small style="opacity:.75">（加算済み）</small></span>
          <b style="color:#ffd27a;font-size:19px">💰 ${r.gain.toLocaleString()}</b>${bd}</div>`
        :`<div class="rowline" style="font-size:11px;color:#9fb0c0">新しく完成した製品はありません。</div>`}
      <div class="rowline" style="font-size:11px;color:#9fb0c0">
        ${r.registered?`${r.registered}個を📖図鑑に登録しました。`:''}NEW は初めて作られた製品です。</div>
      <div class="pgrid">${cards||'<div class="cost">まだありません</div>'}</div>`,
    actions:[{label:'📖 図鑑を見る',kind:'ghost',on:()=>openCollection('prod')}] });
}
function openDone(){
  if(NET.multi) return openDoneServer();
  const c=craftState();
  const batch=c.made.slice();                                // 今回見せる分（あとで空にする）
  const had={}; for(const k in c.collection) had[k]=c.collection[k];      // 「初めて」の判定は登録前の図鑑で行う
  const cards=[...batch].reverse().slice(0,200).map(m=>{
    const p=PROD[m.pid]; if(!p) return '';
    // 未登録の製品は該当する全部に NEW を付ける（3個できていれば3個とも）
    const isNew = !had[m.pid];
    const ks=(m.key||'').split(',').map(x=>MAT[x]?MAT[x].e:'').join('');
    return `<div class="pcard">${isNew?'<span class="new">NEW</span>':''}
      <div class="e">${p.e}</div><div class="nm">${p.n}</div>
      <div class="rr" style="color:${RAR[p.r].c}">${RAR[p.r].n}</div>
      <div class="qn">${ks}</div></div>`;
  }).join('');
  // 一覧を表示したタイミングで図鑑に登録する。
  // 💰は完成した瞬間（tickCraft）に入れているので、ここでは合計額を出すだけ
  let reg=0, gain=0, byRar={};
  for(const m of batch){
    const p=PROD[m.pid]; if(!p) continue;
    c.collection[m.pid]=(c.collection[m.pid]||0)+1; reg++;
    const price=PROD_PRICE[p.r]||0; gain+=price;
    byRar[p.r]=(byRar[p.r]||0)+1;
  }
  // 見せたら箱は空にする。次に製品ができるまで🎁ボタンは出ない（常に「新着だけ」を見せる）
  c.made=[];
  saveGame(); updateDoneBtn(); updateBadge(); renderBoard();
  const bd=Object.keys(byRar).sort().map(r=>
    `<span class="chip"><b style="color:${RAR[r].c}">${RAR[r].n}</b>×${byRar[r]} = 💰${(PROD_PRICE[r]*byRar[r]).toLocaleString()}</span>`).join('');
  openDialog({ title:'🎁 完成品', subtitle:`${batch.length}個`,
    body:`${gain?`<div class="invbar" style="font-size:12px">
          <span style="color:#9fb0c0">今回の売上<small style="opacity:.75">（加算済み）</small></span>
          <b style="color:#ffd27a;font-size:19px">💰 ${gain.toLocaleString()}</b>
          ${bd}</div>`
        :`<div class="rowline" style="font-size:11px;color:#9fb0c0">新しく完成した製品はありません。</div>`}
      <div class="rowline" style="font-size:11px;color:#9fb0c0">
        ${reg?`${reg}個を📖図鑑に登録しました。`:''}NEW は初めて作られた製品です。図鑑を埋めていこう。
        今日つくったものは 📊今日の製造 でいつでも見返せる。</div>
      <div class="pgrid">${cards||'<div class="cost">まだありません</div>'}</div>`,
    actions:[{label:'📖 図鑑を見る',kind:'ghost',on:()=>openCollection('prod')}] });
}
document.getElementById('doneBtn').addEventListener('click',openDone);

/* =========================================================================
   リーダーボード — 期間タブ（今日/今週/今月/今年）× 軸ボタン（9種）
   ・1画面に出すのは「選んだ軸の値」だけ。全軸を並べると読めないし、
     暗黙の総合順位に見えてしまう（WP.md §9: 単一の合計点は作らない）
   ・最初は上位20件。「もっとみる」で20件ずつ追加で取得する
   ========================================================================= */
const LB_PERIODS=[['today','今日'],['week','今週'],['month','今月'],['year','今年']];
const LB_PAGE=20;
const LB_MEDAL=['🥇','🥈','🥉'];   // 1〜3位は順位の数字の代わりにメダル
/* 軸の定義。key=APIの項目 / desc=表の上に出す説明 / fmt=セルの表示 */
const LB_AXES=[
  {key:'efficiency',  label:'効率',       col:'効率',
   desc:'少ないトークンでどれだけ成果を出したか。(追加行 + 削除行×0.3 + PR×150) ÷ output_tokens × 1000。PR1件かつ100行以上が対象で、満たさない人は「—」でランク外。難易度は補正しないので絶対量と併せて見ること。',
   fmt:u=>u.efficiency==null?'<span style="color:#9fb0c0">—</span>':`<b style="color:var(--gold)">${u.efficiency}</b>`},
  {key:'prs',         label:'PR数',       col:'PR',
   desc:'期間内に作成したプルリクエストの数。作業がレビュー可能な単位まで届いた回数。',
   fmt:u=>u.prs.toLocaleString()},
  {key:'commits',     label:'コミット数', col:'コミット',
   desc:'期間内のコミット数。小さく刻んで進めているほど増える。',
   fmt:u=>u.commits.toLocaleString()},
  {key:'lines',       label:'変更行数',   col:'変更行',
   desc:'追加行 + 削除行。消した行も労働として数える（行数稼ぎの逆インセンティブを消すため）。',
   fmt:u=>`${u.lines.toLocaleString()}<span style="color:#9fb0c0;font-size:10px"> (+${u.linesAdded.toLocaleString()} / -${u.linesRemoved.toLocaleString()})</span>`},
  {key:'skill',       label:'Skill利用',  col:'Skill',
   desc:'Skill を呼び出した回数。手順を毎回書き下すのではなく、再利用できる形に畳めているか。',
   fmt:u=>u.skill.toLocaleString()},
  {key:'agent',       label:'Agent起動',  col:'Agent',
   desc:'サブエージェントを起動した回数。調査や並行作業を任せられているか。',
   fmt:u=>u.agent.toLocaleString()},
  {key:'customAgent', label:'自作Agent',  col:'自作Agent',
   desc:'自分で定義したエージェントの起動回数。自分の仕事に合わせて道具を作れているか。',
   fmt:u=>u.customAgent.toLocaleString()},
  {key:'delegationPct',label:'委譲率',    col:'委譲率',
   desc:'全ツール実行のうち、サブエージェント側で実行された割合。高いほど本体の文脈を使わずに任せている。',
   fmt:u=>`${u.delegationPct}%`},
  {key:'activeDays',  label:'稼働日数',   col:'稼働日',
   desc:'期間内に Claude Code を使った日数。量ではなく続いているかを見る軸。',
   fmt:u=>`${u.activeDays.toLocaleString()}日`},
];
const lbAxis=(k)=>LB_AXES.find(a=>a.key===k)||LB_AXES[0];
let _lbKey='efficiency';
let _lbPeriod='week';
async function openLb(){
  let rows=null;            // null=読み込み中
  let total=0, loading=false;
  /* 単一ユーザー版(server.mjs)は期間もページングも持たないので、
     全件を1度取ってからクライアント側で同じ規則で並べ替え・切り出しをする */
  let localAll=null;
  const sortLocal=(list)=>[...list].sort((a,b)=>{
    const av=a[_lbKey], bv=b[_lbKey];
    if(av==null&&bv==null) return b.lines-a.lines;
    if(av==null) return 1; if(bv==null) return -1;
    return bv-av || b.lines-a.lines;
  });
  async function load(more){
    loading=true;
    const offset=more?(rows||[]).length:0;
    if(NET.multi){
      const d=await NET.call('GET',
        `/api/leaderboard?period=${_lbPeriod}&metric=${_lbKey}&limit=${LB_PAGE}&offset=${offset}`);
      const page=(d&&d.scorecard)||[];
      rows=more?[...(rows||[]),...page]:page;
      total=(d&&d.total)||rows.length;
    } else {
      if(!localAll){ try{ localAll=(await (await fetch('/api/otel',{cache:'no-store'})).json()).scorecard||[]; }
                     catch(_){ localAll=[]; } }
      const sorted=sortLocal(localAll);
      total=sorted.length;
      rows=sorted.slice(0, offset+LB_PAGE);
    }
    loading=false;
  }
  const dlg=openDialog({ title:'🏆 リーダーボード',
    tabs:LB_PERIODS.map(([k,l])=>({id:k,label:l})), tab:_lbPeriod,
    onTab:async(id,d)=>{ _lbPeriod=id; rows=null; d.refresh(); await load(false); d.refresh(); },
    body:()=>{
    const ax=lbAxis(_lbKey);
    const btns=`<div class="rowline">${LB_AXES.map(a=>
      `<span class="sttab ${a.key===_lbKey?'on':''}" data-lbk="${a.key}" style="border-radius:8px">${a.label}順</span>`).join('')}</div>`;
    const note=`<div class="rowline" style="font-size:11px;color:#9fb0c0;line-height:1.7">
        <b style="color:#9fdcc6">${ax.label}順</b>${ax.desc}</div>`;
    if(!rows) return btns+note+'<div class="cost">読み込み中…</div>';
    /* 工場名の出し方。
       マルチユーザー版: サーバ(DB)の factories.name が factoryName で来る。
       単一ユーザー版  : DBが無いので、活動量が最大の識別子を本人とみなして
                         自分の工場名(G.factoryName)を当て、他は「◯◯の工場」。 */
    const meId = NET.multi ? null
      : ([...(localAll||[])].sort((a,b)=>(b.lines||0)-(a.lines||0))[0]||{}).id;
    const fname = (u)=> u.factoryName
      || (!NET.multi && u.id===meId && G.factoryName)
      || `${String(u.name||u.id||'').split('@')[0]}の工場`;
    const more = rows.length<total
      ? `<div class="rowline" style="justify-content:center">
           <button class="dbtn ghost" id="lbMore">もっとみる（${rows.length} / ${total}）</button></div>` : '';
    return btns+note+`
      <table style="width:100%;border-collapse:collapse;font-size:11px">
        <thead><tr style="color:#9fb0c0">
          <th style="text-align:left;width:34px">#</th><th style="text-align:left">工場</th>
          <th style="text-align:right">${ax.col}</th>
        </tr></thead><tbody>${rows.length?rows.map((u,i)=>`
          <tr style="border-top:1px solid #22322e">
            <td style="text-align:left;color:#9fb0c0" title="${i+1}位">${LB_MEDAL[i]
              ? `<span style="font-size:15px;line-height:1">${LB_MEDAL[i]}</span>` : i+1}</td>
            <td style="text-align:left;color:#eafff4" title="${u.name||u.id||''}">🏭 ${fname(u)}</td>
            <td style="text-align:right">${ax.fmt(u)}</td></tr>`).join('')
          :'<tr><td colspan="3" style="color:#9fb0c0;padding:10px">データがありません（OTelの設定を確認）</td></tr>'}</tbody></table>
      ${more}`;
  },
  onRender:(p,d)=>{
    p.querySelectorAll('[data-lbk]').forEach(el=>el.onclick=async()=>{
      if(el.dataset.lbk===_lbKey) return;
      _lbKey=el.dataset.lbk; rows=null; d.refresh();      // 軸を変えたら1ページ目から取り直す
      await load(false); d.refresh();
    });
    const m=p.querySelector('#lbMore');
    if(m) m.onclick=async()=>{
      if(loading) return;
      m.disabled=true; m.textContent='読み込み中…';
      await load(true); d.refresh();
    };
  } });
  await load(false);
  dlg.refresh();   // 読み込み中に閉じられていれば refresh は何もしない
}
document.getElementById('lbBtn').addEventListener('click',openLb);

/* =========================================================================
   マイページ — 工場名 / 選んだ日・週のWP・製造個数・売上 / WPの推移グラフ
   粒度は日次(00:00-23:59)と週次(日曜00:00-土曜23:59)の2つ。折れ線はWPだけ引き、
   グラフをクリックするとその日・週の3指標に切り替わる（3本重ねると単位が違って読めない）。
   ========================================================================= */
const MY_DAYS=90;                      // 週次12週分を作るのに必要な日数。日次は末尾14日だけ使う
const MY_DAILY_N=14, MY_WEEK_N=12;
const MY_COLOR='#9fdcc6';              // 折れ線はWPの1本だけ
let _myRange='day', _mySel=null, _myData=null, _myEdit=false;
// 既定名はサーバが決める（ユーザー名 → 無ければメールの @ より前 → 「◯◯の工場」）
const myDefaultName=()=> (_myData&&_myData.defaultName)
  || `${(_myData&&_myData.userName)||'あなた'}の工場`;
const myName=()=> (_myData&&_myData.name) || myDefaultName();
// 属性値に入れる用のエスケープ（工場名はユーザー入力なので " < > & を潰す）
const myAttr=(s)=>String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* 目盛りの上限は 1/2/5×10^n に丸める（軸の数字が読みやすい値になる） */
function niceMax(v){
  if(!(v>0)) return 1;
  const e=Math.pow(10,Math.floor(Math.log10(v))), f=v/e;
  return (f<=1?1:f<=2?2:f<=5?5:10)*e;
}
/* 日付ユーティリティ。'YYYY-MM-DD' は UTC 正午ではなく 00:00 として素直に足し引きする */
const myDayMs=(d)=>Date.parse(d+'T00:00:00Z');
const myDayStr=(ms)=>new Date(ms).toISOString().slice(0,10);
const myMd=(d)=>d.slice(5).replace('-','/');                      // 07/19（年は出さない）

/* 表示中の粒度でバケツを作る。日次=1日、週次=日曜00:00〜土曜23:59 */
function myBuckets(){
  const series=(_myData&&_myData.series)||[];
  if(_myRange!=='week'){
    return series.slice(-MY_DAILY_N).map(d=>({
      key:d.day, wp:d.wp, made:d.made, sales:d.sales,
      title:myMd(d.day), x:myMd(d.day) }));
  }
  const by=new Map();
  for(const d of series){
    const t=myDayMs(d.day);
    const start=myDayStr(t-new Date(t).getUTCDay()*86400000);      // 直前の日曜
    let b=by.get(start);
    if(!b) by.set(start,b={key:start,n:0,wp:0,made:0,sales:0});
    b.n++; b.wp+=d.wp; b.made+=d.made; b.sales+=d.sales;
  }
  const list=[...by.values()].sort((a,b)=>a.key<b.key?-1:1);
  // 先頭は取得範囲の途中から始まる欠けた週。合計が過小に出るので落とす
  if(list.length>1&&list[0].n<7) list.shift();
  return list.slice(-MY_WEEK_N).map(b=>({ ...b,
    title:`${myMd(b.key)} - ${myMd(myDayStr(myDayMs(b.key)+6*86400000))}`,
    x:myMd(b.key) }));
}
const mySelIdx=(b)=> b.length ? Math.min(Math.max(_mySel==null?b.length-1:_mySel,0),b.length-1) : -1;

/* WPの折れ線＋塗り。点の縦列（どの高さでも可）をクリックするとその日/週の数値に切り替わる */
function myChartSvg(buckets,sel){
  const W=620,H=210,PL=26,PR=76,PT=16,PB=26;   // PL は左端の日付ラベル、PR は右端の「n WP」が切れない幅
  const n=buckets.length;
  if(!n) return '<div class="cost">まだ記録がありません</div>';
  const max=niceMax(Math.max(...buckets.map(d=>d.wp),0));
  const X=i=> n<2 ? PL : PL+i*(W-PL-PR)/(n-1);
  const Y=v=> PT+(1-v/max)*(H-PT-PB);
  const pts=buckets.map((d,i)=>[X(i),Y(d.wp)]);
  const line=pts.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  const area=`${line} L${pts[pts.length-1][0].toFixed(1)},${Y(0)} L${pts[0][0].toFixed(1)},${Y(0)} Z`;
  // 目盛りは 0 / 中間 / 上限。丸めた結果ラベルが重複したら線だけ引く（0が並ぶのを防ぐ）
  const seen=new Set();
  const grid=[max,max/2,0].map(v=>{      // 上限を先に見て、丸めがぶつかったら中間を落とす
    const t=Math.round(v).toLocaleString(), dup=seen.has(t); seen.add(t);
    return `<line x1="${PL}" x2="${W-PR}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="#22322e" stroke-width="1"/>`
      +(dup?'':`<text x="${W-PR+8}" y="${(Y(v)+4).toFixed(1)}" fill="#9fb0c0" font-size="11">${t}<tspan
              fill="#7d8f9c" font-size="9"> WP</tspan></text>`);
  }).join('');
  // x軸ラベルは端と中間だけ（全点出すと潰れる）。選択中の点は必ず出す
  const every=Math.max(1,Math.ceil(n/5));
  const xlab=buckets.map((d,i)=> (i%every===0||i===n-1||i===sel)
    ? `<text x="${X(i).toFixed(1)}" y="${H-7}" fill="${i===sel?'#eafff4':'#9fb0c0'}" font-size="10"
             text-anchor="middle">${d.x}</text>` : '').join('');
  const cursor=(sel>=0&&sel<n)
    ? `<line x1="${pts[sel][0].toFixed(1)}" x2="${pts[sel][0].toFixed(1)}" y1="${PT}" y2="${H-PB}"
             stroke="#eafff4" stroke-width="1.5" opacity=".8"/>
       <circle cx="${pts[sel][0].toFixed(1)}" cy="${pts[sel][1].toFixed(1)}" r="10"
               fill="${MY_COLOR}" opacity=".22"/>` : '';
  const dots=buckets.map((d,i)=>{
    const on=i===sel;
    return `<circle cx="${pts[i][0].toFixed(1)}" cy="${pts[i][1].toFixed(1)}" r="${on?5.5:3.6}"
              fill="${on?MY_COLOR:'#10171b'}" stroke="${MY_COLOR}" stroke-width="2"/>`;}).join('');
  // 当たり判定は点ではなく縦帯にする。隣の点との中点で区切った列のどの高さを押しても
  // その日/週が選ばれる（半径数pxの点を狙わせると指でもマウスでも押しにくい）
  const hits=buckets.map((d,i)=>{
    const x0=i===0   ? 0 : (pts[i-1][0]+pts[i][0])/2;
    const x1=i===n-1 ? W : (pts[i][0]+pts[i+1][0])/2;
    return `<rect class="myhit" x="${x0.toFixed(1)}" y="0" width="${(x1-x0).toFixed(1)}" height="${H}"
             fill="transparent" data-myi="${i}" role="button" tabindex="0"
             aria-label="${d.title}"><title>${d.title}</title></rect>`;}).join('');
  return `<div class="mychart"><svg viewBox="0 0 ${W} ${H}" role="img"
      aria-label="${_myRange==='week'?`直近${n}週`:`直近${n}日`}のWPの推移">
    <defs><linearGradient id="myg_wp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${MY_COLOR}" stop-opacity=".38"/>
      <stop offset="100%" stop-color="${MY_COLOR}" stop-opacity=".03"/></linearGradient></defs>
    ${grid}
    <path d="${area}" fill="url(#myg_wp)"/>
    <path d="${line}" fill="none" stroke="${MY_COLOR}" stroke-width="2.4"
          stroke-linejoin="round" stroke-linecap="round"/>
    ${cursor}${dots}${xlab}${hits}
  </svg></div>`;
}
function myBody(){
  if(!_myData) return '<div class="cost">読み込み中…</div>';
  const b=myBuckets(), sel=mySelIdx(b), t=b[sel]||{wp:0,made:0,sales:0,title:'—'};
  const head=_myEdit
    // 編集は「いま表示されている名前」から始める。空欄＋プレイスホルダだと
    // 消したのか未設定なのか分からないし、一文字だけ直したいときに打ち直しになる
    ? `<div class="myname"><input id="myNameIn" maxlength="24" placeholder="${myAttr(myDefaultName())}"
         value="${myAttr(myName())}">
       <span class="ed" id="myNameSave">保存</span><span class="ed" id="myNameCancel">やめる</span></div>
       <div class="rowline" style="font-size:11px;color:#9fb0c0;margin-top:4px">24文字まで。空にすると「${myAttr(myDefaultName())}」に戻ります。</div>`
    : `<div class="myname"><b>🏭 ${myAttr(myName())}</b><span class="ed" id="myNameEdit">✏️ 編集</span></div>`;
  return `${head}
    ${_myData.failed?`<div class="rowline" style="font-size:11px;color:#ff9f7a;margin-top:8px">
      集計を取得できませんでした。サーバが古い可能性があります（<b>node server/index.mjs</b> を再起動してください）。</div>`:''}
    <div class="rowline" style="margin-top:14px">
      ${[['day','日次'],['week','週次']].map(([id,label])=>
        `<span class="sttab ${id===_myRange?'on':''}" data-myrange="${id}"
               style="border-radius:8px">${label}</span>`).join('')}
    </div>
    <div class="myperiod">${t.title}</div>
    <div class="mystats">
      <div class="mystat"><div class="k">WP</div><div class="v">${Math.round(t.wp).toLocaleString()}<small>WP</small></div></div>
      <div class="mystat"><div class="k">製造個数</div><div class="v">${t.made.toLocaleString()}<small>個</small></div></div>
      <div class="mystat"><div class="k">売上</div><div class="v">${Math.round(t.sales).toLocaleString()}<small>💰</small></div></div>
    </div>
    <div class="rowline" style="font-size:11px;color:#9fb0c0;margin-top:14px">
      ※グラフをクリックで切り替え
    </div>
    ${myChartSvg(b,sel)}`;
}
/* 単一ユーザー版(server.mjs)向け。WPは /api/otel、製造と売上はローカルの記録から作る */
async function myLocalData(days){
  const c=craftState();
  let wpDaily={}, who='';
  try{
    const j=await (await fetch('/api/otel',{cache:'no-store'})).json();
    wpDaily=j.wpDaily||{};
    /* 単一ユーザー版はログインが無いので名前が引けない。テレメトリに出てくる識別子のうち
       もっとも活動量が多いものを本人とみなす（複数人で使うならマルチユーザー版を使う） */
    const top=(j.scorecard||[]).slice().sort((a,b)=>(b.lines||0)-(a.lines||0))[0];
    who=String((top&&(top.name||top.email||top.id))||'').split('@')[0];
  }catch(_){}
  const made={};
  for(const m of (c.log||[])){ const d=jstDay(m.at); made[d]=(made[d]||0)+1; }
  const series=[];
  for(let i=days-1;i>=0;i--){ const day=jstDay(Date.now()-i*86400000);
    series.push({day, wp:Math.round(wpDaily[day]||0), made:made[day]||0, sales:Math.round(c.sales[day]||0)}); }
  return { name:G.factoryName||'', userName:who||'あなた', defaultName:`${who||'あなた'}の工場`,
           days, series };
}
async function saveFactoryName(name,dlg){
  name=String(name||'').replace(/\s+/g,' ').trim().slice(0,24);
  if(NET.multi){
    const r=await NET.call('PUT','/api/factory/name',{name});
    if(!r) return;                       // 失敗時は編集状態のまま（NET.call が toast を出す）
    name=r.name;
  } else { G.factoryName=name; saveGame(); }
  G.factoryName=name; _myData.name=name; _myEdit=false; dlg.refresh();
  toast('工場名を変更しました');
}
async function openMyPage(){
  _myEdit=false; _myData=null; _mySel=null; _myRange='day';
  const dlg=openDialog({ title:'🏠 マイページ', body:myBody,
    onRender:(p,d)=>{
      p.querySelectorAll('[data-myrange]').forEach(el=>el.onclick=()=>{
        _myRange=el.dataset.myrange; _mySel=null; d.refresh();   // 粒度を変えたら最新の点に戻す
      });
      p.querySelectorAll('[data-myi]').forEach(el=>{
        const pick=()=>{ _mySel=+el.dataset.myi; d.refresh(); };
        el.onclick=pick;
        el.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); pick(); } };
      });
      const ed=p.querySelector('#myNameEdit'); if(ed) ed.onclick=()=>{ _myEdit=true; d.refresh(); };
      const cancel=p.querySelector('#myNameCancel'); if(cancel) cancel.onclick=()=>{ _myEdit=false; d.refresh(); };
      const save=p.querySelector('#myNameSave'), inp=p.querySelector('#myNameIn');
      if(save&&inp){ save.onclick=()=>saveFactoryName(inp.value,d);
        inp.onkeydown=e=>{ if(e.key==='Enter') saveFactoryName(inp.value,d);
                           if(e.key==='Escape'){ _myEdit=false; d.refresh(); } };
        // 差分適用で入力欄は生き残るので、初回だけ選択する（再描画のたびに全選択し直さない）
        if(document.activeElement!==inp){ inp.focus(); inp.select(); } }
    } });
  _myData = NET.multi ? await NET.call('GET',`/api/mypage?days=${MY_DAYS}`) : await myLocalData(MY_DAYS);
  // 取得に失敗したときは 0 を並べて黙らない。名前だけはポーリングの me から作れる
  if(!_myData){
    const me=(NET.last&&NET.last.me)||{};
    const who=String(me.name||'').trim()||String(me.email||'').split('@')[0]||'あなた';
    _myData={ name:G.factoryName||'', userName:who, defaultName:`${who}の工場`,
      days:MY_DAYS, series:[], failed:true };
  }
  dlg.refresh();   // 読み込み中に閉じられていれば refresh は何もしない
}
document.getElementById('myBtn').addEventListener('click',openMyPage);
