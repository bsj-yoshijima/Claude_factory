<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🏭 Claude Factory (Phaser)</title>
<style>
  :root{ --ink:#e6fff4; --gold:#ffd27a; --mint:#9fdcc6; --panel:rgba(16,24,26,.82); --edge:#2c4740; }
  html,body{height:100%;margin:0;background:radial-gradient(120% 120% at 50% 30%,#1b232b 0%,#0c1014 70%);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--ink);overflow:hidden}
  #wrap{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
  #game{width:min(1300px,96vw);aspect-ratio:1024/572}
  #game canvas{image-rendering:pixelated;border-radius:8px;box-shadow:0 24px 80px rgba(0,0,0,.6)}
  #topbar{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:6;font-size:12px}
  .tab{background:var(--panel);color:var(--mint);border:1px solid var(--edge);border-radius:8px;padding:5px 12px;cursor:pointer;backdrop-filter:blur(3px)}
  .tab:hover{border-color:var(--mint)} .tab.gacha{color:var(--gold)}
  #badge{position:absolute;top:10px;right:12px;font-size:12px;color:var(--ink);background:var(--panel);padding:6px 12px;border-radius:8px;z-index:6}
  #badge b{color:#7fe6ff}
  #hud{position:absolute;left:12px;bottom:12px;font-size:12px;color:var(--ink);background:var(--panel);padding:5px 10px;border-radius:6px;z-index:6}
  #hud b{color:var(--gold)}
  #note{position:absolute;top:10px;left:12px;font-size:10px;color:#9fdcc6;background:var(--panel);padding:4px 9px;border-radius:6px;z-index:6}
  /* overlay */
  #overlay{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(6,10,12,.72);backdrop-filter:blur(4px)}
  #overlay.show{display:flex}
  #panel{position:relative;background:#12181c;border:1px solid var(--edge);border-radius:12px;padding:18px 20px;max-width:min(700px,92vw);max-height:88vh;overflow:auto}
  #panel h2{margin:0 0 8px;font-size:16px;color:var(--gold)}
  #panel .close{position:absolute;top:8px;right:14px;font-size:20px;color:#9fb0c0;cursor:pointer}
  .rowline{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0;font-size:12px}
  .btn{background:var(--gold);color:#243b34;font-weight:700;border:none;border-radius:8px;padding:9px 16px;cursor:pointer;font-family:inherit;font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,66px);gap:8px;margin-top:6px}
  .cell{width:66px;height:80px;border-radius:8px;border:2px solid #333;background:#0e1417;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:28px;position:relative;cursor:pointer}
  .cell small{font-size:8px;margin-top:1px} .cell .cnt{position:absolute;bottom:2px;right:5px;font-size:9px;color:#fff}
  .cell.own:hover{box-shadow:0 0 0 2px var(--gold) inset}
  .cardwrap{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:100px;align-items:center;margin:6px 0}
  .card{width:72px;height:94px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:32px;border:2px solid #fff;animation:pop .45s ease both}
  .card small{font-size:9px;font-weight:700;margin-top:2px}
  @keyframes pop{0%{transform:scale(.2) rotate(-8deg);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1)}}
  #toast{position:absolute;bottom:70px;left:50%;transform:translateX(-50%);background:var(--panel);color:var(--ink);padding:8px 16px;border-radius:8px;z-index:7;display:none;font-size:12px}
  /* craft */
  .invbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;background:#0e1417;border:1px solid var(--edge);border-radius:8px;padding:7px 9px;margin:6px 0;font-size:12px}
  .chip{display:inline-flex;align-items:center;gap:3px;background:#1a2228;border-radius:6px;padding:2px 7px}
  .chip b{color:#eafff4}
  .sttabs{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0 4px}
  .sttab{background:#141b20;border:1px solid var(--edge);border-radius:8px 8px 0 0;padding:5px 11px;cursor:pointer;font-size:12px;color:#9fdcc6}
  .sttab.on{background:#1d262c;border-color:var(--gold);color:var(--gold)}
  .rc{display:flex;align-items:center;gap:10px;background:#10171b;border:1px solid #243036;border-radius:9px;padding:8px 11px;margin:6px 0}
  .rc .ic{font-size:26px;width:34px;text-align:center}
  .rc .mid{flex:1;min-width:0}
  .rc .nm{font-size:13px;color:#eafff4;font-weight:700}
  .rc .cost{font-size:11px;color:#9fb0c0;margin-top:2px}
  .rc .cost .lack{color:#e0674e}
  .rc button{background:var(--gold);color:#243b34;font-weight:700;border:none;border-radius:7px;padding:8px 13px;cursor:pointer;font-family:inherit;font-size:12px}
  .rc button:disabled{background:#33403c;color:#7f8f89;cursor:not-allowed}
  .locked{opacity:.5}
  /* tech map */
  .map{display:flex;flex-direction:column;gap:2px}
  .tier{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:7px 0}
  .tlab{font-size:10px;color:#9fb0c0;width:74px;flex:none}
  .node{display:inline-flex;flex-direction:column;align-items:center;background:#131b20;border:1px solid var(--edge);border-radius:8px;padding:6px 9px;min-width:60px}
  .node.mach{border-color:#c98b52} .node.mat{border-color:#4a6b7a} .node .e{font-size:22px} .node small{font-size:9px;color:#cfeee0;margin-top:1px}
  .arrow{color:#5f7a72;font-size:16px}
</style>
</head>
<body>
<div id="wrap">
  <div id="game"></div>
  <div id="note">🏭 Claude Factory</div>
  <div id="topbar">
    <div class="tab gacha" id="gachaBtn">🎁 ガチャ</div>
    <div class="tab" id="shopBtn">🏪 ショップ</div>
    <div class="tab" id="editBtn">🔧 編集</div>
    <div class="tab" id="dexBtn">📖 図鑑</div>
  </div>
  <div id="badge"><span id="prodN">⚙️ 0</span><span id="rateN" style="color:#7fe6ff;font-size:10px;margin-left:4px"></span> ・ <span id="moneyN" style="color:#ffd27a">💰 0</span></div>
  <div id="hud"></div>
  <div id="toast"></div>
  <div id="overlay"><div id="panel"></div></div>
</div>
<script src="vendor/phaser.min.js"></script>
<script src="game/main.js"></script>
<script>
'use strict';
/* ===== ガチャ / コレクション(現行版と共通ロジック・実トークン連動) ===== */
const RAR={1:{n:'N',c:'#9fb0c0',w:58},2:{n:'R',c:'#5fa8e0',w:27},3:{n:'SR',c:'#b57be0',w:11},4:{n:'SSR',c:'#f6c04a',w:3.2},5:{n:'UR',c:'#ff5d6c',w:0.8}};
const PRIZES=[
  {id:'p_bolt',e:'🔩',n:'謎のボルト',r:1},{id:'p_clip',e:'📎',n:'クリップ',r:1},{id:'p_cone',e:'🚧',n:'コーン',r:1},{id:'p_seed',e:'🌱',n:'観葉の芽',r:1},
  {id:'p_guitar',e:'🎸',n:'ギター',r:2},{id:'p_lamp',e:'💡',n:'ランプ',r:2},{id:'p_bronze',e:'🥉',n:'銅トロフィー',r:2},
  {id:'p_robot',e:'🤖',n:'ロボ人形',r:3},{id:'p_arcade',e:'🕹️',n:'アーケード',r:3},{id:'p_gold',e:'🥇',n:'金メダル',r:3},
  {id:'p_crystal',e:'💎',n:'クリスタル',r:4},{id:'p_rocket',e:'🚀',n:'ロケット',r:4},
  {id:'p_crown',e:'👑',n:'王冠',r:5},{id:'p_dragon',e:'🐉',n:'ドラゴン像',r:5},
];
// ===== 価格・レート（すべて調整可） =====
const PULL_COST=30;                                  // ガチャ1回 = 製造量(⚙️生産P)
const SELL={1:60,2:180,3:600,4:2400,5:9000};         // 景品売却額(レア度別)
const MACH={ red:{e:'🟥',n:'抽出機',price:0}, green:{e:'🟩',n:'成形機',price:2200},
             blue:{e:'🟦',n:'演算機',price:6500}, yellow:{e:'🟨',n:'選別機',price:15000} };
const lvCost=(lvl)=> Math.round(120*lvl*lvl);        // レベルアップ費用
const BELT_PRICE=450;
const DECO={ crate:{e:'📦',n:'木箱',price:150}, drum:{e:'🛢️',n:'ドラム缶',price:200}, plant:{e:'🪴',n:'観葉植物',price:180}, pallet:{e:'🧱',n:'パレット',price:160}, sign:{e:'🚧',n:'標識',price:220} };
const BG={ auto:{n:'標準（時刻連動）',price:0}, blue:{n:'快晴',price:1800}, sunset:{n:'夕焼け',price:2200}, night:{n:'星空',price:2600}, space:{n:'宇宙',price:4200}, aurora:{n:'オーロラ',price:5200} };
const FLOOR={ wood:{n:'木材（標準）',price:0}, cool:{n:'クールグレー',price:1000}, crimson:{n:'レッドタイル',price:1200}, forest:{n:'フォレスト',price:1200}, gold:{n:'ゴールド',price:3200} };
// テーマシリーズ: 空テーマ(sky)＋床材(floor)＋絵文字装飾セット(decos) をまとめて購入/適用
const SERIES={
  arabia:{n:'🕌 アラビア', price:6000, sky:'arabia',   floor:'sand',    decos:['🪔','🏺','🌴','🐫','🕌']},
  undersea:{n:'🐚 海底',   price:6000, sky:'undersea', floor:'aqua',    decos:['🪸','🐚','🐠','🦀','🐙']},
  japan:{n:'⛩️ 日本',      price:6000, sky:'japan',    floor:'tatami',  decos:['🏮','⛩️','🎍','🎐','🍡']},
  china:{n:'🐉 中華',      price:6000, sky:'china',    floor:'redgold', decos:['🏮','🐉','🧧','🀄','🐼']},
};

let G={ pity:0, inv:{}, prodP:90, money:0, machines:[{type:'red',lvl:1}], belts:0, decos:{},
        bg:'auto', floor:'wood', bgOwned:['auto'], floorOwned:['wood'], skins:{}, seriesOwned:[], emojiDecos:[], layout:[], lastT:null, produced:0 };
let saveT=null;
function saveGame(){ if(saveT)clearTimeout(saveT); saveT=setTimeout(()=>{ const b=JSON.stringify(G);
  try{fetch('/api/save',{method:'POST',body:b});}catch(_){} try{localStorage.setItem('cf-save',b);}catch(_){}} ,400); }
async function loadGame(){ let s=null; try{ s=await (await fetch('/api/save',{cache:'no-store'})).json(); }catch(_){}
  if(!s||typeof s!=='object'){ try{ s=JSON.parse(localStorage.getItem('cf-save')); }catch(_){} }
  if(s&&typeof s==='object') G=Object.assign(G,s);     // 旧セーブの景品(inv)・pityは引き継ぎ、経済フィールドを補完
  if(!G.inv)G.inv={}; if(!Array.isArray(G.machines)||!G.machines.length)G.machines=[{type:'red',lvl:1}]; if(!G.decos)G.decos={};
  if(!Array.isArray(G.bgOwned))G.bgOwned=['auto']; if(!Array.isArray(G.floorOwned))G.floorOwned=['wood']; if(!G.bg)G.bg='auto'; if(!G.floor)G.floor='wood';
  if(!G.skins||typeof G.skins!=='object')G.skins={}; if(!Array.isArray(G.seriesOwned))G.seriesOwned=[]; if(!Array.isArray(G.emojiDecos))G.emojiDecos=[]; if(!Array.isArray(G.layout))G.layout=[];
  ['prodP','money','belts','produced'].forEach(k=>{ if(typeof G[k]!=='number')G[k]=0; }); }
// 配置レイアウト(位置)の唯一の真実 = G.layout。シーンから同期。
function snapLayout(){ if(window.__scene) G.layout=window.__scene.getLayout(); }
window.__layoutChanged=()=>{ snapLayout(); saveGame(); };
const cnt=(kind,sub)=> (G.layout||[]).filter(e=>e.kind===kind&&(sub==null||e.sub===sub)).length;
// エージェント頭アクセ(スキン)の永続化: main.js からクリック巡回時に呼ばれる
window.__skinChanged=(proj,skinId)=>{ if(!proj)return; if(skinId==='none') delete G.skins[proj]; else G.skins[proj]=skinId; saveGame(); };
// 生産レート(⚙️/秒) = Σ(機械レベル) × (1 + 0.25×稼働エージェント)。レイアウト確定後はG.layoutを、未確定時はG.machinesを参照
function prodRate(){ let b=0; const L=(G.layout&&G.layout.length)?G.layout.filter(e=>e.kind==='machine'):null;
  if(L){ for(const e of L) b+=(e.lvl||1); } else { for(const m of G.machines) b+=m.lvl; }
  const busy=(window.__scene&&window.__scene.busyCount)||0; return b*(1+0.25*busy); }
function rollRarity(){ if(G.pity>=9){ const x=Math.random(); return x<0.78?3:(x<0.95?4:5); }
  let x=Math.random()*100,acc=0; for(const k of [1,2,3,4,5]){ acc+=RAR[k].w; if(x<acc)return k; } return 1; }
function pullOne(){ const rr=rollRarity(); G.pity=rr>=3?0:G.pity+1; const pool=PRIZES.filter(p=>p.r===rr);
  const pz=pool[Math.floor(Math.random()*pool.length)]; G.inv[pz.id]=(G.inv[pz.id]||0)+1; return pz; }
function doPull(n){ const cost=n*PULL_COST; if(G.prodP<cost) return null; G.prodP-=cost; const got=[]; for(let i=0;i<n;i++) got.push(pullOne()); saveGame(); return got; }

const overlay=document.getElementById('overlay'), panel=document.getElementById('panel');
function closeOverlay(){ overlay.classList.remove('show'); }
function openOverlay(h){ panel._refresh=null; panel.innerHTML='<span class="close">✕</span>'+h; panel.querySelector('.close').onclick=closeOverlay; overlay.classList.add('show'); }
overlay.addEventListener('click',e=>{ if(e.target===overlay) closeOverlay(); });
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; clearTimeout(t._t); t._t=setTimeout(()=>t.style.display='none',1600); }
function updateBadge(){ const p=document.getElementById('prodN'); if(p)p.textContent='⚙️ '+Math.floor(G.prodP).toLocaleString();
  const r=document.getElementById('rateN'); if(r)r.textContent='+'+prodRate().toFixed(1)+'/s';
  const m=document.getElementById('moneyN'); if(m)m.textContent='💰 '+Math.floor(G.money).toLocaleString(); }

function openGacha(){
  openOverlay(`<h2>🎁 ガチャ <span style="font-size:12px;color:#7fe6ff">⚙️ ${Math.floor(G.prodP).toLocaleString()}</span></h2>
    <div class="rowline"><span style="color:#9fb0c0">製造量(⚙️)を溜めてガチャ→景品を🏪ショップで💰売却→強化・購入の育成ループ</span></div>
    <div class="rowline"><button class="btn" id="p1">1回 (⚙️${PULL_COST})</button><button class="btn" id="p10">10連 (⚙️${PULL_COST*10})</button>
      <span style="color:#9fb0c0">生産 +${prodRate().toFixed(1)}/s ・ 天井 あと${Math.max(0,10-G.pity)}回でSR以上</span></div>
    <div class="cardwrap" id="rv"><span style="color:#9fb0c0">回してみよう！</span></div>
    <div class="rowline" style="font-size:10px;color:#9fb0c0">排出率 ${[2,3,4,5].map(k=>RAR[k].n+' '+RAR[k].w+'%').join(' / ')}</div>`);
  const rv=panel.querySelector('#rv');
  const run=n=>{ const got=doPull(n); if(!got){ rv.innerHTML='<span style="color:#e05a4e">⚙️製造量が足りません（機械を強化して生産を上げよう）</span>'; return; }
    rv.innerHTML=''; got.sort((a,b)=>b.r-a.r).forEach((p,i)=>{ const col=RAR[p.r].c,el=document.createElement('div');
      el.className='card'; el.style.borderColor=col; el.style.boxShadow=`0 0 14px ${col}`; el.style.background=`linear-gradient(160deg,#0e1417,${col}44)`;
      el.style.animationDelay=(i*0.05)+'s'; el.innerHTML=`${p.e}<small style="color:${col}">${RAR[p.r].n}</small><small style="color:#cfeee0">${p.n}</small>`; rv.appendChild(el); });
    const h=panel.querySelector('h2 span'); if(h)h.textContent='⚙️ '+Math.floor(G.prodP).toLocaleString(); updateBadge(); };
  panel.querySelector('#p1').onclick=()=>run(1); panel.querySelector('#p10').onclick=()=>run(10);
}
function openDex(){
  const owned=PRIZES.filter(p=>G.inv[p.id]).length;
  const cells=PRIZES.map(p=>{ const have=G.inv[p.id]||0,col=RAR[p.r].c;
    return have? `<div class="cell own" data-id="${p.id}" style="border-color:${col}" title="クリックで部屋に飾る">${p.e}<small style="color:${col}">${RAR[p.r].n}</small><span class="cnt">×${have}</span></div>`
               : `<div class="cell" style="opacity:.45">❓<small style="color:#9fb0c0">${RAR[p.r].n}</small></div>`; }).join('');
  openOverlay(`<h2>📖 コレクション図鑑 <span style="font-size:12px;color:#9fb0c0">${owned}/${PRIZES.length}</span></h2>
    <div class="grid">${cells}</div><div class="rowline" style="font-size:11px;color:#9fb0c0">所持アイテムをクリックで部屋に飾る</div>`);
  panel.querySelectorAll('.cell.own').forEach(el=>el.onclick=()=>{
    const p=PRIZES.find(x=>x.id===el.dataset.id);
    if(window.__scene&&window.__scene.placePrize){ window.__scene.placePrize(p.e, RAR[p.r].c); snapLayout(); saveGame(); toast(`${p.e} ${p.n} を部屋に飾った！`); closeOverlay(); }
  });
}
document.getElementById('gachaBtn').addEventListener('click',openGacha);
document.getElementById('dexBtn').addEventListener('click',openDex);

/* ===== ショップ（景品の売却＋購入/強化） ===== */
function sellPrize(id,qty){ const p=PRIZES.find(x=>x.id===id); const have=G.inv[id]||0; qty=Math.min(qty,have); if(qty<=0)return;
  G.inv[id]=have-qty; const gain=SELL[p.r]*qty; G.money+=gain; saveGame(); updateBadge(); toast(`${p.e} ${p.n}×${qty} を売却 (+💰${gain})`); }
function buyMachine(type){ const pr=MACH[type].price; if(G.money<pr)return; G.money-=pr;
  if(window.__scene)window.__scene.placeMachine(type); snapLayout(); saveGame(); updateBadge(); toast(`${MACH[type].e} ${MACH[type].n} を購入・設置！`); }
function levelUp(id){ const e=(G.layout||[]).find(x=>x.id===id&&x.kind==='machine'); if(!e)return; const c=lvCost(e.lvl); if(G.money<c)return; G.money-=c; e.lvl++;
  if(window.__scene)window.__scene.setMachineLevel(id,e.lvl); snapLayout(); saveGame(); updateBadge(); toast(`${MACH[e.sub].e} ${MACH[e.sub].n} を Lv${e.lvl} に強化！(生産↑)`); }
function buyBelt(){ if(G.money<BELT_PRICE)return; G.money-=BELT_PRICE; if(window.__scene)window.__scene.placeBelt(); snapLayout(); saveGame(); updateBadge(); toast('🛗 コンベアを購入・設置！'); }
function buyDeco(t){ const pr=DECO[t].price; if(G.money<pr)return; G.money-=pr; if(window.__scene)window.__scene.placeDeco(t); snapLayout(); saveGame(); updateBadge(); toast(`${DECO[t].e} ${DECO[t].n} を購入・設置！`); }
function selectBg(k){ if(!G.bgOwned.includes(k)){ const pr=BG[k].price; if(G.money<pr)return; G.money-=pr; G.bgOwned.push(k); toast(`背景「${BG[k].n}」を購入！`); } G.bg=k; if(window.__scene&&window.__scene.setSkyTheme)window.__scene.setSkyTheme(k); saveGame(); updateBadge(); }
function selectFloor(k){ if(!G.floorOwned.includes(k)){ const pr=FLOOR[k].price; if(G.money<pr)return; G.money-=pr; G.floorOwned.push(k); toast(`床材「${FLOOR[k].n}」を購入！`); } G.floor=k; if(window.__scene&&window.__scene.setFloor)window.__scene.setFloor(k); saveGame(); updateBadge(); }
function buySeries(k){ const S=SERIES[k]; if(!G.seriesOwned.includes(k)){ if(G.money<S.price)return; G.money-=S.price; G.seriesOwned.push(k);
    if(window.__scene) for(const e of S.decos) window.__scene.placeEmojiDeco(e); snapLayout(); toast(`${S.n} シリーズを購入！内装と装飾を反映`); }
  G.bg=S.sky; G.floor=S.floor; if(window.__scene){ window.__scene.setSkyTheme(S.sky); window.__scene.setFloor(S.floor); } saveGame(); updateBadge(); }

let _shopTab='sell';
function openShop(tab){ if(tab)_shopTab=tab;
  const TABS=[['sell','💵 売却'],['mach','🏭 製造機'],['equip','🧰 設備'],['decor','🎨 内装'],['series','🌏 シリーズ']];
  const render=()=>{
    let body='';
    if(_shopTab==='sell'){
      const owned=PRIZES.filter(p=>G.inv[p.id]>0);
      body = owned.length ? owned.map(p=>{ const have=G.inv[p.id],col=RAR[p.r].c;
        return `<div class="rc"><div class="ic">${p.e}</div><div class="mid"><div class="nm">${p.n} <span style="color:${col};font-size:10px">${RAR[p.r].n}</span> ×${have}</div>
          <div class="cost">売却額 💰${SELL[p.r]} /個</div></div>
          <button data-sell="${p.id}" data-q="1">1個</button><button data-sell="${p.id}" data-q="all" style="margin-left:5px">全部</button></div>`;
      }).join('') : '<div class="cost" style="padding:12px">売れる景品がありません。🎁ガチャで景品を集めよう。</div>';
    } else if(_shopTab==='mach'){
      body = '<div class="cost" style="margin:2px 0 6px">所持している製造機（Lv↑で生産量が増える）</div>';
      const machs=(G.layout||[]).filter(e=>e.kind==='machine');
      body += machs.map(e=>{ const c=lvCost(e.lvl); return `<div class="rc"><div class="ic">${MACH[e.sub].e}</div>
        <div class="mid"><div class="nm">${MACH[e.sub].n} <span style="color:#7fe6ff;font-size:11px">Lv${e.lvl}</span></div>
        <div class="cost">生産 +${e.lvl}/s ・ 次のLv 💰${c.toLocaleString()}</div></div>
        <button data-lv="${e.id}" ${G.money>=c?'':'disabled'}>強化</button></div>`; }).join('');
      body += '<div class="cost" style="margin:12px 0 6px">新しい製造機を購入（設置＋生産増＋作業エージェントの行き先が増える）</div>';
      body += Object.keys(MACH).map(t=>`<div class="rc"><div class="ic">${MACH[t].e}</div>
        <div class="mid"><div class="nm">${MACH[t].n}</div><div class="cost">💰${MACH[t].price.toLocaleString()}</div></div>
        <button data-buymach="${t}" ${G.money>=MACH[t].price?'':'disabled'}>購入</button></div>`).join('');
    } else if(_shopTab==='equip'){
      body = `<div class="rc"><div class="ic">🛗</div><div class="mid"><div class="nm">コンベア <span style="color:#9fb0c0;font-size:10px">所持 ${cnt('belt')}</span></div><div class="cost">💰${BELT_PRICE}</div></div>
        <button data-belt="1" ${G.money>=BELT_PRICE?'':'disabled'}>購入</button></div>`;
      body += '<div class="cost" style="margin:12px 0 6px">装飾品</div>';
      body += Object.keys(DECO).map(t=>`<div class="rc"><div class="ic">${DECO[t].e}</div>
        <div class="mid"><div class="nm">${DECO[t].n} <span style="color:#9fb0c0;font-size:10px">所持 ${cnt('deco',t)}</span></div><div class="cost">💰${DECO[t].price}</div></div>
        <button data-deco="${t}" ${G.money>=DECO[t].price?'':'disabled'}>購入</button></div>`).join('');
    } else if(_shopTab==='decor'){   // 内装（背景=窓の外の景色 / 床材）
      const bgRow=Object.keys(BG).map(k=>{ const own=G.bgOwned.includes(k),cur=G.bg===k;
        return `<div class="rc"><div class="ic">${cur?'✅':'🌇'}</div><div class="mid"><div class="nm">背景: ${BG[k].n}</div>
          <div class="cost">${own?(cur?'使用中':'所持'):'💰'+BG[k].price.toLocaleString()}</div></div>
          <button data-bg="${k}" ${(own||G.money>=BG[k].price)&&!cur?'':'disabled'}>${own?(cur?'---':'適用'):'購入'}</button></div>`; }).join('');
      const flRow=Object.keys(FLOOR).map(k=>{ const own=G.floorOwned.includes(k),cur=G.floor===k;
        return `<div class="rc"><div class="ic">${cur?'✅':'🔲'}</div><div class="mid"><div class="nm">床材: ${FLOOR[k].n}</div>
          <div class="cost">${own?(cur?'使用中':'所持'):'💰'+FLOOR[k].price.toLocaleString()}</div></div>
          <button data-fl="${k}" ${(own||G.money>=FLOOR[k].price)&&!cur?'':'disabled'}>${own?(cur?'---':'適用'):'購入'}</button></div>`; }).join('');
      body = '<div class="cost" style="margin:2px 0 6px">背景（窓の外の景色）</div>'+bgRow+'<div class="cost" style="margin:12px 0 6px">床材</div>'+flRow;
    } else {   // シリーズ（背景＋床＋絵文字装飾のセット）
      body = '<div class="cost" style="margin:2px 0 8px">背景・床材・装飾をまとめて着せ替え（購入後は無料で再適用）</div>';
      body += Object.keys(SERIES).map(k=>{ const S=SERIES[k],own=G.seriesOwned.includes(k),cur=(G.bg===S.sky&&G.floor===S.floor);
        return `<div class="rc"><div class="ic">${S.n.split(' ')[0]}</div><div class="mid"><div class="nm">${S.n.split(' ')[1]}シリーズ ${cur?'<span style="color:#7fe6ff;font-size:10px">適用中</span>':''}</div>
          <div class="cost">${S.decos.join(' ')} ・ ${own?'所持':'💰'+S.price.toLocaleString()}</div></div>
          <button data-series="${k}" ${((own||G.money>=S.price)&&!cur)?'':'disabled'}>${own?(cur?'---':'適用'):'購入'}</button></div>`; }).join('');
    }
    openOverlay(`<h2>🏪 ショップ <span style="font-size:12px;color:#ffd27a">💰 ${Math.floor(G.money).toLocaleString()}</span></h2>
      <div class="sttabs">${TABS.map(t=>`<span class="sttab ${t[0]===_shopTab?'on':''}" data-tab="${t[0]}">${t[1]}</span>`).join('')}</div>
      <div>${body}</div>`);
    panel.querySelectorAll('.sttab[data-tab]').forEach(el=>el.onclick=()=>{ _shopTab=el.dataset.tab; render(); });
    panel.querySelectorAll('[data-sell]').forEach(b=>b.onclick=()=>{ const q=b.dataset.q==='all'?(G.inv[b.dataset.sell]||0):1; sellPrize(b.dataset.sell,q); render(); });
    panel.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{ levelUp(b.dataset.lv); render(); });
    panel.querySelectorAll('[data-buymach]').forEach(b=>b.onclick=()=>{ buyMachine(b.dataset.buymach); render(); });
    panel.querySelectorAll('[data-belt]').forEach(b=>b.onclick=()=>{ buyBelt(); render(); });
    panel.querySelectorAll('[data-deco]').forEach(b=>b.onclick=()=>{ buyDeco(b.dataset.deco); render(); });
    panel.querySelectorAll('[data-bg]').forEach(b=>b.onclick=()=>{ selectBg(b.dataset.bg); render(); });
    panel.querySelectorAll('[data-fl]').forEach(b=>b.onclick=()=>{ selectFloor(b.dataset.fl); render(); });
    panel.querySelectorAll('[data-series]').forEach(b=>b.onclick=()=>{ buySeries(b.dataset.series); render(); });
  };
  render();
}
document.getElementById('shopBtn').addEventListener('click',()=>openShop());

/* ===== 起動: ロード→オフライン生産→シーン待ち→所持品反映→生産tick ===== */
function waitScene(){ return new Promise(res=>{ (function chk(){ if(window.__scene) res(); else setTimeout(chk,60); })(); }); }
function applyOwned(){ const s=window.__scene; if(!s)return;
  if(G.layout&&G.layout.length){ s.buildLayout(G.layout); }        // 保存済みレイアウト(位置)を復元
  else {                                                            // 初回: 所持品を配置→レイアウト確定
    s.syncMachines(G.machines);
    for(let i=0;i<G.belts;i++) s.placeBelt();
    for(const t in G.decos) for(let i=0;i<(G.decos[t]||0);i++) s.placeDeco(t);
    for(const e of (G.emojiDecos||[])) s.placeEmojiDeco(e);
    snapLayout(); saveGame();
  }
  s.setSkyTheme(G.bg); s.setFloor(G.floor); s.applySkins(G.skins); }
document.getElementById('editBtn').addEventListener('click',()=>{ if(!window.__scene)return;
  const on=window.__scene.toggleEdit(); document.getElementById('editBtn').classList.toggle('gacha',on);
  toast(on?'🔧 編集: ドラッグで移動 / 左下🗑へドロップで撤去':'編集モードを終了'); });
loadGame().then(async ()=>{
  if(G.lastT){ const dt=Math.min((Date.now()-G.lastT)/1000, 8*3600); const g=prodRate()*dt*0.5; if(g>0){ G.prodP+=g; G.produced+=g; } } // オフライン分(50%/最大8h)
  G.lastT=Date.now(); updateBadge();
  await waitScene(); applyOwned(); updateBadge();
  setInterval(()=>{ const r=prodRate(); G.prodP+=r; G.produced+=r; updateBadge(); }, 1000);
  setInterval(()=>{ G.lastT=Date.now(); saveGame(); }, 15000);
  const q=new URLSearchParams(location.search);
  if(q.get('shop'))openShop(q.get('shop')==='1'?undefined:q.get('shop')); else if(q.get('gacha'))openGacha();
});
</script>
