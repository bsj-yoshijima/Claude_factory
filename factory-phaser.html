<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🏭 Claude Factory (Phaser)</title>
<style>
  :root{ --ink:#e6fff4; --gold:#ffd27a; --mint:#9fdcc6; --panel:rgba(16,24,26,.82); --edge:#2c4740; }
  html,body{height:100%;margin:0;background:radial-gradient(120% 120% at 50% 30%,#1b232b 0%,#0c1014 70%);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--ink);overflow:hidden}
  #wrap{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
  #game{width:min(1300px,96vw);aspect-ratio:1024/572}
  #game canvas{image-rendering:pixelated;border-radius:8px;box-shadow:0 24px 80px rgba(0,0,0,.6)}
  .tab{background:var(--panel);color:var(--mint);border:1px solid var(--edge);border-radius:8px;padding:5px 12px;cursor:pointer;backdrop-filter:blur(3px)}
  .tab:hover{border-color:var(--mint)}
  /* ===== ハンバーガーメニュー（主要機能以外はここに畳む） ===== */
  #menuBtn{position:absolute;top:10px;right:12px;z-index:11;cursor:pointer;font-size:16px;line-height:1;
           background:var(--panel);border:1px solid var(--edge);border-radius:8px;padding:7px 11px;color:var(--mint);backdrop-filter:blur(3px)}
  #menuBtn:hover{border-color:var(--mint)}
  #menu{position:absolute;top:46px;right:12px;z-index:11;display:none;flex-direction:column;gap:2px;min-width:172px;
        background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:6px;backdrop-filter:blur(5px)}
  #menu.show{display:flex}
  #menu .mi{padding:8px 11px;border-radius:7px;cursor:pointer;font-size:12px;color:var(--ink);text-decoration:none;display:block}
  #menu .mi:hover{background:#1d262c;color:var(--gold)}
  /* ===== 今日の労働量（このゲームの主役の数字。製造設定とは分ける） ===== */
  #board{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:6;display:flex;gap:0;
         background:var(--panel);border:1px solid var(--edge);border-radius:12px;overflow:hidden;backdrop-filter:blur(4px)}
  #board .m{padding:8px 22px;text-align:center;min-width:126px}
  #board .m+.m{border-left:1px solid var(--edge)}
  #board .v{font-size:27px;line-height:1.1;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
  #board .v small{font-size:12px;color:#9fdcc6;font-weight:400;margin-left:2px}
  #board .l{font-size:9.5px;color:#9fb0c0;letter-spacing:.06em;margin-top:1px}
  #board .m.prod .v{color:#7fe6ff}
  /* 工場レイアウト編集は常時アクセスできるよう右下に固定 */
  #editFab{position:absolute;right:12px;bottom:12px;z-index:9;cursor:pointer;font-size:12px;
           background:var(--panel);border:1px solid var(--edge);border-radius:9px;padding:8px 13px;color:var(--mint);backdrop-filter:blur(3px)}
  #editFab:hover{border-color:var(--mint)}
  #editFab.on{background:#78d0a6;border-color:#78d0a6;color:#17251f;font-weight:700}
  #hud{position:absolute;left:12px;bottom:12px;font-size:12px;color:var(--ink);background:var(--panel);padding:5px 10px;border-radius:6px;z-index:6}
  #hud b{color:var(--gold)}
  #note{position:absolute;top:10px;left:12px;font-size:10px;color:#9fdcc6;background:var(--panel);padding:4px 9px;border-radius:6px;z-index:6}
  /* overlay */
  #overlay{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(6,10,12,.72);backdrop-filter:blur(4px)}
  #overlay.show{display:flex}
  /* 固定サイズ: 中身が変わっても外枠がガタつかない。内部だけスクロール */
  #panel{position:relative;background:#12181c;border:1px solid var(--edge);border-radius:12px;padding:16px 20px;width:min(680px,92vw);height:min(72vh,560px);overflow:hidden}
  .pbody{height:100%;overflow-y:auto;overflow-x:hidden;padding-right:6px}
  #panel h2{margin:0 0 8px;font-size:16px;color:var(--gold)}
  #panel .close{position:absolute;top:8px;right:14px;font-size:20px;color:#9fb0c0;cursor:pointer;z-index:2}
  .rowline{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0;font-size:12px}
  .btn{background:var(--gold);color:#243b34;font-weight:700;border:none;border-radius:8px;padding:9px 16px;cursor:pointer;font-family:inherit;font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,66px);gap:8px;margin-top:6px}
  .cell{width:66px;height:80px;border-radius:8px;border:2px solid #333;background:#0e1417;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:28px;position:relative;cursor:pointer}
  .cell small{font-size:8px;margin-top:1px} .cell .cnt{position:absolute;bottom:2px;right:5px;font-size:9px;color:#fff}
  .cell.own:hover{box-shadow:0 0 0 2px var(--gold) inset}
  .cardwrap{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:100px;align-items:center;margin:6px 0}
  .card{width:72px;height:94px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:32px;border:2px solid #fff;animation:pop .45s ease both}
  .card small{font-size:9px;font-weight:700;margin-top:2px}
  @keyframes pop{0%{transform:scale(.2) rotate(-8deg);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1)}}
  #toast{position:absolute;bottom:70px;left:50%;transform:translateX(-50%);background:var(--panel);color:var(--ink);padding:8px 16px;border-radius:8px;z-index:7;display:none;font-size:12px}
  /* craft */
  .invbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;background:#0e1417;border:1px solid var(--edge);border-radius:8px;padding:7px 9px;margin:6px 0;font-size:12px}
  .chip{display:inline-flex;align-items:center;gap:3px;background:#1a2228;border-radius:6px;padding:2px 7px}
  .chip b{color:#eafff4}
  .sttabs{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0 4px}
  .sttab{background:#141b20;border:1px solid var(--edge);border-radius:8px 8px 0 0;padding:5px 11px;cursor:pointer;font-size:12px;color:#9fdcc6}
  .sttab.on{background:#1d262c;border-color:var(--gold);color:var(--gold)}
  .rc{display:flex;align-items:center;gap:10px;background:#10171b;border:1px solid #243036;border-radius:9px;padding:8px 11px;margin:6px 0}
  .rc .ic{font-size:26px;width:34px;text-align:center}
  .rc .mid{flex:1;min-width:0}
  .rc .nm{font-size:13px;color:#eafff4;font-weight:700}
  .rc .cost{font-size:11px;color:#9fb0c0;margin-top:2px}
  .rc .cost .lack{color:#e0674e}
  .rc button{background:var(--gold);color:#243b34;font-weight:700;border:none;border-radius:7px;padding:8px 13px;cursor:pointer;font-family:inherit;font-size:12px}
  .rc button:disabled{background:#33403c;color:#7f8f89;cursor:not-allowed}
  .locked{opacity:.5}
  /* tech map */
  .map{display:flex;flex-direction:column;gap:2px}
  .tier{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:7px 0}
  .tlab{font-size:10px;color:#9fb0c0;width:74px;flex:none}
  .node{display:inline-flex;flex-direction:column;align-items:center;background:#131b20;border:1px solid var(--edge);border-radius:8px;padding:6px 9px;min-width:60px}
  .node.mach{border-color:#c98b52} .node.mat{border-color:#4a6b7a} .node .e{font-size:22px} .node small{font-size:9px;color:#cfeee0;margin-top:1px}
  .arrow{color:#5f7a72;font-size:16px}
  /* 編集パレット */
  #palette{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);z-index:8;display:none;flex-direction:column;gap:7px;background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:9px 11px;backdrop-filter:blur(4px)}
  #palette.show{display:flex}
  .pcat{display:flex;gap:5px;flex-wrap:wrap}
  .pcat .c{background:#141b20;border:1px solid var(--edge);border-radius:7px;padding:4px 11px;cursor:pointer;font-size:12px;color:#9fdcc6}
  .pcat .c.on{border-color:var(--gold);color:var(--gold);background:#1d262c}
  .pitems{display:flex;gap:6px;flex-wrap:wrap;width:min(860px,90vw);max-height:132px;overflow-y:auto}
  .pitem{width:62px;height:64px;border:2px solid #2c3a38;border-radius:8px;background:#0e1417;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;cursor:pointer;position:relative}
  .pitem:hover{border-color:#5f8a80}
  .pitem.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
  .pitem.cur{border-color:#7fe6ff}
  .pitem small{font-size:8px;color:#cfeee0;margin-top:1px;max-width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pitem .qn{position:absolute;top:1px;right:4px;font-size:9px;color:#7fe6ff;font-weight:700}
  .pitem.dim{opacity:.4;cursor:default}
  .phint{font-size:10px;color:#9fb0c0}
  /* ===== 製造（抽出機に原材料をセット → WPを溜めて製品化）。コア機能なので上中央 ===== */
  #craft{position:absolute;top:76px;left:50%;transform:translateX(-50%);z-index:7;background:var(--panel);
         border:1px solid var(--edge);border-radius:11px;padding:8px 11px;font-size:11px;backdrop-filter:blur(4px);
         display:flex;align-items:center;gap:11px;max-width:min(760px,calc(100vw - 24px))}
  #craft .slots{display:flex;gap:5px}
  #craft .slot{width:52px;height:46px;border:2px dashed #33443f;border-radius:8px;display:flex;flex-direction:column;
               align-items:center;justify-content:center;cursor:pointer;background:#0e1417}
  #craft .slot:hover{border-color:#5f8a80}
  #craft .slot.set{border-style:solid;border-color:var(--mint)}
  #craft .slot.none{opacity:.4;cursor:default;border-color:#26332f}
  #craft .slot .e{font-size:18px;line-height:1}
  #craft .slot small{font-size:8px;color:#cfeee0;margin-top:1px}
  #craft .prog{min-width:150px}
  #craft .prog .kv{display:flex;justify-content:space-between;color:#9fb0c0;font-size:10px}
  #craft .prog .kv b{color:#eafff4;font-variant-numeric:tabular-nums}
  #craft .bar{height:8px;background:#0d1315;border:1px solid var(--edge);border-radius:4px;overflow:hidden;margin-top:4px}
  #craft .bar>i{display:block;height:100%;background:linear-gradient(90deg,#78d0a6,var(--gold));width:0}
  #craft button{background:var(--gold);color:#243b34;font-weight:700;border:none;white-space:nowrap;
                border-radius:8px;padding:10px 15px;cursor:pointer;font-family:inherit;font-size:12px}
  #craft button.stop{background:#3a4a45;color:#cfeee0}
  #craft .warn{color:#ff9f7a;font-size:10px;max-width:200px}
  /* メニューのドロップダウンと重ならないよう右の中央に置く */
  #doneBtn{position:absolute;top:50%;right:12px;transform:translateY(-50%);z-index:8;display:none;cursor:pointer;
           font-size:12px;background:var(--gold);color:#243b34;font-weight:700;padding:9px 14px;border-radius:9px;
           box-shadow:0 6px 20px rgba(0,0,0,.45)}
  #doneBtn.show{display:block}
  #doneN{background:#243b34;color:var(--gold);border-radius:99px;padding:0 6px;margin-left:3px;font-size:10px}
  /* 完成品 / 製品図鑑 のグリッド */
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:7px}
  .pcard{position:relative;background:#10171b;border:1px solid #243036;border-radius:9px;padding:8px 4px;text-align:center}
  .pcard .e{font-size:28px;line-height:1.1}
  .pcard .nm{font-size:10px;color:#eafff4;margin-top:2px}
  .pcard .rr{font-size:9px;margin-top:1px}
  .pcard .qn{font-size:9px;color:#7fe6ff}
  .pcard.miss{opacity:.28}
  .pcard .new{position:absolute;top:-5px;left:-4px;background:#ff5d6c;color:#fff;font-size:8px;
              font-weight:700;padding:1px 5px;border-radius:99px;transform:rotate(-8deg)}
</style>
</head>
<body>
<div id="wrap">
  <div id="game"></div>
  <div id="note">🏭 Claude Factory</div>
  <div id="menuBtn" title="メニュー">☰</div>
  <div id="menu">
    <div class="mi" id="dexBtn">📖 図鑑</div>
    <div class="mi" id="lbBtn">🏆 リーダーボード</div>
    <div class="mi" id="shopBtn">🏪 ショップ</div>
    <a class="mi" href="/metrics">📊 メトリクス</a>
  </div>
  <div id="board"></div>
  <div id="doneBtn">🎁 完成品 <span id="doneN"></span></div>
  <div id="craft"></div>
  <div id="editFab">🔧 レイアウト編集</div>
  <div id="hud"></div>
  <div id="palette"></div>
  <div id="toast"></div>
  <div id="overlay"><div id="panel"></div></div>
</div>
<script src="vendor/phaser.min.js"></script>
<script src="game/main.js"></script>
<script>
'use strict';
/* ===== ガチャ / コレクション(現行版と共通ロジック・実トークン連動) ===== */
const RAR={1:{n:'N',c:'#9fb0c0',w:58},2:{n:'R',c:'#5fa8e0',w:27},3:{n:'SR',c:'#b57be0',w:11},4:{n:'SSR',c:'#f6c04a',w:3.2},5:{n:'UR',c:'#ff5d6c',w:0.8}};
const PRIZES=[
  {id:'p_bolt',e:'🔩',n:'謎のボルト',r:1},{id:'p_clip',e:'📎',n:'クリップ',r:1},{id:'p_cone',e:'🚧',n:'コーン',r:1},{id:'p_seed',e:'🌱',n:'観葉の芽',r:1},
  {id:'p_guitar',e:'🎸',n:'ギター',r:2},{id:'p_lamp',e:'💡',n:'ランプ',r:2},{id:'p_bronze',e:'🥉',n:'銅トロフィー',r:2},
  {id:'p_robot',e:'🤖',n:'ロボ人形',r:3},{id:'p_arcade',e:'🕹️',n:'アーケード',r:3},{id:'p_gold',e:'🥇',n:'金メダル',r:3},
  {id:'p_crystal',e:'💎',n:'クリスタル',r:4},{id:'p_rocket',e:'🚀',n:'ロケット',r:4},
  {id:'p_crown',e:'👑',n:'王冠',r:5},{id:'p_dragon',e:'🐉',n:'ドラゴン像',r:5},
];
// ===== 価格・レート（すべて調整可） =====
const SELL={1:60,2:180,3:600,4:2400,5:9000};         // 景品売却額(レア度別)
const MACH={ red:{e:'🟥',n:'抽出機',price:0}, green:{e:'🟩',n:'成形機',price:2200},
             blue:{e:'🟦',n:'演算機',price:6500}, yellow:{e:'🟨',n:'選別機',price:15000} };
const lvCost=(lvl)=> Math.round(120*lvl*lvl);        // レベルアップ費用
const BELT_PRICE=450;
const DECO={ crate:{e:'📦',n:'木箱',price:150}, drum:{e:'🛢️',n:'ドラム缶',price:200}, plant:{e:'🪴',n:'観葉植物',price:180}, pallet:{e:'🧱',n:'パレット',price:160}, sign:{e:'🚧',n:'標識',price:220} };
// Stitch製 装飾プロップ(床に置くオブジェクト)
const PROP={ vase:{e:'🏺',n:'装飾壺',price:220}, palm:{e:'🌴',n:'ヤシの木',price:240}, rug:{e:'🧶',n:'絨毯',price:200}, flantern:{e:'🪔',n:'燭台ランプ',price:260},
  fountain:{e:'⛲',n:'噴水',price:450}, chest:{e:'🧰',n:'宝箱',price:400}, cushion:{e:'🛋️',n:'クッション',price:180}, bonsai:{e:'🎍',n:'盆栽',price:280},
  lantern:{e:'🏮',n:'吊り提灯',price:220}, pedestal:{e:'🗿',n:'石台座',price:320}, flower:{e:'🌸',n:'花鉢',price:170}, screen:{e:'🖼️',n:'屏風',price:340} };
const BG={ auto:{n:'標準（時刻連動）',price:0}, blue:{n:'快晴',price:1800}, sunset:{n:'夕焼け',price:2200}, night:{n:'星空',price:2600}, space:{n:'宇宙',price:4200}, aurora:{n:'オーロラ',price:5200} };
const FLOOR={ wood:{n:'木材（標準）',price:0}, cool:{n:'クールグレー',price:1000}, crimson:{n:'レッドタイル',price:1200}, forest:{n:'フォレスト',price:1200}, gold:{n:'ゴールド',price:3200} };
// テーマシリーズ: 空テーマ(sky)＋床材(floor)＋絵文字装飾セット(decos) をまとめて購入/適用
const SERIES={
  arabia:{n:'🕌 アラビア', price:6000, sky:'arabia',   floor:'wood',    decos:[]},
  undersea:{n:'🐚 海底',   price:6000, sky:'undersea', floor:'wood',    decos:[]},
  japan:{n:'⛩️ 日本',      price:6000, sky:'japan',    floor:'wood',    decos:[]},
  china:{n:'🐉 中華',      price:6000, sky:'china',    floor:'wood',    decos:[]},
  diner:{n:'🍔 ダイナー',   price:6000, sky:'diner',    floor:'wood',    decos:[]},
  fantasy:{n:'🧙 ファンタジー', price:6000, sky:'fantasy', floor:'wood', decos:[]},
  scifi:{n:'🚀 SF宇宙',    price:6000, sky:'scifi',    floor:'wood',    decos:[]},
  cabin:{n:'🌲 森コテージ', price:6000, sky:'cabin',    floor:'wood',    decos:[]},
  dino:{n:'🦖 ダイナソー',  price:6000, sky:'dino',     floor:'wood',    decos:[]},
  haunted:{n:'👻 幽霊屋敷',  price:6000, sky:'haunted',  floor:'wood',    decos:[]},
  pirate:{n:'🏴‍☠️ 海賊船',   price:6000, sky:'pirate',   floor:'wood',    decos:[]},
  circuit:{n:'🏁 サーキット', price:6000, sky:'circuit',  floor:'wood',    decos:[]},
  dwarf:{n:'⛏️ ドワーフ鉱山', price:6000, sky:'dwarf',    floor:'wood',    decos:[]},
  hell:{n:'😈 地獄',         price:6000, sky:'hell',     floor:'wood',    decos:[]},
  steampunk:{n:'⚙️ スチパン', price:6000, sky:'steampunk',floor:'wood',    decos:[]},
  retrofuture:{n:'🛸 レトロ未来', price:6000, sky:'retrofuture',floor:'wood', decos:[]},
  tokyo:{n:'🌃 Tokyo',      price:6000, sky:'tokyo',    floor:'wood',    decos:[]},
  halloween:{n:'🎃 ハロウィン', price:6000, sky:'halloween',floor:'wood', decos:[]},
  western:{n:'🤠 西部開拓時代', price:6000, sky:'western',floor:'wood', decos:[]},
  sushi:{n:'🍣 回転寿司', price:6000, sky:'sushi',floor:'wood', decos:[]},
  beehive:{n:'🐝 ミツバチの巣', price:6000, sky:'beehive',floor:'wood', decos:[]},
  circus:{n:'🎪 サーカス', price:6000, sky:'circus',floor:'wood', decos:[]},
  carnival:{n:'🎭 カーニバル', price:6000, sky:'carnival',floor:'wood', decos:[]},
  desert:{n:'🏜️ 砂漠', price:6000, sky:'desert',floor:'wood', decos:[]},
  jungle:{n:'🌴 ジャングル', price:6000, sky:'jungle',floor:'wood', decos:[]},
  egypt:{n:'🔺 古代エジプト', price:6000, sky:'egypt',floor:'wood', decos:[]},
  christmas:{n:'🎄 クリスマス', price:6000, sky:'christmas',floor:'wood', decos:[]},
  space:{n:'🚀 宇宙ステーション', price:6000, sky:'space',floor:'wood', decos:[]},
  ice:{n:'🧊 氷の城', price:6000, sky:'ice',floor:'wood', decos:[]},
  mushroom:{n:'🍄 森のキノコ', price:6000, sky:'mushroom',floor:'wood', decos:[]},
  onsen:{n:'♨️ 和風温泉', price:6000, sky:'onsen',floor:'wood', decos:[]},
};

let G={ pity:0, inv:{}, money:0, machines:[{type:'red',lvl:1}], belts:0, decos:{},
        bg:'auto', floor:'wood', bgOwned:['auto'], floorOwned:['wood'], skins:{}, seriesOwned:[], emojiDecos:[], layout:[],
        stock:{machine:{},prop:{},deco:{},belt:0}, lastT:null };
let saveT=null;
function saveGame(){ if(saveT)clearTimeout(saveT); saveT=setTimeout(()=>{ const b=JSON.stringify(G);
  try{fetch('/api/save',{method:'POST',body:b});}catch(_){} try{localStorage.setItem('cf-save',b);}catch(_){}} ,400); }
async function loadGame(){ let s=null; try{ s=await (await fetch('/api/save',{cache:'no-store'})).json(); }catch(_){}
  if(!s||typeof s!=='object'){ try{ s=JSON.parse(localStorage.getItem('cf-save')); }catch(_){} }
  if(s&&typeof s==='object') G=Object.assign(G,s);     // 旧セーブの景品(inv)・pityは引き継ぎ、経済フィールドを補完
  if(!G.inv)G.inv={}; if(!Array.isArray(G.machines)||!G.machines.length)G.machines=[{type:'red',lvl:1}]; if(!G.decos)G.decos={};
  if(!Array.isArray(G.bgOwned))G.bgOwned=['auto']; if(!Array.isArray(G.floorOwned))G.floorOwned=['wood']; if(!G.bg)G.bg='auto'; if(!G.floor)G.floor='wood';
  if(!G.skins||typeof G.skins!=='object')G.skins={}; if(!Array.isArray(G.seriesOwned))G.seriesOwned=[]; if(!Array.isArray(G.emojiDecos))G.emojiDecos=[]; if(!Array.isArray(G.layout))G.layout=[];
  ['money','belts'].forEach(k=>{ if(typeof G[k]!=='number')G[k]=0; });
  // 在庫(owned)。無ければ現在の配置から復元(既存の設置物は所持扱い)
  if(!G.stock||typeof G.stock!=='object'){ G.stock={machine:{},prop:{},deco:{},belt:0};
    for(const e of G.layout){ if(e.kind==='belt') G.stock.belt++; else if(G.stock[e.kind]) G.stock[e.kind][e.sub]=(G.stock[e.kind][e.sub]||0)+1; } }
  for(const k of ['machine','prop','deco']) if(!G.stock[k]||typeof G.stock[k]!=='object') G.stock[k]={};
  if(typeof G.stock.belt!=='number') G.stock.belt=0; }
// 在庫と配置数
function ownedN(kind,sub){ return kind==='belt' ? (G.stock.belt||0) : ((G.stock[kind]&&G.stock[kind][sub])||0); }
function availN(kind,sub){ return Math.max(0, ownedN(kind,sub) - cnt(kind==='belt'?'belt':kind, kind==='belt'?null:sub)); }
function addStock(kind,sub,n){ n=n||1; if(kind==='belt') G.stock.belt=(G.stock.belt||0)+n; else { if(!G.stock[kind])G.stock[kind]={}; G.stock[kind][sub]=(G.stock[kind][sub]||0)+n; } }
// 設置済みは必ず所持(在庫)に含める(在庫 >= 設置数 を保証)
function reconcileStock(){ const need={machine:{},prop:{},deco:{},belt:0};
  for(const e of (G.layout||[])){ if(e.kind==='belt') need.belt++; else if(need[e.kind]) need[e.kind][e.sub]=(need[e.kind][e.sub]||0)+1; }
  for(const k of ['machine','prop','deco']){ for(const s in need[k]) if((G.stock[k][s]||0)<need[k][s]) G.stock[k][s]=need[k][s]; }
  if((G.stock.belt||0)<need.belt) G.stock.belt=need.belt; }
// 配置レイアウト(位置)の唯一の真実 = G.layout。シーンから同期。
function snapLayout(){ if(window.__scene) G.layout=window.__scene.getLayout(); }
window.__layoutChanged=()=>{ snapLayout(); saveGame(); };
const cnt=(kind,sub)=> (G.layout||[]).filter(e=>e.kind===kind&&(sub==null||e.sub===sub)).length;
// エージェント頭アクセ(スキン)の永続化: main.js からクリック巡回時に呼ばれる
window.__skinChanged=(proj,skinId)=>{ if(!proj)return; if(skinId==='none') delete G.skins[proj]; else G.skins[proj]=skinId; saveGame(); };
const overlay=document.getElementById('overlay'), panel=document.getElementById('panel');
function closeOverlay(){ overlay.classList.remove('show'); if(document.getElementById('palette').classList.contains('show')&&window.renderPalette) renderPalette(); }
function openOverlay(h){ panel._refresh=null; panel.innerHTML='<span class="close">✕</span><div class="pbody">'+h+'</div>'; panel.querySelector('.close').onclick=closeOverlay; overlay.classList.add('show'); }
overlay.addEventListener('click',e=>{ if(e.target===overlay) closeOverlay(); });
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; clearTimeout(t._t); t._t=setTimeout(()=>t.style.display='none',1600); }
// 💰はショップを開いたときだけ見えればよいので、常設バッジは持たない。
// 購入/売却の各所から呼ばれるため、関数名は残してショップ内の残高表示だけ更新する。

let _dexTab='prod';   // 'prod'=製造した製品(ゲームのゴール) / 'prize'=ガチャ景品

/* =========================================================================
   製造プロトタイプ — 抽出機に原材料をセット → 実WPを溜めて製品化
   WP は /api/otel（OTel実測）の累計を参照する。セッション開始時点の累計を
   startWp として記録し、差分を「現セッションWP」として扱う。
   ========================================================================= */
const CRAFT_WP = 50;          // 1製品あたりの必要WP（プロトタイプ値）
const MAX_EXTRACTORS = 3;     // 原材料をセットできる抽出機の上限

// 原材料（プロトタイプは食材のみ。将来は工場ジャンルで差し替える）
const MATS = [
  {id:'milk',  e:'🥛',n:'牛乳'},   {id:'flour', e:'🌾',n:'小麦粉'}, {id:'egg',   e:'🥚',n:'卵'},

  {id:'tomato',e:'🍅',n:'トマト'}, {id:'meat',  e:'🥩',n:'肉'},     {id:'veg',   e:'🥬',n:'野菜'},
];
const MAT = Object.fromEntries(MATS.map(m=>[m.id,m]));

// 製品（r は RAR と共通のレア度 1..5 / m は相性のある原材料）
// m は未定義の組み合わせから製品を選ぶときのスコアに使う。これが無いと
// 「チョコ+卵+牛乳 → サラダ」のような噛み合わない結果が出る。
const PRODS = [

  {id:'sandwich',e:'🥪',n:'サンドイッチ',  r:2,m:['flour','veg','cheese','meat']},
  {id:'cupnoodle',e:'🍜',n:'カップラーメン',r:2,m:['noodle','meat','veg']},
  {id:'pizza',   e:'🍕',n:'ピザ',          r:2,m:['flour','cheese','tomato']},

  {id:'pasta',   e:'🍝',n:'パスタ',        r:2,m:['noodle','tomato','cheese']},
  {id:'curry',   e:'🍛',n:'カレー',        r:2,m:['rice','meat','veg']},
  {id:'burger',  e:'🍔',n:'ハンバーガー',  r:2,m:['flour','meat','cheese','veg']},
  {id:'taco',    e:'🌮',n:'タコス',        r:2,m:['flour','meat','veg','tomato']},

  {id:'cupcake', e:'🧁',n:'カップケーキ',  r:3,m:['flour','egg','sugar','choco']},

  {id:'deco',    e:'🎂',n:'デコレーションケーキ',r:4,m:['flour','egg','sugar','butter','choco','milk']},

  {id:'bento',   e:'🍱',n:'特上弁当',      r:4,m:['rice','meat','veg','egg']},
  {id:'course',  e:'🏆',n:'伝説のフルコース',r:5,m:['meat','cheese','tomato','butter','rice','veg']},
  // レシピに無い組み合わせのときだけ出る。組み合わせを探す動機になる「ハズレ枠」
  {id:'blob',    e:'🪨',n:'謎のカタマリ',   r:1,m:[]},
];
const BLOB='blob';
const PROD = Object.fromEntries(PRODS.map(p=>[p.id,p]));

// 組み合わせ（重複を除いた原材料のソート済みキー）→ 出うる製品5種
const RECIPES = {
  'egg,milk,sugar'      : ['pudding','icecream','parfait','crepe','honeytoast'],
  'butter,egg,flour'    : ['cookie','cake','donut','croissant','deco'],
  'egg,flour,milk'      : ['pancake','crepe','bread','cake','cupcake'],
  'flour,milk'          : ['bread','pancake','croissant','crepe','cupcake'],
  'egg,milk'            : ['pudding','omelet','icecream','pancake','parfait'],
  'meat,noodle'         : ['cupnoodle','ramen','pasta','curry','soup'],
  'meat,rice'           : ['curry','onigiri','bento','sushi','soup'],
  'cheese,flour,tomato' : ['pizza','gratin','pasta','sandwich','burger'],
  'meat,veg'            : ['salad','burger','taco','soup','bento'],
  'butter,choco,flour'  : ['cookie','donut','cupcake','cake','deco'],
  'choco,milk'          : ['icecream','pudding','crepe','parfait','cupcake'],
  'cheese,meat,veg'     : ['burger','taco','sandwich','gratin','pizza'],
  'rice,veg'            : ['onigiri','salad','bento','soup','sushi'],
  'egg,flour'           : ['bread','pancake','cookie','omelet','croissant'],
  'noodle,veg'          : ['cupnoodle','ramen','pasta','salad','soup'],
  'butter,veg'          : ['fries','salad','soup','gratin','omelet'],
  'cheese,meat,tomato'  : ['course','burger','pizza','pasta','gratin'],
};

// 未定義の組み合わせは、組み合わせ文字列から「決定的に」5種を選ぶ。
// Math.random にすると開き直すたび候補が変わってしまうため、必ずハッシュ由来にする。
// レシピに定義された組み合わせだけが製品になる。
// それ以外は「🪨 謎のカタマリ」。組み合わせを当てにいく動機がこれで生まれる。
function poolFor(key){
  const r=RECIPES[key];
  return (r && r.length) ? r.filter(id=>PROD[id]) : [BLOB];
}
// 5種の中からレア度で重み付けして1つ引く（同じ組み合わせでも出るものが変わる）
function rollProduct(key){
  const pool=poolFor(key).map(id=>PROD[id]).filter(Boolean); if(!pool.length) return null;
  const ws=pool.reduce((s,p)=>s+RAR[p.r].w,0); let x=Math.random()*ws;
  for(const p of pool){ x-=RAR[p.r].w; if(x<=0) return p; }
  return pool[pool.length-1];
}

function craftState(){
  if(!G.craft||typeof G.craft!=='object') G.craft={};
  const c=G.craft;
  if(!c.mats||typeof c.mats!=='object') c.mats={};
  if(!Array.isArray(c.made)) c.made=[];
  if(!c.dex||typeof c.dex!=='object') c.dex={};
  if(c.session&&typeof c.session!=='object') c.session=null;
  return c;
}
// 抽出機は配置順に最大3台までを原材料スロットとして扱う
function slotIds(){ const s=window.__scene; return (s&&s.extractors?s.extractors():[]).slice(0,MAX_EXTRACTORS); }
function comboMats(){ const c=craftState(); return slotIds().map(id=>c.mats[id]).filter(Boolean); }
function comboKey(){ const set=[...new Set(comboMats())].sort(); return set.length?set.join(','):null; }

/* --- WP の取得（OTel実測） --- */
let WPST={ total:0, today:0, ok:false, sc:[] };
async function pollWp(){
  try{
    const r=await fetch('/api/otel',{cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status);
    const d=await r.json();
    WPST={ total:d.wpTotal||0, today:d.wpToday||0, ok:true, sc:d.scorecard||[] };
  }catch(_){ WPST.ok=false; }
  tickCraft(); renderCraft();
}
const sessionWp = ()=>{ const c=craftState(); return c.session ? Math.max(0, WPST.total - c.session.startWp) : 0; };

/* --- 製造判定。1回のポーリングで複数個できることもある --- */
function tickCraft(){
  const c=craftState(); if(!c.session||!WPST.ok) return;
  const key=comboKey(); if(!key) return;              // 原材料が全部外れたら進めない
  let made=null, n=0;
  while(WPST.total - c.session.startWp >= CRAFT_WP && n<20){
    c.session.startWp += CRAFT_WP;                     // 超過分は次の製品に繰り越す
    const p=rollProduct(key); if(!p) break;
    c.made.push({ pid:p.id, at:Date.now(), key, viewed:false });
    made=p; n++;
  }
  if(made){
    saveGame(); updateDoneBtn();
    if(window.__scene&&window.__scene.celebrate) window.__scene.celebrate(made.e);
    toast(`${made.e} ${made.n} が完成！${n>1?`（${n}個）`:''} 🎁完成品で確認`);
  }
}

/* --- 今日の労働量ボード（画面上中央・このゲームの主役の数字） ---
   「今日どれだけ働いたか」を示す数字なので、製造の設定とは切り離して大きく出す。 */
const jstDayOf = t => new Date(t + 9*3600*1000).toISOString().slice(0,10);
function madeToday(){ const d=jstDayOf(Date.now()); return craftState().made.filter(m=>jstDayOf(m.at)===d).length; }
function renderBoard(){
  const el=document.getElementById('board'); if(!el) return;
  const c=craftState();
  el.innerHTML=`
    <div class="m"><div class="v">${WPST.ok?Math.floor(WPST.today).toLocaleString():'—'}<small>WP</small></div>
      <div class="l">今日の労働量</div></div>
    <div class="m prod"><div class="v">${madeToday()}<small>個</small></div>
      <div class="l">今日の製造</div></div>
    <div class="m"><div class="v" style="color:#cfeee0;font-size:19px;padding-top:5px">${c.made.length}<small>個</small></div>
      <div class="l">累計の製造</div></div>`;
}

/* --- 製造パネル（画面上中央・コア機能） --- */
function renderCraft(){
  const el=document.getElementById('craft'); if(!el) return;
  const c=craftState(), ids=slotIds(), mats=comboMats(), on=!!c.session;
  const wp=sessionWp(), pct=Math.min(100, wp/CRAFT_WP*100);
  const slots = ids.length ? ids.map(id=>{ const m=MAT[c.mats[id]];
      return `<div class="slot ${m?'set':''}" data-mid="${id}" title="クリックで原材料を選ぶ">
        <span class="e">${m?m.e:'＋'}</span><small>${m?m.n:'原材料'}</small></div>`; }).join('')
    : `<div class="slot none" title="🔧レイアウト編集で抽出機を設置してください"><span class="e">🟥</span><small>抽出機なし</small></div>`;
  el.innerHTML = `<div class="slots">${slots}</div>
    <div class="prog">
      <div class="kv"><span>${on?'次の製品まで':'待機中'}</span><b>${Math.floor(wp)} / ${CRAFT_WP} WP</b></div>
      <div class="bar"><i style="width:${on?pct.toFixed(1):0}%"></i></div>
    </div>
    ${mats.length ? `<button class="${on?'stop':''}" id="craftGo">${on?'■ 製造を停止':'▶ 製造開始'}</button>`
                  : `<div class="warn">抽出機をクリックして原材料をセットすると製造を開始できます</div>`}
    ${!WPST.ok ? '<div class="warn">WP未取得<br>（サーバ未接続）</div>' : ''}`;
  for(const s of el.querySelectorAll('.slot[data-mid]')) s.onclick=()=>openMatPicker(s.dataset.mid);
  const go=el.querySelector('#craftGo'); if(go) go.onclick=toggleSession;
  renderBoard();
}
function toggleSession(){
  const c=craftState();
  if(c.session){ c.session=null; toast('製造を停止しました'); }
  else { c.session={ startWp:WPST.total, at:Date.now() };
    toast(`製造開始！ここからのWPをカウントします（${CRAFT_WP}WPで1個）`); }
  saveGame(); renderCraft();
}

/* --- 原材料の選択 --- */
function openMatPicker(machineId){
  const c=craftState(), cur=c.mats[machineId];
  openOverlay(`<h2>🥫 原材料をセット</h2>
    <div class="rowline" style="font-size:11px;color:#9fb0c0">
      選んだ組み合わせで作られる製品が変わります。同じ組み合わせでも5種類の中からランダムです。<br>
      <b style="color:#ff9f7a">変更すると現セッションのWPは0にリセットされます。</b></div>
    <div class="pgrid">${MATS.map(m=>`
      <div class="pcard" data-mat="${m.id}" style="cursor:pointer;${cur===m.id?'border-color:var(--gold)':''}">
        <div class="e">${m.e}</div><div class="nm">${m.n}</div></div>`).join('')}</div>
    ${cur?`<div class="rowline"><button id="matClear" style="background:#3a4a45;color:#cfeee0;border:none;border-radius:7px;padding:8px 13px;cursor:pointer;font-family:inherit">原材料を外す</button></div>`:''}`);
  for(const el of panel.querySelectorAll('[data-mat]')) el.onclick=()=>{ setMat(machineId, el.dataset.mat); closeOverlay(); };
  const cl=panel.querySelector('#matClear'); if(cl) cl.onclick=()=>{ setMat(machineId,null); closeOverlay(); };
}
function setMat(machineId, matId){
  const c=craftState();
  if(matId) c.mats[machineId]=matId; else delete c.mats[machineId];
  // 原材料を変えたらセッション途中でもWPはリセット（仕様）
  if(c.session) c.session.startWp = WPST.total;
  saveGame();
  if(window.__scene&&window.__scene.refreshMachineBadges) window.__scene.refreshMachineBadges();
  renderCraft();

/* --- 完成品 --- */
function updateDoneBtn(){
  const c=craftState(), b=document.getElementById('doneBtn'); if(!b) return;
  const unseen=c.made.filter(m=>!m.viewed).length;
  b.classList.toggle('show', c.made.length>0);
  document.getElementById('doneN').textContent = unseen ? unseen : '';
}
function openDone(){
  const c=craftState();
  const had={}; for(const k in c.dex) had[k]=c.dex[k];      // 「初めて」の判定は登録前の図鑑で行う
  const cards=[...c.made].reverse().slice(0,200).map(m=>{
    const p=PROD[m.pid]; if(!p) return '';
    // 未登録の製品は該当する全部に NEW を付ける（3個できていれば3個とも）
    const isNew = !had[m.pid];
    const ks=(m.key||'').split(',').map(x=>MAT[x]?MAT[x].e:'').join('');
    return `<div class="pcard">${isNew?'<span class="new">NEW</span>':''}
      <div class="e">${p.e}</div><div class="nm">${p.n}</div>
      <div class="rr" style="color:${RAR[p.r].c}">${RAR[p.r].n}</div>
      <div class="qn">${ks}</div></div>`;
  }).join('');
  // 一覧を表示したタイミングで図鑑に登録する（仕様）
  let reg=0; for(const m of c.made){ if(!m.viewed){ c.dex[m.pid]=(c.dex[m.pid]||0)+1; m.viewed=true; reg++; } }
  saveGame(); updateDoneBtn();
  openOverlay(`<h2>🎁 完成品 <span style="font-size:12px;color:#9fb0c0">${c.made.length}個</span></h2>
    <div class="rowline" style="font-size:11px;color:#9fb0c0">
      ${reg?`${reg}個を📖図鑑に登録しました。`:''}NEW は初めて作られた製品です。図鑑を埋めていこう。</div>
    <div class="pgrid">${cards||'<div class="cost">まだありません</div>'}</div>`);
}

          <th>効率</th><th>PR</th><th>コミット</th><th>追加行</th><th>Skill</th><th>Agent</th><th>自作</th><th>委譲率</th><th>稼働日</th>
        </tr></thead><tbody>${rows.length?rows.map((u,i)=>`
          <tr style="text-align:right;border-top:1px solid #22322e">
            <td style="text-align:left">${i+1}</td><td style="text-align:left;color:#eafff4">${u.id}</td>
            <td><b style="color:var(--gold)">${u.efficiency==null?'—':u.efficiency}</b></td>

function sellPrize(id,qty){ const p=PRIZES.find(x=>x.id===id); const have=G.inv[id]||0; qty=Math.min(qty,have); if(qty<=0)return;
  G.inv[id]=have-qty; const gain=SELL[p.r]*qty; G.money+=gain; saveGame(); updateBadge(); toast(`${p.e} ${p.n}×${qty} を売却 (+💰${gain})`); }
// 購入=在庫(owned)に追加。設置は編集パレットから床クリックで行う
function buyMachine(type){ const pr=MACH[type].price; if(G.money<pr)return; G.money-=pr; addStock('machine',type); saveGame(); updateBadge(); toast(`${MACH[type].e} ${MACH[type].n} を購入（🔧編集で設置）`); }
function levelUp(id){ const e=(G.layout||[]).find(x=>x.id===id&&x.kind==='machine'); if(!e)return; const c=lvCost(e.lvl); if(G.money<c)return; G.money-=c; e.lvl++;
  if(window.__scene)window.__scene.setMachineLevel(id,e.lvl); snapLayout(); saveGame(); updateBadge(); toast(`${MACH[e.sub].e} ${MACH[e.sub].n} を Lv${e.lvl} に強化！`); }
function buyBelt(){ if(G.money<BELT_PRICE)return; G.money-=BELT_PRICE; addStock('belt'); saveGame(); updateBadge(); toast('🛗 コンベアを購入（🔧編集で設置）'); }
function buyDeco(t){ const pr=DECO[t].price; if(G.money<pr)return; G.money-=pr; addStock('deco',t); saveGame(); updateBadge(); toast(`${DECO[t].e} ${DECO[t].n} を購入（🔧編集で設置）`); }
function buyProp(t){ const pr=PROP[t].price; if(G.money<pr)return; G.money-=pr; addStock('prop',t); saveGame(); updateBadge(); toast(`${PROP[t].n} を購入（🔧編集で設置）`); }
function selectBg(k){ if(!G.bgOwned.includes(k)){ const pr=BG[k].price; if(G.money<pr)return; G.money-=pr; G.bgOwned.push(k); toast(`背景「${BG[k].n}」を購入！`); } G.bg=k; if(window.__scene&&window.__scene.setSkyTheme)window.__scene.setSkyTheme(k); saveGame(); updateBadge(); }
function selectFloor(k){ if(!G.floorOwned.includes(k)){ const pr=FLOOR[k].price; if(G.money<pr)return; G.money-=pr; G.floorOwned.push(k); toast(`床材「${FLOOR[k].n}」を購入！`); } G.floor=k; if(window.__scene&&window.__scene.setFloor)window.__scene.setFloor(k); saveGame(); updateBadge(); }
function buySeries(k){ const S=SERIES[k]; if(!G.seriesOwned.includes(k)){ if(G.money<S.price)return; G.money-=S.price; G.seriesOwned.push(k);
    if(window.__scene) for(const e of S.decos) window.__scene.placeEmojiDeco(e); snapLayout(); toast(`${S.n} シリーズを購入！内装と装飾を反映`); }
  G.bg=S.sky; G.floor=S.floor; if(window.__scene){ window.__scene.setSkyTheme(S.sky); window.__scene.setFloor(S.floor); } saveGame(); updateBadge(); }

  } else if(editCat==='prop'){ hint=(editSel?'床をクリックで設置':'在庫から選んで床をクリックで設置')+' ・ 既存はドラッグ移動 / 🗑撤去';
    const P=Object.keys(PROP).filter(t=>availN('prop',t)>0).map(t=>cell(`data-place="prop:${t}"`,PROP[t].e,PROP[t].n,0,availN('prop',t),editSel&&editSel.kind==='prop'&&editSel.sub===t));
    const D=Object.keys(DECO).filter(t=>availN('deco',t)>0).map(t=>cell(`data-place="deco:${t}"`,DECO[t].e,DECO[t].n,0,availN('deco',t),editSel&&editSel.kind==='deco'&&editSel.sub===t));
    items=(P.concat(D).join(''))||'<div class="phint" style="padding:8px">在庫なし。🏪ショップ→設備 で購入してください。</div>';
  } else if(editCat==='machine'){ hint=(editSel?'床をクリックで設置（生産＆作業先が増える）':'在庫から選んで床をクリックで設置')+' ・ 既存はドラッグ移動 / 🗑撤去';
    const M=Object.keys(MACH).filter(t=>availN('machine',t)>0).map(t=>cell(`data-place="machine:${t}"`,MACH[t].e,MACH[t].n,0,availN('machine',t),editSel&&editSel.kind==='machine'&&editSel.sub===t));
    items=M.join('')||'<div class="phint" style="padding:8px">在庫なし。🏪ショップ→製造機 で購入してください。</div>';
  } else { hint=(editSel?'床をクリックで設置':'在庫から選んで床をクリックで設置')+' ・ 既存はドラッグ移動 / 🗑撤去';
    const a=availN('belt'); items = a>0? cell(`data-place="belt:"`,'🛗','コンベア',0,a,editSel&&editSel.kind==='belt') : '<div class="phint" style="padding:8px">在庫なし。🏪ショップ→設備 で購入してください。</div>';
  }
  paletteEl.innerHTML=`<div class="pcat">${cats.map(c=>`<span class="c ${c[0]===editCat?'on':''}" data-cat="${c[0]}">${c[1]}</span>`).join('')}</div>
    <div class="pitems">${items}</div><div class="phint">${hint}</div>`;
  paletteEl.querySelectorAll('.c[data-cat]').forEach(el=>el.onclick=()=>{ editCat=el.dataset.cat; editSel=null; window.__editSel=null; renderPalette(); });
  paletteEl.querySelectorAll('[data-bg]').forEach(el=>el.onclick=()=>{ applyBg(el.dataset.bg); renderPalette(); });
  paletteEl.querySelectorAll('[data-place]').forEach(el=>el.onclick=()=>{ const p=el.dataset.place.split(':'); editSel={kind:p[0],sub:p[1]||null}; window.__editSel=editSel; renderPalette(); });
}
window.renderPalette=renderPalette;
window.__editPlaceAt=(c,r)=>{ const sel=window.__editSel; if(!sel)return;
  if(availN(sel.kind,sel.sub)<=0){ editSel=null; window.__editSel=null; renderPalette(); return; }
  const s=window.__scene; const id = s.addPlaced(sel.kind, sel.kind==='belt'?null:sel.sub, {cell:{c,r}});
  if(id){ snapLayout(); saveGame(); updateBadge(); toast('設置しました'); if(availN(sel.kind,sel.sub)<=0){ editSel=null; window.__editSel=null; } renderPalette(); } };
document.getElementById('editFab').addEventListener('click',()=>{ if(!window.__scene)return;
  const on=window.__scene.toggleEdit(); document.getElementById('editFab').classList.toggle('on',on);
  paletteEl.classList.toggle('show',on); if(on) renderPalette(); else { editSel=null; window.__editSel=null; }
  toast(on?'🔧 編集: 上のパレットで選ぶ→床クリックで設置 / ドラッグで移動 / 左下🗑で撤去':'編集モードを終了'); });
loadGame().then(async ()=>{
  G.lastT=Date.now();
  await waitScene(); applyOwned(); updateBadge();
  setInterval(()=>{ G.lastT=Date.now(); saveGame(); }, 15000);
  // 製造: 原材料バッジを反映してからWPの取得を開始（3秒ごと = OTelのログ送信間隔に合わせる）
  if(window.__scene&&window.__scene.refreshMachineBadges) window.__scene.refreshMachineBadges();
  updateDoneBtn(); renderCraft(); pollWp(); setInterval(pollWp, 3000);
  const q=new URLSearchParams(location.search);
  if(q.get('unlockall')){   // 全背景・全アイテムを所持(テスト用)。何度開いても増殖しないよう max で設定
    G.bgOwned=Array.from(new Set([...G.bgOwned,'auto',...SKY_THEMES]));
    G.seriesOwned=Array.from(new Set([...G.seriesOwned,...ROOM_THEMES]));
    G.floorOwned=Array.from(new Set([...G.floorOwned,...Object.keys(FLOOR)]));
    G.money=Math.max(G.money,999999);
    for(const t of Object.keys(MACH)) G.stock.machine[t]=Math.max(3,G.stock.machine[t]||0);
    for(const t of Object.keys(PROP)) G.stock.prop[t]=Math.max(3,G.stock.prop[t]||0);
    for(const t of Object.keys(DECO)) G.stock.deco[t]=Math.max(3,G.stock.deco[t]||0);
    G.stock.belt=Math.max(5,G.stock.belt||0);
    saveGame(); updateBadge(); toast('✅ 全背景・全アイテムを解放しました（在庫）');
  }
  if(q.get('edit')){ paletteEl.classList.add('show'); document.getElementById('editFab').classList.add('on'); renderPalette(); }
  if(q.get('shop'))openShop(q.get('shop')==='1'?undefined:q.get('shop'));
});
</script>
</body>
</html>
