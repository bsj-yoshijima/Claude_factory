<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude Factory</title>
<link rel="icon" type="image/png" sizes="96x96" href="assets/ui/favicon.png">
<link rel="apple-touch-icon" href="assets/ui/favicon-192.png">
<!-- 色のトークンはログイン画面(server/index.mjs)と共有する。二重に持つと片方だけ変わる -->
<link rel="stylesheet" href="game/theme.css">
<style>
  /* この画面だけの寸法。色は game/theme.css 側 */
  :root{ --palw:336px; --slide:.42s cubic-bezier(.22,.75,.24,1); }
  html,body{height:100%;margin:0;background:radial-gradient(120% 120% at 50% 30%,#1b232b 0%,#0c1014 70%);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--ink);overflow:hidden}
  #wrap{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
  /* 編集中は工場が右へスッと寄り、空いた左にパレットが入る。
     縮小して逃がすのではなく、パレットを除いた残り幅いっぱいまで盤面を広げる
     (margin-left で右へ寄せると、flex の中央揃えがパレットの右側を基準に効く)。
     Phaser は Scale.FIT で親要素を見ているが、再フィットは 500ms ポーリングなので
     アニメ中は JS から毎フレーム scale.refresh() を叩いて追従させる。 */
  #game{width:min(1300px,96vw);aspect-ratio:1024/572;margin-left:0;
        transition:width var(--slide),margin-left var(--slide)}
  #wrap.editing #game{width:min(1300px,calc(100vw - var(--palw) - 32px));margin-left:var(--palw)}
  #game canvas{image-rendering:pixelated;border-radius:8px;box-shadow:0 24px 80px rgba(0,0,0,.6)}
  .tab{background:var(--panel);color:var(--mint);border:1px solid var(--edge);border-radius:8px;padding:5px 12px;cursor:pointer;backdrop-filter:blur(3px)}
  .tab:hover{border-color:var(--mint)}
  /* ===== 起動中の目隠し（アセット読み込みのあいだ盤面を隠す） ===== */
  #boot{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;
        gap:14px;background:radial-gradient(120% 120% at 50% 30%,#1b232b 0%,#0c1014 70%);
        transition:opacity .32s ease}
  #boot.gone{opacity:0;pointer-events:none}
  /* CSS のサイズは canvas の内部解像度の 1/2（boot.mjs の Z=2 と対応）。
     1ドット=4px で描いているので等倍で置けばドットが崩れない。
     大きさを変えるときは boot.mjs の DOT と canvas の width/height を一緒に直す
     （CSS だけで伸ばすとドットが間引かれる）。 */
  #boot .bmascot{width:160px;height:140px;image-rendering:pixelated}
  #boot .btext{font-size:12px;color:#7f9a92;letter-spacing:.08em}
  #boot .bbar{width:min(240px,52vw);height:4px;background:var(--edge);border-radius:2px;overflow:hidden}
  #boot .bbar i{display:block;height:100%;width:0;background:var(--mint);border-radius:2px;transition:width .18s ease}
  /* 動きが苦手な人向けの配慮は boot.mjs 側で見ている
     （prefers-reduced-motion なら腕も火花も止めて、進捗バーだけで状況を伝える） */

  /* ===== ハンバーガーメニュー（主要機能以外はここに畳む） ===== */
  #menuBtn{position:absolute;top:10px;right:12px;z-index:11;cursor:pointer;font-size:16px;line-height:1;
           background:var(--panel);border:1px solid var(--edge);border-radius:8px;padding:7px 11px;color:var(--mint);backdrop-filter:blur(3px)}
  #menuBtn:hover{border-color:var(--mint)}
  #menu{position:absolute;top:46px;right:12px;z-index:11;display:none;flex-direction:column;gap:2px;min-width:176px;
        background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:6px;backdrop-filter:blur(5px)}
  #menu.show{display:flex}
  #menu .mi{padding:7px 11px;border-radius:7px;cursor:pointer;font-size:12px;color:var(--ink);text-decoration:none;
            display:flex;align-items:center;gap:9px}
  /* アイコンは 16×16 のドット絵（assets/ui/icons）。原寸で出し、
     高解像度画面での整数倍拡大だけ pixelated に任せる。半端な倍率で縮めると
     ドットが間引かれるので、大きさを変えるときは
     tools/assets/make_menu_icons.mjs のグリッドごと描き直すこと。 */
  #menu .mic{width:16px;height:16px;flex:none;image-rendering:pixelated}
  /* ログアウトだけドット絵が無いので、同じ 16px 枠に記号を入れて行頭を揃える */
  #menu .mig{display:grid;place-items:center;font-size:13px;color:#7f9a92}
  #menu .mi:hover{background:#1d262c;color:var(--gold)}
  #menu .mi:hover .mig{color:var(--gold)}
  /* 役割ごとの小見出しと区切り（工場 / 仲間 / 記録） */
  #menu .mh{font-size:9px;letter-spacing:.14em;color:#7f9a92;text-transform:uppercase;padding:5px 11px 3px}
  #menu .msep{height:1px;background:var(--edge);margin:5px 6px}
  /* ===== 今日の労働量（このゲームの主役の数字。製造設定とは分ける） ===== */
  /* 実績ボードと製造設定は横並び。幅が足りなければ上下に折り返す */
  /* 左の #note と右の☰に被らないよう、左右の余白を非対称に確保して
     その内側で中央寄せする。vw から一律に引くと狭い画面で必要以上に縮む。 */
  #topwrap{position:absolute;top:10px;left:160px;right:70px;margin:0 auto;z-index:7;display:flex;gap:10px;
           flex-wrap:wrap;justify-content:center;align-items:stretch;
           width:fit-content;max-width:min(1040px,100%)}
  #board{display:flex;gap:0;flex:none;align-items:center;
         background:var(--panel);border:1px solid var(--edge);border-radius:12px;overflow:hidden;backdrop-filter:blur(4px)}
  #board .m{padding:8px 22px;text-align:center;min-width:126px}
  #board .m+.m{border-left:1px solid var(--edge)}
  #board .v{font-size:27px;line-height:1.1;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
  #board .v small{font-size:12px;color:#9fdcc6;font-weight:400;margin-left:2px}
  #board .l{font-size:9.5px;color:#9fb0c0;letter-spacing:.06em;margin-top:1px}
  #board .m.prod .v{color:#7fe6ff}
  #board .m.sales .v{color:#ffd27a}
  /* 💰は数字の後ろ。絵文字が行の高さを押し広げないよう固定してベースラインに揃える */
  #board .m.sales .v small{display:inline-block;line-height:1;vertical-align:baseline;
                           margin:0 0 0 3px;color:#ffd27a}
  #board .m.hit{cursor:pointer}                     /* クリックで今日の製造を開く */
  #board .m.hit:hover{background:rgba(127,230,255,.09)}
  /* 稼働/休憩は Claude君の絵で示す（稼働=作業ポーズ+✨ / 休憩=座り+☕）。
     右端に出していた 👥▸ は、クリックできることが枠とカーソルで分かるのでやめた。
     常時見えるのはこのコンパクト表示だけ。クリックでエージェント一覧ダイアログを開く。 */
  #hud{position:absolute;left:12px;bottom:12px;z-index:6;display:flex;gap:8px;background:var(--panel);
       border:1px solid var(--edge);border-radius:10px;padding:5px 9px;backdrop-filter:blur(3px);cursor:pointer}
  #hud:hover{border-color:var(--mint)}
  #hud .st{position:relative;display:flex;align-items:flex-end;gap:2px}
  #hud .st .fx{position:absolute;top:-2px;right:12px;font-size:12px;font-style:normal;line-height:1}
  #hud .st img{width:30px;height:32px;image-rendering:pixelated;display:block}
  #hud b{font-size:15px;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1.6}
  #hud b.idle{color:#9fdcc6}
  #note{position:absolute;top:10px;left:12px;font-size:10px;color:#9fdcc6;background:var(--panel);padding:4px 9px;border-radius:6px;z-index:6}
  /* ロゴは他の .uic(16px)より 1.5倍の 24px。原画 96px の整数4分の1なのでドットが崩れない。
     文字(10px)より背が高いので、下端を文字に合わせるのではなく行の中央で揃える。 */
  #note .uic{width:24px;height:24px;vertical-align:middle;margin-right:2px}
  /* エージェントの顔アイコン(体色＋被り物)。エージェント一覧ダイアログで使う */
  .lgAv{position:relative;width:22px;height:22px;border-radius:6px;flex:none;border:1px solid #0006;overflow:hidden;display:inline-block}
  .lgAv .eye{position:absolute;top:8px;width:3px;height:3px;background:#241713;border-radius:1px}
  .lgAv .eye.l{left:5px} .lgAv .eye.r{right:5px}
  .lgAv img{position:absolute;left:50%;top:-3px;transform:translateX(-50%);width:24px;height:auto;image-rendering:pixelated}
  /* 稼働/休憩バッジ */
  .agSt{display:inline-block;font-size:10px;padding:1px 7px;border-radius:99px;border:1px solid var(--edge);color:#9fdcc6;margin-right:5px}
  .agSt.on{color:#7fe6ff;border-color:#2f5c6b}
  /* overlay */
  #overlay{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(6,10,12,.72);backdrop-filter:blur(4px)}
  #overlay.show{display:flex}
  /* 固定サイズ: 中身が変わっても外枠がガタつかない。内部(.pbody)だけスクロール。
     共通ダイアログは 見出し(.dlgHead) / 本文(.pbody) / 操作(.dlgFoot) の縦3段。 */
  #panel{position:relative;background:#12181c;border:1px solid var(--edge);border-radius:12px;padding:16px 20px;width:min(680px,92vw);height:min(72vh,560px);overflow:hidden;
         display:flex;flex-direction:column}
  .pbody{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-right:6px}
  #panel h2{margin:0 0 8px;font-size:16px;color:var(--gold);padding-right:22px}
  #panel .close{position:absolute;top:8px;right:14px;font-size:20px;color:#9fb0c0;cursor:pointer;z-index:2}
  #panel .close:hover{color:var(--gold)}
  .dlgHead{flex:none}
  .dlgHead .sttabs{margin:6px 0 2px}
  .dlgSub{font-size:12px;color:#9fb0c0;font-weight:400;margin-left:8px}
  .dlgFoot{flex:none;display:flex;gap:8px;align-items:center;justify-content:flex-end;
           border-top:1px solid var(--edge);margin-top:10px;padding-top:10px}
  .dbtn{background:var(--gold);color:#243b34;font-weight:700;border:none;border-radius:8px;padding:9px 16px;cursor:pointer;font-family:inherit;font-size:12px}
  .dbtn.ghost{background:#3a4a45;color:#cfeee0}
  .dbtn:disabled{background:#33403c;color:#7f8f89;cursor:not-allowed}
  .rowline{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0;font-size:12px}
  /* 正方形タイルのグリッド。いまはエージェントのスキン選択だけが使う */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,66px);gap:8px;margin-top:6px}
  .cell{width:66px;height:80px;border-radius:8px;border:2px solid #333;background:#0e1417;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:28px;position:relative;cursor:pointer}
  .cell small{font-size:8px;margin-top:1px} .cell .qty{position:absolute;bottom:2px;right:5px;font-size:9px;color:#fff}
  .cell.own:hover{box-shadow:0 0 0 2px var(--gold) inset}
  /* トーストは盤面の上に一瞬出るだけ。ドラッグ中に出てもポインタを奪わない */
  #toast{position:absolute;bottom:70px;left:50%;transform:translateX(-50%);background:var(--panel);color:var(--ink);padding:8px 16px;border-radius:8px;z-index:7;display:none;font-size:12px;pointer-events:none}
  /* craft */
  .invbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;background:#0e1417;border:1px solid var(--edge);border-radius:8px;padding:7px 9px;margin:6px 0;font-size:12px}
  .chip{display:inline-flex;align-items:center;gap:3px;background:#1a2228;border-radius:6px;padding:2px 7px}
  .chip b{color:#eafff4}
  .sttabs{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0 4px}
  .sttab{background:#141b20;border:1px solid var(--edge);border-radius:8px 8px 0 0;padding:5px 11px;cursor:pointer;font-size:12px;color:#9fdcc6}
  .sttab.on{background:#1d262c;border-color:var(--gold);color:var(--gold)}
  /* 見出しに連ならない独立ボタンとして使うとき（リーダーボードの軸・マイページの粒度） */
  .sttab.pill{border-radius:8px}
  .rc{display:flex;align-items:center;gap:10px;background:#10171b;border:1px solid #243036;border-radius:9px;padding:8px 11px;margin:6px 0}
  .rc .ic{font-size:26px;width:34px;text-align:center}
  /* 被り物の見本（assets/hats）。元画像が 747×525 以上あって 32px まで大きく縮めるので、
     pixelated（最近傍）にするとドットが間引かれてジャギーになる。補間に任せる */
  .rc .ic .hat{width:32px;height:32px;object-fit:contain;vertical-align:middle}
  /* UI機能のドット絵アイコン（16×16・assets/ui/icons）。文字と並べるので少し下げる。
     lg は整数2倍の32px（#craft のロゴなど文字より大きく出す場所用） */
  .uic{width:16px;height:16px;image-rendering:pixelated;vertical-align:-3px}
  /* 製品のアイコンは 32×32 が原寸（図鑑カード 28px・レシピ右 22px の枠に出る）。
     原材料の .uic を2倍に伸ばしたものではないので、クラスを分けて 1/2 縮小を防ぐ。 */
  .pic{width:32px;height:32px;image-rendering:pixelated;vertical-align:middle}
  /* 💰だけは金額のすぐ後ろに添える単位なので、他のアイコンと扱いを分ける。
     高さは数字の半分(0.5em)。px で固定すると、13px の行でも 19px の見出しでも
     同じ大きさになって片方で不釣り合いになるため em で追従させる。
     vertical-align:baseline で画像の下端がベースラインに乗る = 数字の底と揃う
     （.uic の -3px はベースラインより下げる指定なので、そこだけ打ち消す）。 */
  .uic.yen{width:auto;height:0.5em;vertical-align:baseline;margin-left:2px}
  /* 地の文字が小さい場所（ダイアログ副題 12px / ショップ等の行の価格 .cost 11px）は
     0.5em(=5〜6px)では潰れて読めない。そこだけ文字と同じくらいの大きさにする
     （金額を大きく出す完成品・マイページなどは 0.5em のまま）。 */
  .dlgSub .uic.yen,.cost .uic.yen{height:0.9em}
  /* 金額とアイコンの間で行が折れないようにする。狭い桁（ショップの行など）で
     折れるとアイコンだけ次の行に落ち、「数字の後ろ」も底辺の揃えも崩れる */
  .yenv{white-space:nowrap}
  /* テーマのサムネイル（assets/ui/icons/theme-*.png = 部屋の絵の縮小版）。
     ドット絵ではないので pixelated にはしない（縮小に補間が要る）。
     64×64 を CSS で縮めて出す: 行やチップでは18px、パレットのマスでは38px */
  .thumb{width:18px;height:18px;border-radius:4px;object-fit:cover;vertical-align:-4px;margin-right:4px}
  .rc .ic .thumb,.pitem .thumb{width:38px;height:38px;border-radius:6px;margin:0}
  .uic.lg{width:32px;height:32px;vertical-align:-9px}
  /* 製造機のドット絵アイコン（16×16・assets/ui/icons）。編集パレットのマスでは原寸、
     ショップの行（.rc .ic）だけ整数2倍に拡大する。半端な倍率で縮めるとドットが濁るので
     倍率は 1倍か2倍だけにすること */
  .micon{width:16px;height:16px;image-rendering:pixelated;vertical-align:middle}
  .rc .ic .micon{width:32px;height:32px}
  /* 装飾品は盤面と同じ絵を一覧に出す（殻から作り直した個体だけ。旧290体は絵文字のまま）。
     縦横の比は個体ごとに違うので、枠に収めて中央に置く。縮小はドット絵なので pixelated */
  .propart{max-width:42px;max-height:40px;image-rendering:pixelated;display:block;object-fit:contain;margin:0 auto}
  .rc .ic .propart{max-width:34px;max-height:34px}   /* ショップの行は枠が 34px */
  .rc .mid{flex:1;min-width:0}
  .rc .nm{font-size:13px;color:#eafff4;font-weight:700}
  .rc button{background:var(--gold);color:#243b34;font-weight:700;border:none;border-radius:7px;padding:8px 13px;cursor:pointer;font-family:inherit;font-size:12px}
  .rc button:disabled{background:#33403c;color:#7f8f89;cursor:not-allowed}
  /* 説明の小さい灰色テキスト。.rc の行内だけでなくダイアログ直下でも使う */
  .cost{font-size:11px;color:#9fb0c0;margin-top:2px}
  /* 編集パレット。盤面に重ねると工場が隠れるので、左からスライドインする縦のサイドバーにした。
     盤面とは領域が重ならないので、以前必要だった pointer-events:none の逃がしは不要。 */
  #palette{position:fixed;left:0;top:0;bottom:0;width:var(--palw);box-sizing:border-box;z-index:8;display:flex;flex-direction:column;gap:7px;
    background:var(--panel);border-right:1px solid var(--edge);padding:14px 12px;backdrop-filter:blur(6px);
    overflow-y:auto;overscroll-behavior:contain;box-shadow:8px 0 32px rgba(0,0,0,.45);
    transform:translateX(-100%);transition:transform var(--slide);will-change:transform}
  #palette.show{transform:none}
  .phead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:8px;border-bottom:1px solid var(--edge)}
  .phead b{color:var(--gold);font-size:13px}
  .phead .c{background:#141b20;border:1px solid var(--edge);border-radius:7px;padding:3px 9px;cursor:pointer;font-size:11px;color:#9fdcc6}
  .pcat{display:flex;gap:5px;flex-wrap:wrap}
  .pcat .c{background:#141b20;border:1px solid var(--edge);border-radius:7px;padding:4px 11px;cursor:pointer;font-size:12px;color:#9fdcc6}
  .pcat .c.on{border-color:var(--gold);color:var(--gold);background:#1d262c}
  /* 装飾のテーマ絞り込み行。数が多いので少し小さめ＋縦スクロールで畳む */
  .pfil{max-height:84px;overflow-y:auto}
  .pfil .c{font-size:11px;padding:3px 8px}
  .pitems{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-height:120px;overflow-y:auto;align-content:flex-start}
  /* 名前は必ず同じ高さに出す。絵の高さは品目でまちまち（絵文字1行・サムネ38px・
     装飾品の実画像は26〜40px）なので、中身に合わせて縦中央に置くと名前の行が
     マスごとに上下してガタつく。名前は下端に貼り付け、その分の余白を padding で
     確保して、絵はその上の余白の中で中央に置く。 */
  .pitem{width:62px;height:64px;border:2px solid #2c3a38;border-radius:8px;background:#0e1417;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:13px;box-sizing:border-box;font-size:24px;cursor:pointer;position:relative;pointer-events:auto}
  .pitem:hover{border-color:#5f8a80}
  .pitem.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
  .pitem.cur{border-color:#7fe6ff}
  .pitem small{position:absolute;left:2px;right:2px;bottom:3px;font-size:8px;color:#cfeee0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
  .pitem .qn{position:absolute;top:1px;right:4px;font-size:9px;color:#7fe6ff;font-weight:700}
  .pitem.dim{opacity:.4;cursor:default}
  .phint{font-size:10px;color:#9fb0c0}
  /* ===== 製造のコンパクト表示（いま作っている物とWPだけ）。クリックで🏭製造ダイアログ ===== */
  #craft{background:var(--panel);border:1px solid var(--edge);border-radius:11px;padding:7px 12px;font-size:11px;
         backdrop-filter:blur(4px);display:flex;align-items:center;gap:9px;cursor:pointer;
         width:fit-content;max-width:min(340px,100%)}
  #craft:hover{border-color:var(--mint)}
  #craft .pe{font-size:25px;line-height:1;flex:none}
  /* 幅いっぱいに広がったとき（狭い画面）に文字を左、▸ を右端に寄せるため、
     余った幅はこの中央ブロックが吸う。min-width:0 が無いと .nm の ellipsis が効かない。 */
  #craft .mid{flex:1 1 auto;min-width:0}
  #craft .nm{font-size:13px;font-weight:700;color:#eafff4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
  #craft .note{font-size:10px;color:#9fb0c0;margin-top:2px}
  #craft .note.warn{color:#ff9f7a}
  /* ▸ は常にボタンの最右。width:fit-content の広い画面では余白が無いので見た目は変わらない */
  #craft .go{font-size:10px;color:#9fdcc6;flex:none;margin-left:auto}
  /* ===== 🏭製造ダイアログ: 原材料のマスとWPの進捗 ===== */
  .mslots{display:flex;gap:7px;flex-wrap:wrap}
  .mslot{position:relative;width:76px;height:66px;border:2px dashed #33443f;border-radius:9px;background:#0e1417;
         display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
  .mslot:hover{border-color:#5f8a80}
  .mslot.set{border-style:solid;border-color:var(--mint)}
  .mslot.pick{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
  .mslot .e{font-size:24px;line-height:1}
  .mslot small{font-size:9px;color:#cfeee0;margin-top:2px}
  .mslot .x{position:absolute;top:0;right:5px;font-size:11px;color:#9fb0c0}
  .mslot .x:hover{color:#ff9f7a}
  .wpline{margin-top:14px;border-top:1px solid var(--edge);padding-top:9px}
  /* 製造ダイアログ: 1台=1行の縦一覧。1画面に多く入るよう行の高さを詰める
     （見出し行は持たず、マス列の右端に開始ボタン / 進捗はバーと数値の横並び） */
  .mrow{background:#10171b;border:1px solid #243036;border-radius:9px;padding:7px 9px;margin:0 0 6px}
  .mrow.run{border-color:#3f6b58;background:#111d1a}
  .mrow .mslots{align-items:center;gap:5px}
  .mrow .mslot{width:40px;height:40px;border-radius:7px;border-width:1.5px}
  .mrow .mslot .e{font-size:19px}
  /* 製造機のマスに入る原材料は 32×32 版（.pic）を原寸で出す。
     .mrow の小さいマスもそのまま 32px（枠が40px あるので収まる）。 */
  .mslot .e{display:flex;align-items:center;justify-content:center}
  .mrow .mslot .x{top:-3px;right:1px;font-size:10px}
  .mrow .dbtn{margin-left:auto;padding:6px 11px;font-size:11px;white-space:nowrap}
  /* 進捗はバーと数値だけを1行に */
  .mrow .wpline{display:flex;align-items:center;gap:9px;margin-top:6px;padding-top:0;border-top:none}
  .mrow .wpline .bar{flex:1;margin-top:0}
  /* 桁数で幅が変わるとバーの長さが行ごとにずれるので、数値欄は固定幅＋等幅数字にする */
  .mrow .wpline b{flex:none;width:92px;text-align:right;font-size:10.5px;color:#cfeee0;
                  font-variant-numeric:tabular-nums;white-space:nowrap}
  /* 原材料ピッカー: 小さいチップを折り返して並べる */
  .mpick{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:6px;
         background:#0c1215;border:1px solid var(--edge);border-radius:8px;padding:6px 7px}
  .mchip{display:inline-flex;align-items:center;gap:3px;font-size:14px;cursor:pointer;
         background:#141b20;border:1px solid #2c3a38;border-radius:6px;padding:3px 7px}
  .mchip small{font-size:9.5px;color:#cfeee0}
  .mchip:hover{border-color:#5f8a80}
  .mchip.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
  /* ピッカーはジャンルごとの見出し + その下に原材料（タブでは切り替えない） */
  .mpick{flex-direction:column;align-items:stretch;gap:5px}
  .pgroup{display:flex;flex-direction:column;gap:3px}
  .pgroup .ghead{font-size:10px;color:var(--mint);letter-spacing:.04em}
  .pgroup .grow{display:flex;flex-wrap:wrap;gap:4px}
  .wpline .bar{height:9px;background:#0d1315;border:1px solid var(--edge);border-radius:5px;overflow:hidden;margin-top:5px}
  .wpline .bar>i{display:block;height:100%;background:linear-gradient(90deg,#78d0a6,var(--gold));width:0}
  /* メニューのドロップダウンと重ならないよう右の中央に置く */
  #doneBtn{position:absolute;top:50%;right:12px;transform:translateY(-50%);z-index:8;display:none;cursor:pointer;
           font-size:12px;background:var(--gold);color:#243b34;font-weight:700;padding:9px 14px;border-radius:9px;
           box-shadow:0 6px 20px rgba(0,0,0,.45)}
  #doneBtn.show{display:block}
  #doneN{background:#243b34;color:var(--gold);border-radius:99px;padding:0 6px;margin-left:3px;font-size:10px}
  /* 完成品 / 製品図鑑 のグリッド */
  /* NEW バッジはカードの左上へはみ出す。.pbody が overflow-x:hidden なので
     左端の列が切れないよう、はみ出し分(上5px/左4px)の余白をグリッドに持たせる。 */
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:7px;padding:6px 0 0 6px}
  .pcard{position:relative;background:#10171b;border:1px solid #243036;border-radius:9px;padding:8px 4px;text-align:center}
  .pcard .e{font-size:28px;line-height:1.1}
  .pcard .nm{font-size:10px;color:#eafff4;margin-top:2px}
  .pcard .rr{font-size:9px;margin-top:1px}
  .pcard .qn{font-size:9px;color:#7fe6ff}
  .pcard.miss{opacity:.28}
  /* 🧾 製造レシピ — 「原材料 → 製品」を1行1レシピで並べる */
  .rsec{margin:12px 0 5px;font-size:11px;letter-spacing:.08em;color:#9fdcc6;
        border-bottom:1px solid var(--edge);padding-bottom:4px}
  .rsec:first-child{margin-top:2px}
  .rlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(216px,1fr));gap:6px}
  .rrow{display:flex;align-items:center;gap:5px;background:#10171b;border:1px solid #243036;
        border-radius:9px;padding:7px 9px}
  .rms{display:flex;align-items:center;gap:1px;flex-wrap:wrap;font-size:15px;line-height:1.15}
  .rms i{font-style:normal;font-size:9px;color:#5d7078;padding:0 1px}
  .rrow .ra{font-style:normal;font-size:11px;color:#5d7078;margin-left:auto;padding-left:4px}
  .rp{display:flex;align-items:center;gap:5px}
  .rp .e{font-size:22px;line-height:1;display:flex;align-items:center}
  /* 未製造は輪郭だけ。色も名前もレア度も伏せる（作る前に狙い目が分かってしまわないように） */
  .rp .e.sil{filter:brightness(0) saturate(0);opacity:.5}
  .rp .nm{font-size:10px;color:#eafff4}
  .rp .nm.dim{color:#5d7078;letter-spacing:.08em}
  .rp .rr{font-size:9px}
  .pcard .new{position:absolute;top:-5px;left:-4px;background:#ff5d6c;color:#fff;font-size:8px;
              font-weight:700;padding:1px 5px;border-radius:99px;transform:rotate(-8deg)}
  /* マイページ（工場名 / 選択した日・週のサマリ / WPの折れ線） */
  .myname{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .myname b{font-size:20px;color:var(--gold);line-height:1.3}
  .myname input{background:#0e1518;border:1px solid var(--edge);color:var(--ink);border-radius:8px;
                padding:7px 10px;font-family:inherit;font-size:15px;width:min(280px,60%)}
  .myname .ed{background:#141b20;border:1px solid var(--edge);border-radius:8px;padding:4px 9px;
              font-size:11px;color:#9fdcc6;cursor:pointer}
  .myname .ed:hover{border-color:var(--mint);color:var(--gold)}
  .myperiod{font-size:19px;font-weight:700;color:#eafff4;margin-top:12px;line-height:1.3}
  .mystats{display:flex;gap:26px;flex-wrap:wrap;margin:12px 0 2px}
  .mystat{min-width:104px}
  .mystat .k{font-size:11px;color:#9fb0c0;line-height:1.6}
  .mystat .v{font-size:26px;font-weight:700;color:#eafff4;line-height:1.25;white-space:nowrap}
  /* 単位(WP/個/💰)は数字のベースラインに揃える。絵文字は行の高さを押し広げるので固定する */
  .mystat .v small{display:inline-block;font-size:12px;line-height:1;color:#9fb0c0;
                   font-weight:400;margin-left:3px;vertical-align:baseline}
  .mychart{margin-top:6px}
  .mychart svg{width:100%;height:auto;display:block;touch-action:manipulation}
  .mychart .myhit{cursor:pointer}
  .mychart .myhit:focus{outline:none}
  .mychart .myhit:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}

  /* ══════════ 狭い画面 ══════════
     上部の 労働量ボード＋製造カード は、広い画面で「左の🏭ロゴと右の☰の隙間に収まる」
     前提で left:160px / right:70px に置いてある。画面が狭くなるとその隙間がボードの
     実寸より小さくなり、width:fit-content のせいで縮まずに右へはみ出して ☰ を隠す。
     ロゴと☰の行の下へ落として、幅いっぱいを使わせる。 */
  @media (max-width:900px){
    #topwrap{top:48px;left:8px;right:8px;width:auto;max-width:none}
    #board{flex:1 1 auto;min-width:0}
    #board .m{flex:1 1 0;min-width:0;padding:7px 8px}
    #board .v{font-size:21px}
    #board .l{font-size:9px}
    #craft{max-width:100%}
    #craft .nm{max-width:none}
    /* 完成品バッジは上下中央だと製造カードと重なるので下へ逃がす */
    #doneBtn{top:auto;bottom:64px;transform:none}
    /* パレット(336px)を出すと盤面の残り幅が消える。押し出さずに上へ重ねる */
    #palette{width:min(var(--palw),86vw)}
    #wrap.editing #game{width:min(1300px,96vw);margin-left:0}
  }
  /* ボードと製造カードを1行に並べると、この幅から両方とも潰れて読めなくなる。
     ボードに全幅を取らせて、製造カードを次の行へ送る（#topwrap は flex-wrap:wrap）。 */
  @media (max-width:640px){
    #board{flex:1 1 100%}
    #craft{flex:1 1 100%;max-width:100%}
  }
  /* スマホ幅 */
  @media (max-width:480px){
    #note{font-size:9px;padding:3px 7px}
    #hud{left:8px;bottom:8px}
    #doneBtn{right:8px}
    /* ダイアログは画面に対して余白を詰め、縦は使える高さいっぱいまで */
    #panel{width:calc(100vw - 16px);height:min(84vh,640px);padding:13px 14px}
    /* レシピ表は1列に落とす（2列だと材料の絵文字が折り返して行が波打つ） */
    .rlist{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="game"></div>
  <!-- アイコンは favicon と同じ絵にする（タブとゲーム内で同じ顔にする）。96×16 の整数縮小 -->
  <div id="note"><img class="uic" src="assets/ui/favicon.png" alt=""> Claude Factory</div>
  <div id="menuBtn" title="メニュー">☰</div>
  <div id="menu">
    <div class="mh">あなた</div>
    <div class="mi" id="myBtn"><img class="mic" src="assets/ui/icons/mypage.png" alt="">マイページ</div>
    <div class="msep"></div>
    <div class="mh">工場</div>
    <div class="mi" id="recipeBtn"><img class="mic" src="assets/ui/icons/recipe.png" alt="">製造レシピ</div>
    <div class="mi" id="shopBtn"><img class="mic" src="assets/ui/icons/shop.png" alt="">ショップ</div>
    <div class="mi" id="editMenuBtn"><img class="mic" src="assets/ui/icons/layout.png" alt="">レイアウト編集</div>
    <div class="msep"></div>
    <div class="mh">記録</div>
    <div class="mi" id="collectionBtn"><img class="mic" src="assets/ui/icons/collection.png" alt="">図鑑</div>
    <div class="mi" id="lbBtn"><img class="mic" src="assets/ui/icons/leaderboard.png" alt="">リーダーボード</div>
    <div class="msep"></div>
    <!-- セッションは Cookie で30日保持される。アカウントを切り替える唯一の導線がここ。
         GET でセッションを破棄して /login に戻る（server/index.mjs の /auth/logout） -->
    <a class="mi" id="logoutBtn" href="/auth/logout"><span class="mic mig">⏏</span>ログアウト</a>
  </div>
  <div id="topwrap">
    <div id="board"></div>
    <div id="craft"></div>
  </div>
  <div id="doneBtn"><img class="uic" src="assets/ui/icons/gift.png" alt=""> 完成品 <span id="doneN"></span></div>
  <div id="hud"></div>
  <div id="palette"></div>
  <div id="toast"></div>
  <div id="overlay"><div id="panel"></div></div>
  <!-- ===== 起動中の目隠し =====
       アセットは1100枚超・rooms だけで36MB あるので、初回は数秒かかる。
       何も出ないと壊れて見えるため、読み込みの進捗を出してから盤面に入れ替える。 -->
  <div id="boot">
    <!-- 盤面で働いているときの Claude 君をそのまま出す（描画は game/ui/boot.mjs）。
         内部解像度は 2倍で持って CSS では等倍に置く（ドットを補間させないため） -->
    <canvas class="bmascot" width="320" height="280"></canvas>
    <div class="btext">工場を読み込み中…</div>
    <div class="bbar"><i></i></div>
  </div>
</div>
<script>
/* 目隠しの保険だけここに置く。module（game/app.mjs）が何かの理由で動かなくても、
   目隠しが残って操作不能にはしない。中身の制御は app.mjs 側にある。 */
(function(){
  var el=document.getElementById('boot');
  setTimeout(function(){ var t=el&&el.querySelector('.btext');
    if(t && document.getElementById('boot')) t.textContent='読み込みに時間がかかっています…'; }, 12000);
  setTimeout(function(){ if(el) el.remove(); }, 40000);
})();
</script>
<script src="vendor/phaser.min.js"></script>
<script type="module" src="game/scene/main.mjs"></script>
<script type="module" src="game/app.mjs"></script>
</body>
</html>
