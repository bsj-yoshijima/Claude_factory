<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>部屋背景ビューア — Claude Factory</title>
<style>
  :root{ --bg:#0c1014; --fg:#dfe7e3; --dim:#8fa39c; --line:#1e2a30; --accent:#ffd08a; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace}
  header{position:sticky;top:0;z-index:10;background:#0c1014ee;backdrop-filter:blur(6px);
         border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;
         gap:14px;align-items:center}
  h1{font-size:15px;margin:0 8px 0 0;color:var(--accent);font-weight:700}
  label{display:inline-flex;gap:6px;align-items:center;white-space:nowrap;color:var(--dim)}
  input[type=range]{width:120px}
  select,button{background:#16202a;color:var(--fg);border:1px solid var(--line);
                border-radius:6px;padding:4px 8px;font:inherit}
  button{cursor:pointer}
  button.on{background:var(--accent);color:#14202a;border-color:var(--accent)}
  #grid{display:grid;gap:18px;padding:16px}
  .card{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#0f151b}
  .cap{display:flex;justify-content:space-between;gap:10px;padding:6px 10px;
       border-bottom:1px solid var(--line);font-size:12px}
  .cap b{color:var(--accent);font-weight:700}
  .cap .n{color:var(--dim)}
  .stage{position:relative;width:100%;aspect-ratio:1024/572;background:#000}
  .stage img,.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .stage img{image-rendering:pixelated}
  /* 背景以外は透過が見えるよう市松の上に。原寸のまま中央に置く */
  .stage.flat{aspect-ratio:1/1;display:grid;place-items:center;
    background:conic-gradient(#20282e 0 25%,#161d22 0 50%) 0 0/16px 16px}
  .stage.flat img{position:static;width:auto;height:auto;max-width:100%;max-height:100%}
  nav#tabs{display:flex;gap:6px;flex-wrap:wrap}
  .hint{padding:10px 16px;color:var(--dim);font-size:12px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<header>
  <h1>🏭 素材ビューア</h1>
  <nav id="tabs"></nav>
  <label>列 <select id="cols"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>6</option><option>8</option></select></label>
  <span id="roomCtl">
    <button id="bGrid" class="on">グリッド 12×11</button>
    <button id="bFloor" class="on">床の規定枠</button>
    <button id="bWall">壁の想定線</button>
    <label>線の濃さ <input type="range" id="alpha" min="10" max="100" value="85"></label>
    <label>絵の不透明度 <input type="range" id="imgA" min="10" max="100" value="100"></label>
  </span>
  <label id="findWrap">絞り込み <input id="find" placeholder="テーマ名など" style="background:#16202a;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font:inherit;width:150px"></label>
  <span id="count" style="color:var(--dim)"></span>
</header>
<div id="grid"></div>
<p class="hint" id="hintRooms">
  グリッドは実機と同じ <code>ISO</code> 定数から引いています（u方向12マス / v方向11マス）。
  <b style="color:#ff5ec8">ピンクの菱形</b>が床の規定位置 — 頂点は 奥(505,205) 右(837,377) 手前(529,527) 左(197,355)、幅640 × 高さ322。
  この枠と絵の床がずれている部屋が規格外です。表示専用で、ゲームのデータは一切変わりません。
</p>
<p class="hint" id="hintOther" hidden>
  市松模様は透過部分です。数値は元画像の実寸。表示専用で、ゲームのデータは一切変わりません。
</p>

rate"}, {"f": "/assets/objects/obj_drum.png", "k": "obj_drum", "n": "drum"}, {"f": "/assets/objects/obj_m_blue_d0.png", "k": "obj_m_blue_d0", "n": "m_blue_d0"}, {"f": "/assets/objects/obj_m_blue_d1.png", "k": "obj_m_blue_d1", "n": "m_blue_d1"}, {"f": "/assets/objects/obj_m_blue_d2.png", "k": "obj_m_blue_d2", "n": "m_blue_d2"}, {"f": "/assets/objects/obj_m_blue_d3.png", "k": "obj_m_blue_d3", "n": "m_blue_d3"}, {"f": "/assets/objects/obj_m_green_d0.png", "k": "obj_m_green_d0", "n": "m_green_d0"}, {"f": "/assets/objects/obj_m_green_d1.png", "k": "obj_m_green_d1", "n": "m_green_d1"}, {"f": "/assets/objects/obj_m_green_d2.png", "k": "obj_m_green_d2", "n": "m_green_d2"}, {"f": "/assets/objects/obj_m_green_d3.png", "k": "obj_m_green_d3", "n": "m_green_d3"}, {"f": "/assets/objects/obj_m_red_d0.png", "k": "obj_m_red_d0", "n": "m_red_d0"}, {"f": "/assets/objects/obj_m_red_d1.png", "k": "obj_m_red_d1", "n": "m_red_d1"}, {"f": "/assets/objects/obj_m_red_d2.png", "k": "obj_m_red_d2", "n": "m_red_d2"}, {"f": "/assets/objects/obj_m_red_d3.png", "k": "obj_m_red_d3", "n": "m_red_d3"}, {"f": "/assets/objects/obj_m_yellow_d0.png", "k": "obj_m_yellow_d0", "n": "m_yellow_d0"}, {"f": "/assets/objects/obj_m_yellow_d1.png", "k": "obj_m_yellow_d1", "n": "m_yellow_d1"}, {"f": "/assets/objects/obj_m_yellow_d2.png", "k": "obj_m_yellow_d2", "n": "m_yellow_d2"}, {"f": "/assets/objects/obj_m_yellow_d3.png", "k": "obj_m_yellow_d3", "n": "m_yellow_d3"}, {"f": "/assets/objects/obj_pallet.png", "k": "obj_pallet", "n": "pallet"}, {"f": "/assets/objects/obj_plant.png", "k": "obj_plant", "n": "plant"}, {"f": "/assets/objects/obj_sign.png", "k": "obj_sign", "n": "sign"}]};
const ROOMS = CAT.rooms.map(r => [r.k, r.n]);

const show = { grid:true, floor:true, wall:false, alpha:0.85 };
const gridEl = document.getElementById('grid');
let canvases = [];

const TABS = [
  ['rooms','背景',  CAT.rooms.length,   2],
  ['machines','製造機', CAT.machines.length, 6],
  ['props','プロップ',  CAT.props.length,    8],
  ['hats','被り物',     CAT.hats.length,     6],
  ['objects','オブジェクト', CAT.objects.length, 8],
];
let tab = 'rooms', filter = '';

/* 背景だけは実機と同じ 1024x572 の舞台に載せてグリッドを重ねる。
   それ以外は素材そのものを見たいので、透過が分かる市松の上に原寸で並べる。 */
function render() {
  gridEl.innerHTML = '';
  canvases = [];
  const items = CAT[tab].filter(it =>
    !filter || (it.k + ' ' + it.n).toLowerCase().includes(filter.toLowerCase()));
  for (const it of items) {
    const card = document.createElement('div');
    card.className = 'card';
    const stage = tab === 'rooms'
      ? `<div class="stage"><img src="${it.f}" alt="${it.n}"><canvas width="${W}" height="${H}"></canvas></div>`
      : `<div class="stage flat"><img src="${it.f}" alt="${it.n}"></div>`;
    card.innerHTML =
      `<div class="cap"><b>${it.n}</b><span class="n">${it.k} <span data-px>…</span></span></div>` + stage;
    gridEl.appendChild(card);
    const img = card.querySelector('img');
    // 元画像の実寸。背景は 1376x768 が Stitch の標準、それ以外は要注意
    img.addEventListener('load', () => {
      card.querySelector('[data-px]').textContent = `${img.naturalWidth}×${img.naturalHeight}`;
    });
    img.addEventListener('error', () => {
      card.querySelector('[data-px]').textContent = '画像なし';
    });
    const cv = card.querySelector('canvas');
    if (cv) canvases.push(cv);
  }
  document.getElementById('count').textContent = `${items.length} / ${CAT[tab].length} 件`;
  document.getElementById('roomCtl').hidden   = tab !== 'rooms';
  document.getElementById('hintRooms').hidden = tab !== 'rooms';
  document.getElementById('hintOther').hidden = tab === 'rooms';
  drawAll();
}

const tabsEl = document.getElementById('tabs');
for (const [id, label, n, cols] of TABS) {
  const b = document.createElement('button');
  b.textContent = `${label} ${n}`;
  b.classList.toggle('on', id === tab);
  b.onclick = () => {
    tab = id;
    for (const o of tabsEl.children) o.classList.toggle('on', o === b);
    document.getElementById('cols').value = String(cols);
    setCols(cols);
    render();
  };
  tabsEl.appendChild(b);
}
document.getElementById('find').oninput = (e) => { filter = e.target.value; render(); };

function drawAll() {
  for (const cv of canvases) {
    const g = cv.getContext('2d');
    g.clearRect(0, 0, W, H);
    g.lineWidth = 1;

    if (show.grid) {
      g.strokeStyle = `rgba(51,255,204,${show.alpha})`;
      g.beginPath();
      for (let c = 0; c <= GU; c++) {           // u方向の境界線（手前↔奥）
        const a = uvXY(c / GU, 0), b = uvXY(c / GU, VMAX);
        g.moveTo(a.x, a.y); g.lineTo(b.x, b.y);
      }
      for (let r = 0; r <= 11; r++) {           // v方向の境界線（左↔右）11マスぶん
        const a = uvXY(0, r / GV), b = uvXY(1, r / GV);
        g.moveTo(a.x, a.y); g.lineTo(b.x, b.y);
      }
      g.stroke();
    }

    if (show.floor) {
      const P = [uvXY(0,0), uvXY(1,0), uvXY(1,VMAX), uvXY(0,VMAX)];   // 奥/右/手前/左
      g.strokeStyle = `rgba(255,94,200,${show.alpha})`;
      g.lineWidth = 2;
      g.beginPath();
      g.moveTo(P[0].x, P[0].y);
      for (let i = 1; i < 4; i++) g.lineTo(P[i].x, P[i].y);
      g.closePath(); g.stroke();
      g.fillStyle = `rgba(255,94,200,${show.alpha})`;
      for (const p of P) { g.beginPath(); g.arc(p.x, p.y, 3.5, 0, 7); g.fill(); }
      g.lineWidth = 1;
    }

    if (show.wall) {
      // 床の奥2辺から立ち上がる壁の想定線。壁裾が床の縁と合っているかを見る
      const back = uvXY(0,0), right = uvXY(1,0), left = uvXY(0,VMAX);
      const up = 168;   // 見当をつけるための高さ。壁の高さは絵ごとに違う
      g.strokeStyle = `rgba(255,208,138,${show.alpha})`;
      g.beginPath();
      for (const p of [back, right, left]) { g.moveTo(p.x, p.y); g.lineTo(p.x, p.y - up); }
      g.moveTo(back.x, back.y - up); g.lineTo(right.x, right.y - up);
      g.moveTo(back.x, back.y - up); g.lineTo(left.x, left.y - up);
      g.stroke();
    }
  }
}

const bind = (id, key) => {
  const b = document.getElementById(id);
  b.onclick = () => { show[key] = !show[key]; b.classList.toggle('on', show[key]); drawAll(); };
};
bind('bGrid','grid'); bind('bFloor','floor'); bind('bWall','wall');
document.getElementById('alpha').oninput = (e) => { show.alpha = e.target.value / 100; drawAll(); };
document.getElementById('imgA').oninput = (e) => {
  for (const im of document.querySelectorAll('.stage img')) im.style.opacity = e.target.value / 100;
};
const setCols = (n) => { gridEl.style.gridTemplateColumns = `repeat(${n},1fr)`; };
document.getElementById('cols').onchange = (e) => setCols(e.target.value);
setCols(2);
render();
</script>
